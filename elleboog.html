<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

<script src="atlas3d.js"></script>
<script>
// op een smal scherm zet de motor de camera tot 1,9 × verder weg: begin daarom dichter bij de arm
const NARROW=innerWidth<700;
Atlas3D({
 id:'elleboog',halte:5,name:'Elleboog',docTitle:'Elleboog · Bewegingsatlas',
 aria:'3D-zoomreis door de elleboog: van de arm als hefboom via het gewricht tot de peesaanhechting',
 loader:['De arm wordt opgebouwd…','Van halter tot collageenvezel'],
 seed:5,
 shadow:{left:-11,right:11,top:12,bottom:-5},
 levels:[
  {name:'Arm',scale:'30 cm',sc:'ARM · HEFBOOM',title:'De elleboog',sub:'<i>Articulatio cubiti</i> · de onderarm als hefboom',
   view:NARROW?[[-.4,6.6,9.6],[-2.5,5.0,0]]:[[3.4,6.4,19],[-1.3,4.1,0]],zoomTo:[-3.2,5.25,.35],s1:'Rust',s2:'Curl',s3:'Val',
   bg:['#3b3529','#1e1b15','#0c0b08'],fog:0x1e1b15,hemi:.6,shadows:true},
  {name:'Gewricht',scale:'5 cm',sc:'GEWRICHT',title:'Het ellebooggewricht',sub:'<i>Art. humeroulnaris · humeroradialis · radioulnaris proximalis</i>',
   view:NARROW?[[11,3.5,9],[-.2,-.3,0]]:[[21,5.5,17],[-.5,-.5,0]],zoomTo:[-.1,1.05,2.6],s1:'Rust',s2:'Draaien',s3:'Luxatie',
   bg:['#22303f','#111a24','#06090d'],fog:0x111a24,hemi:.5,drone:true},
  {name:'Peesaanhechting',scale:'1 mm',sc:'ENTHESE',title:'Waar pees overgaat in bot',sub:'<i>Enthesis fibrocartilaginea</i> · strekkerpees op de laterale epicondyl',
   view:[[-7,7,25],[-3.4,-.4,0]],s1:'Rust',s2:'Trek',s3:'Overbelast',
   bg:['#33263a','#19121e','#09060b'],fog:0x19121e,hemi:.8,drone:true}],
 help:{title:'Zo werkt de zoomreis',
  html:'<p>Je reist in drie stappen de elleboog in: van de <b>arm als hefboom</b> (30 cm), via het <b>gewricht</b> met banden en zenuw (5 cm), naar de <b>peesaanhechting</b> op het bot (1 mm). Zoom in met <b>+</b> en uit met <b>−</b>, of klik op de ladder links.</p><ul><li>Klik op een genummerd punt of direct op het model voor uitleg in vier tabjes.</li><li>In stand 2 van de arm kies je de oefening (curl of opdrukken), de last en de ellebooghoek. De HUD rekent het moment en de spierkracht live uit.</li><li>Kleuren: <b style="color:#ffd36a">geel</b> is het draaipunt, <b style="color:#9cc8ff">blauw</b> de last en de lastarm, <b style="color:#ffb36b">oranje</b> de spierkracht en de krachtarm. Banden zijn grijs als ze slap zijn, wit als ze gespannen zijn en rood als ze overrekt zijn.</li></ul><h3>Drie standen</h3><p><b>1 Rust</b>: vrij verkennen. <b>2 Belasting</b>: de curl en het opdrukken, het draaien van de onderarm, of trek op de pees. <b>3 Blessure</b>: een val op de gestrekte arm met een elleboogluxatie, of overbelasting van de pees (tennisarm).</p>',
  states:'Rust · belasting · blessure',
  keys:[['<kbd>S</kbd>','In stand 2 van de arm: tien graden verder buigen']],
  note:'Vereenvoudigd didactisch model: verhoudingen, aantallen en de rek van de pees zijn aangepast om het zichtbaar te maken. De getallen in de HUD rekenen met een lastarm van 35 cm en zonder het gewicht van de onderarm zelf, net als in het lab Evenwicht.'},
 film:{brand:'ELLEBOOG',blurb:'Hoe je elleboog kracht omzet · ca. 3,5 minuut · met stem en ondertitels',file:'elleboog-uitleg'},
 quizEnd:'<p>Bespreek de slotvraag met je groep. Oefen daarna in de gymzaal het afrollen bij een val, eerst vanuit hurkzit op de mat, en vergelijk opdrukken met de handen ver voor de schouders en recht onder de schouders: wat voel je in je triceps?</p>',
 build(K){
const {THREE,V,AX,AY,AZ,R,clamp,lerp,smooth,ease,bump,D2R,TAU,mesh,std,glass,glow,add,BAND,UCYL,orient,segMatrix,placeMatrix,ZERO,inst,tube,lathe,boneGeo,BONE,CART,MUSC,TEND,ENV,canvasTex,groups,W,S}=K;
const SND=K.SND;
const G0=groups[0],G1=groups[1],G2=groups[2];
const _a=V(0,0,0),_b=V(0,0,0),_c=V(0,0,0),_d=V(0,0,0),_t=V(0,0,0),_s=V(0,0,0),_n=V(0,0,0),_col=new THREE.Color(),_q=new THREE.Quaternion(),_o=new THREE.Object3D();
const GRAV=9.81;
const fmt=(v,d)=>(+v).toFixed(d===undefined?1:d).replace('.',',');
const ZV=V(0,0,1);

/* ---------- gedeelde materialen ---------- */
const boneTex=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#efe3c8';x.fillRect(0,0,w,h);for(let i=0;i<2200;i++){x.fillStyle=`rgba(${140+R()*60|0},${110+R()*50|0},${70+R()*40|0},${R()*.16})`;x.beginPath();x.arc(R()*w,R()*h,R()*2.6,0,TAU);x.fill();}for(let i=0;i<60;i++){x.strokeStyle=`rgba(150,120,80,${R()*.12})`;x.lineWidth=1;x.beginPath();const y=R()*h;x.moveTo(0,y);x.bezierCurveTo(w*.3,y+R()*20-10,w*.6,y+R()*20-10,w,y+R()*10-5);x.stroke();}},[2,2]);
const boneM=std(0xffffff,{map:boneTex,roughness:.55});
const cartM=std(0x6fb8e0,{roughness:.15,transparent:true,opacity:.62,depthWrite:false,emissive:0x0a2a40,emissiveIntensity:.5});
const handM=std(0xe6d3b0,{roughness:.55});
const ovm=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o===undefined?.95:o,depthTest:false,depthWrite:false});

/* ---------- een spier van losse vezels (instancing), met een doorzichtig vlies ---------- */
// buik als kwadratische boog van O naar I; vezels tussen ta en tb, pezen aan beide kanten
function makeMuscle(o){const N=o.N,KK=o.K,P=o.parent;
  const mat=std(0xffffff,{roughness:.5});const im=inst(UCYL,mat,N*KK);P.add(im);
  const sh=inst(new THREE.SphereGeometry(1,20,14),glass(o.sheath||0xeab3a2,.15),KK+1);sh.castShadow=false;sh.receiveShadow=false;P.add(sh);
  const cs=K.sunflower(N).map(p=>({u:p[0],v:p[1],c:.86+R()*.24}));
  const tm=TEND();const tA=mesh(BAND,tm,0,0,0,P),tB=mesh(BAND,tm,0,0,0,P);
  const C=V(0,0,0),pt=[];for(let j=0;j<=KK;j++)pt.push({p:V(0,0,0),s:V(0,0,0),r:0});
  const M={im,sh,tA,tB,mat,N,K:KK,L0:0,len:1,act:0,mode:'rust',belly:V(0,0,0),side:V(0,0,0),mid:V(0,0,0),hot:0};
  function bez(t,O,I,out){const u=1-t;return out.set(u*u*O.x+2*u*t*C.x+t*t*I.x,u*u*O.y+2*u*t*C.y+t*t*I.y,u*u*O.z+2*u*t*C.z+t*t*I.z);}
  function tan(t,O,I,out){return out.set(2*(1-t)*(C.x-O.x)+2*t*(I.x-C.x),2*(1-t)*(C.y-O.y)+2*t*(I.y-C.y),2*(1-t)*(C.z-O.z)+2*t*(I.z-C.z)).normalize();}
  M.update=function(O,I,act,mode){const L=O.distanceTo(I);if(!M.L0)M.L0=L;M.len=L/M.L0;const bulge=clamp(Math.sqrt(M.L0/L),.8,1.4);
    _d.subVectors(I,O).normalize();_n.crossVectors(ZV,_d).normalize();C.addVectors(O,I).multiplyScalar(.5).addScaledVector(_n,o.bow*bulge);
    const segL=L*(o.tb-o.ta)/KK;
    for(let j=0;j<=KK;j++){const t=o.ta+(o.tb-o.ta)*j/KK,q=pt[j];bez(t,O,I,q.p);tan(t,O,I,_t);q.s.crossVectors(ZV,_t).normalize();const s=j/KK;q.r=o.R*(o.prof?o.prof(s):.28+.72*Math.pow(Math.sin(Math.PI*s),.7))*bulge;
      _q.setFromUnitVectors(AY,_t);_o.position.copy(q.p);_o.quaternion.copy(_q);_o.scale.set(q.r*1.12,segL*.78,q.r*.98);_o.updateMatrix();sh.setMatrixAt(j,_o.matrix);}
    sh.instanceMatrix.needsUpdate=true;
    let k=0;for(let i=0;i<N;i++){const f=cs[i];for(let j=0;j<KK;j++){const A=pt[j],B=pt[j+1];
      _a.copy(A.p).addScaledVector(A.s,f.u*A.r).addScaledVector(ZV,f.v*A.r*.88);_b.copy(B.p).addScaledVector(B.s,f.u*B.r).addScaledVector(ZV,f.v*B.r*.88);
      _t.subVectors(_b,_a).multiplyScalar(.05);_a.sub(_t);_b.add(_t);im.setMatrixAt(k++,segMatrix(_a,_b,o.fw||.05));}}
    im.instanceMatrix.needsUpdate=true;
    if(Math.abs(act-M.act)>.004||mode!==M.mode||!M.colored){M.colored=true;M.act=act;M.mode=mode;const ecc=mode==='excentrisch';
      k=0;for(let i=0;i<N;i++){const c=cs[i].c;for(let j=0;j<KK;j++){_col.setRGB(.6*c+.36*act+(ecc?.06*act:0),.16*c+.05*act+(ecc?.1*act:0),.13*c+.02*act);im.setColorAt(k++,_col);}}im.instanceColor.needsUpdate=true;
      mat.emissive.setRGB(.28*act,.06*act,.02*act);}
    orient(tA,O,pt[0].p,o.tw||.05,o.td||.035);orient(tB,pt[KK].p,I,o.tw2||.045,o.td||.03);
    const mj=pt[KK>>1];M.mid.copy(mj.p);M.belly.copy(mj.p).addScaledVector(mj.s,mj.r*(o.bow>0?1:-1)).addScaledVector(ZV,mj.r*.5);M.side.copy(mj.s);};
  M.objs=()=>[im,sh,tA,tB];M.endP=pt[KK].p;M.startP=pt[0].p;M.bulge=()=>clamp(Math.sqrt(1/M.len),.8,1.4);
  return M;}

/* ---------- een ketting van segmenten langs een kromme (pees, zenuw, vat) die per beeld mag bewegen ---------- */
function catm(p,t,out){const n=p.length-1,f=clamp(t,0,1)*n,i=Math.min(n-1,Math.floor(f)),u=f-i;const p0=p[Math.max(0,i-1)],p1=p[i],p2=p[i+1],p3=p[Math.min(n,i+2)];
  const u2=u*u,u3=u2*u;const a=-.5*u3+u2-.5*u,b=1.5*u3-2.5*u2+1,c=-1.5*u3+2*u2+.5*u,d=.5*u3-.5*u2;
  return out.set(a*p0.x+b*p1.x+c*p2.x+d*p3.x,a*p0.y+b*p1.y+c*p2.y+d*p3.y,a*p0.z+b*p1.z+c*p2.z+d*p3.z);}
function chain(n,r,mat,parent,np){const im=inst(UCYL,mat,n);parent.add(im);const pts=[];for(let i=0;i<np;i++)pts.push(V(0,0,0));const sm=[];for(let i=0;i<=n;i++)sm.push(V(0,0,0));
  const C={im,pts,sm,n,r,upd(rad){const rr=rad||r;for(let i=0;i<=n;i++)catm(pts,i/n,sm[i]);for(let i=0;i<n;i++){_a.copy(sm[i]);_b.copy(sm[i+1]);_t.subVectors(_b,_a).multiplyScalar(.12);_a.sub(_t);_b.add(_t);im.setMatrixAt(i,segMatrix(_a,_b,typeof rr==='function'?rr(i/n):rr));}im.instanceMatrix.needsUpdate=true;},at(t,out){return catm(pts,t,out||V(0,0,0));}};
  return C;}

/* =====================================================================
   NIVEAU 0 · de arm als hefboom (1 eenheid = 10 cm)
   Het model kijkt naar +x (voorkant), +z is de buitenkant (lateraal) van de rechterarm.
   ===================================================================== */
K.base({parent:G0,floor:'gym',plaque:['ARTICULATIO CUBITI','de onderarm als hefboom · biceps en triceps'],plaqueX:-1.4});
const SX=-3.2,EY=5.25,E0=V(SX,EY,0);
// standaard met twee palen, dwarsbalk en een klem om de schouderkop
mesh(new THREE.BoxGeometry(4.2,.22,2.8),ENV.metal,[SX,.19,-.3],0,0,G0);
// tweede naambord op de voetplaat van de standaard, zodat het in beeld blijft boven de HUD
mesh(new THREE.BoxGeometry(2.7,.46,.05),[ENV.metal,ENV.metal,ENV.metal,ENV.metal,std(0xffffff,{map:K.plaqueTex('ARTICULATIO CUBITI','de onderarm als hefboom'),metalness:.6,roughness:.35}),ENV.metal],[SX,.5,1.16],[-.42,0,0],0,G0);
[-1.75,1.75].forEach(dx=>mesh(new THREE.CylinderGeometry(.09,.09,9.6,14),ENV.metal,[SX+dx,5,-1.15],0,0,G0));
mesh(new THREE.CylinderGeometry(.1,.1,3.7,14),ENV.metal,[SX,9.75,-1.15],[0,0,Math.PI/2],0,G0);
mesh(new THREE.BoxGeometry(.26,1.0,.26),ENV.dark,[SX,9.2,-1.15],0,0,G0);
mesh(new THREE.BoxGeometry(.22,.22,1.05),ENV.dark,[SX,8.75,-.62],0,0,G0);
mesh(new THREE.SphereGeometry(.42,24,16,0,TAU,0,Math.PI*.5),std(0x24282c,{metalness:.5,roughness:.4,side:THREE.DoubleSide}),[SX-.05,8.42,0],0,0,G0);
[-1,1].forEach(s=>mesh(new THREE.CylinderGeometry(.05,.05,.5,10),ENV.metal,[SX-.05,8.55,s*.3],[Math.PI/2,0,0],0,G0));
// gradenboog achter de elleboog: 0° is gestrekt, de onderarm wijst zelf de hoek aan
const protTex=canvasTex(512,512,(x,w,h)=>{const c=w/2,r0=c-6;x.clearRect(0,0,w,h);
  x.fillStyle='rgba(18,22,26,.36)';x.beginPath();x.moveTo(c,c);x.arc(c,c,r0,Math.PI/2+12*D2R,Math.PI/2-152*D2R,true);x.closePath();x.fill();
  x.strokeStyle='rgba(239,227,200,.9)';x.fillStyle='#efe3c8';x.textAlign='center';x.textBaseline='middle';
  for(let a=-10;a<=150;a+=5){const ang=Math.PI/2-a*D2R,big=a%30===0;x.lineWidth=big?4:2;x.beginPath();x.moveTo(c+Math.cos(ang)*r0,c+Math.sin(ang)*r0);x.lineTo(c+Math.cos(ang)*(r0-(big?34:18)),c+Math.sin(ang)*(r0-(big?34:18)));x.stroke();
    if(big&&a>=0){x.font='600 30px "JetBrains Mono", monospace';x.fillStyle=a===90?'#e6b65e':'#efe3c8';x.fillText(a+'°',c+Math.cos(ang)*(r0-62),c+Math.sin(ang)*(r0-62));}}
  x.strokeStyle='rgba(230,182,94,.8)';x.lineWidth=5;x.beginPath();x.arc(c,c,r0-90,Math.PI/2-80*D2R,Math.PI/2-100*D2R,true);x.stroke();});
protTex.wrapS=protTex.wrapT=THREE.ClampToEdgeWrapping;
const prot=mesh(new THREE.PlaneGeometry(2.9,2.9),new THREE.MeshBasicMaterial({map:protTex,transparent:true,opacity:.85,depthWrite:false}),[SX,EY,-.46],0,0,G0);prot.castShadow=false;prot.receiveShadow=false;
mesh(new THREE.CylinderGeometry(.035,.035,.7,8),ENV.metal,[SX-1.75,EY,-.8],[Math.PI/2,0,0],0,G0);
mesh(new THREE.BoxGeometry(1.8,.05,.05),ENV.metal,[SX-.9,EY,-.47],0,0,G0);

// opperarmbeen: schacht, kop en de rol van de elleboog (trochlea en capitulum)
const hum0=mesh(boneGeo(3.1,.15,1.25,1.1),boneM,[SX,EY-.03,0],0,[.74,1,1.12],G0);
const head0=mesh(new THREE.SphereGeometry(.31,26,18),boneM,[SX-.04,8.4,0],0,0,G0);
const troch0=mesh(new THREE.CylinderGeometry(.19,.19,.34,26),boneM,[SX,EY,-.09],[Math.PI/2,0,0],0,G0);
const capit0=mesh(new THREE.SphereGeometry(.165,20,14),boneM,[SX+.03,EY,.17],0,0,G0);
mesh(new THREE.CylinderGeometry(.2,.2,.3,26),cartM,[SX,EY,-.09],[Math.PI/2,0,0],0,G0).castShadow=false;
const epiM0=mesh(new THREE.SphereGeometry(.13,16,12),boneM,[SX-.03,EY+.13,-.34],0,[1,1,1.15],G0);
const epiL0=mesh(new THREE.SphereGeometry(.1,16,12),boneM,[SX-.02,EY+.11,.31],0,0,G0);
// onderarm: ellepijp met olecranon, spaakbeen met radiuskopje en ringband, hand met halter
const FA0=new THREE.Group();FA0.position.copy(E0);G0.add(FA0);
const ulna0=mesh(boneGeo(3.1,.085,1.5,.8),boneM,[-.03,.08,-.12],[Math.PI,0,0],0,FA0);
const olec0=mesh(new THREE.SphereGeometry(.15,18,14),boneM,[-.17,.1,-.12],0,[1,1.35,1],FA0);
mesh(new THREE.SphereGeometry(.07,12,10),boneM,[.13,-.12,-.1],0,0,FA0);
const rad0=mesh(boneGeo(3.1,.075,.7,1.9),boneM,[.03,-.1,.17],[Math.PI,0,0],0,FA0);
const rhead0=mesh(new THREE.CylinderGeometry(.13,.12,.1,22),boneM,[.03,-.13,.17],0,0,FA0);
const ring0=mesh(new THREE.TorusGeometry(.145,.03,8,26),TEND(),[.03,-.17,.17],[Math.PI/2,0,0],0,FA0);
const HAND0=new THREE.Group();HAND0.position.set(-.09,-3.18,.03);FA0.add(HAND0);   // greep precies op de lengteas van de onderarm
mesh(new THREE.CapsuleGeometry(.1,.14,4,12),handM,[0,-.12,0],0,[.62,1,1.3],HAND0);
const finger=(a,b,r)=>{const m=mesh(BAND,handM,0,0,0,HAND0);orient(m,a,b,r);mesh(new THREE.SphereGeometry(r*1.05,10,8),handM,[b.x,b.y,b.z],0,0,HAND0);return m;};
[-.15,-.05,.05,.15].forEach((z,i)=>{const l=i===0||i===3?.92:1;finger(V(.03,-.26,z),V(.14*l,-.37,z),.034);finger(V(.15*l,-.36,z),V(.2*l,-.29,z),.031);finger(V(.2*l,-.29,z),V(.16*l,-.23,z),.028);});
finger(V(.05,-.13,.14),V(.15,-.2,.16),.036);finger(V(.15,-.2,.16),V(.2,-.26,.1),.032);
const DB0=new THREE.Group();DB0.position.set(.09,-.31,0);HAND0.add(DB0);
const knurl=canvasTex(64,256,(x,w,h)=>{x.fillStyle='#8d949b';x.fillRect(0,0,w,h);x.strokeStyle='rgba(40,44,48,.6)';for(let i=-h;i<h*2;i+=8){x.beginPath();x.moveTo(0,i);x.lineTo(w,i+w);x.stroke();x.beginPath();x.moveTo(w,i);x.lineTo(0,i+w);x.stroke();}});

 {lv:0,name:'Tweehoofdige armspier',lat:'M. biceps brachii · tuberositas radii',at:()=>W.bic,view:[[SX+3.4,6.9,5.2],[SX+.4,6.1,0]],focus:()=>BIC.objs(),layer:'Spieren',tabs:[
  `<p>De <b>biceps</b> heeft twee koppen die boven aan het schouderblad beginnen. Onderaan hecht de pees aan de <b>tuberositas radii</b>, een knobbel op het spaakbeen, ongeveer 4 cm onder de as van de elleboog.</p><p>De biceps buigt de elleboog en draait de onderarm naar buiten (<b>supinatie</b>). Omdat hij over twee gewrichten loopt, helpt hij ook een beetje bij het heffen van de arm naar voren. Meer over de schouder bij <a href="schouder.html">halte 2</a>.</p>`,
  `<p>Bij de <b>bicepscurl</b> werkt hij omhoog concentrisch en omlaag excentrisch. Laat de halter gecontroleerd zakken in ongeveer twee tellen: dan train je ook het excentrische deel. Zwaaien met de romp haalt het werk juist weg bij de biceps.</p><p>Bij <b>optrekken</b> aan de rekstok met de handpalmen naar je toe werkt de biceps harder dan met de handpalmen van je af.</p>`,
  `<p>Met 5 kg in de hand en de elleboog op 90° rekent de HUD bijna negen keer de last aan spierkracht uit. In werkelijkheid delen biceps, brachialis en brachioradialis die kracht.</p><div class="calc">M = 5 · 9,81 · 0,35 ≈ 17 N·m<br>F = 17 / 0,04 ≈ 430 N</div>`,
  `<p class="think">Waarom kun je een halter makkelijker vasthouden met de elleboog bijna gestrekt dan op 90°, terwijl de halter even zwaar is? Probeer het met de hoekschuif in stand 2.</p>`]},
 {lv:0,name:'Opperarmspier',lat:'M. brachialis · tuberositas ulnae',at:()=>W.bra,view:[[SX+3.2,5.6,4.6],[SX+.3,5.6,0]],focus:()=>BRA.objs(),layer:'Spieren',tabs:[
  `<p>De <b>brachialis</b> ligt onder de biceps, tegen de voorkant van het opperarmbeen. Hij hecht aan de ellepijp, vlak onder het gewricht. Daarom draait hij niet mee als de onderarm draait.</p><p>Hij is de <b>werkpaard-buiger</b>: hij buigt de elleboog in elke stand van de onderarm, met de handpalm omhoog, opzij of omlaag.</p>`,
  `<p>Bij een curl met de handpalm omlaag (<b>reverse curl</b>) of met de duim omhoog (<b>hamercurl</b>) doen brachialis en brachioradialis relatief meer werk dan de biceps. Met de handpalm omlaag til je daarom minder.</p>`,
  `<p>De elleboog heeft drie buigers (biceps, brachialis en brachioradialis) en aan de achterkant één grote strekker (triceps), met hulp van de kleine m. anconeus. De HUD rekent alsof de biceps alles alleen doet. Dat maakt de som eenvoudig, maar de echte kracht per spier is lager.</p>`,
  `<p class="think">Waarom draait de brachialis niet mee als je de onderarm draait, en de biceps wel? Kijk waar ze aanhechten (zoom in op het gewricht).</p>`]},
 {lv:0,name:'Driehoofdige armspier',lat:'M. triceps brachii · olecranon',at:()=>W.tri,view:[[SX-3.4,6.6,5.4],[SX-.4,6,0]],focus:()=>TRI.objs(),layer:'Spieren',tabs:[
  `<p>De <b>triceps</b> ligt aan de achterkant van de opperarm. Zijn drie koppen komen samen in één pees op het <b>olecranon</b>, de punt van de ellepijp achter de as. Hij <b>strekt</b> de elleboog.</p><p>Kies in stand 2 <b>Opdrukken</b>. De triceps trekt aan het olecranon aan de ene kant van de as, de vloer duwt tegen de hand aan de andere kant. Draaipunt in het midden: een hefboom van de <b>eerste soort</b>.</p>`,
  `<p>Bij <b>opdrukken</b> werkt de triceps excentrisch als je zakt en concentrisch als je omhoog duwt. Bij een <b>handstand</b> of bij <b>steunen</b> aan de brug houdt hij de elleboog gestrekt. Bij de curl is hij de <b>antagonist</b>: hij ontspant en wordt passief langer. Wat er in een spier gebeurt bij excentrisch werk, zie je van dichtbij in <a href="spier.html">halte 8</a>.</p>`,
  `<p>De krachtarm van de triceps is maar ongeveer 2 cm. Daarom rekent de HUD bij opdrukken al snel meer dan 1000 N tricepskracht, terwijl de vloer per hand ongeveer 220 N duwt (sporter van 70 kg, 64% van het gewicht op de handen; Ebben e.a., 2011). Op de knieën is dat ongeveer 49%: een kortere lastarm voor je hele lichaam.</p>`,
  `<p class="think">Waarom wordt opdrukken zwaarder als je de handen verder voor je schouders zet? Denk aan de lastarm van de steunkracht.</p>`]},
 {lv:0,name:'Draaipunt en hefboomarmen',lat:'Articulatio humeroulnaris · as van de elleboog',at:()=>W.axis,view:[[SX+2.6,5.6,7.4],[SX+1,4.9,0]],focus:()=>[LEV,FA0],pick:()=>[pivot],layer:'Hefboom',state:2,tabs:[
  `<p>Een hefboom heeft een <b>draaipunt</b> (gele stip: de as van de elleboog), een <b>krachtarm</b> (oranje: de loodrechte afstand van het draaipunt tot de werklijn van de spierkracht) en een <b>lastarm</b> (blauw: de afstand tot de werklijn van de last).</p><p>Bij de curl zitten spierkracht en last aan <b>dezelfde kant</b> van het draaipunt, en de spier zit het dichtst bij: een hefboom van de <b>derde soort</b>. Bij opdrukken zit het draaipunt tussen triceps en hand: de <b>eerste soort</b>.</p>`,
  `<p>Met dezelfde regel, <b>M = F · d</b>, maak je in de les een oefening lichter of zwaarder: opdrukken op de knieën, zijwaarts heffen met gebogen of gestrekte arm, de halter dichter bij je lichaam. Het is allemaal hefboomlengte. Reken het na in het lab <a href="evenwicht.html">Evenwicht</a> (week 3 Momenten).</p>`,
  `<p>De lastarm is niet de lengte van de onderarm, maar de <b>horizontale</b> afstand tot de werklijn van de zwaartekracht. Bij 90° is die 35 cm, bij 30° nog maar 17,5 cm.</p><div class="calc">d = 0,35 · sin 30° = 0,175 m</div>`,
  `<p class="think">Een hefboom van de derde soort kost veel spierkracht. Wat levert hij juist op? Kijk hoe ver de hand beweegt als de bicepspees een paar centimeter korter wordt.</p>`]},
 {lv:1,name:'Opperarmbeen en epicondylen',lat:'Humerus · epicondylus medialis et lateralis',at:()=>W.epiL1,view:[[3.5,3.5,12],[-.1,1,.5]],focus:()=>[HUM1],tabs:[
  `<p>Onderaan wordt het <b>opperarmbeen</b> breed. Aan de binnenkant zit de <b>mediale epicondyl</b>, aan de buitenkant de <b>laterale epicondyl</b>: daar beginnen de buigers en de strekkers van pols en vingers.</p><p>Daartussen ligt de rol van het gewricht: de <b>trochlea</b> voor de ellepijp en het bolletje, het <b>capitulum</b>, voor het spaakbeen. Het blauwe laagje is glad <b>kraakbeen</b>.</p>`,
  `<p>Bij een <b>tennisarm</b> is de pees van de strekkers op de laterale epicondyl overbelast, bij een <b>golfarm</b> die van de buigers op de mediale epicondyl. Zoom in (<b>+</b>) om de aanhechting van de strekkerpees te zien.</p>`,
  `<p>Bij kinderen is de mediale epicondyl nog niet vastgegroeid: die groeischijf sluit pas rond 15 à 17 jaar. Bij jonge werpers kan daar een stukje bot loskomen.</p>`,
  `<p class="think">Waarom zit de grootste knobbel aan de binnenkant? Denk aan de spieren die er vastzitten en aan de krachten bij werpen.</p>`]},
 {lv:1,name:'Ellepijp en olecranon',lat:'Ulna · olecranon · incisura trochlearis',at:()=>W.olec1,view:[[-8,3.1,6],[-.8,-.8,-.6]],focus:()=>[notch1,olec1,coro1,ulna1],tabs:[
  `<p>De <b>ellepijp</b> grijpt met een halvemaanvormige inkeping om de trochlea. Dat is het eigenlijke scharnier: het <b>humero-ulnaire gewricht</b>. De achterste punt is het <b>olecranon</b>: het puntje van je elleboog en de aanhechting van de triceps.</p><p>Bij volledige strekking klikt het olecranon in een kuiltje achter op het opperarmbeen, de <b>fossa olecrani</b>. Die botvergrendeling remt de strekking.</p>`,
  `<p>Steunen in de <b>brug</b> of een <b>handstand</b> op gestrekte armen kan dankzij die vergrendeling: de elleboog staat stabiel met weinig spierwerk. Wordt de elleboog verder overstrekt, dan wordt het olecranon een draaipunt en kan de elleboog uit de kom (stand 3). Een kort, hard contact met de grond geeft een hoge piekkracht: reken het na in het lab <a href="landing.html">Landing</a>.</p>`,
  `<p>Normaal buig je de elleboog tot ongeveer 145°. Sommige mensen kunnen 5 à 10° overstrekken; dat komt vaker voor bij vrouwen en kinderen.</p>`,
  `<p class="think">Waarom is het riskant om een val op te vangen met een volledig gestrekte arm, juist omdat het gewricht dan zo vast staat?</p>`]},
 {lv:1,name:'Spaakbeen en radiuskopje',lat:'Radius · caput radii · lig. anulare radii',at:()=>W.rhead1,view:CAM_ROT1,focus:()=>[RAD1,ANN],state:2,tabs:[
  `<p>Het <b>spaakbeen</b> heeft bovenaan een rond kopje met een kommetje dat tegen het capitulum ligt. Het kopje draait in een ring: de <b>ringband</b>. Zo kan de radius om de ulna draaien.</p><p>Bij <b>pronatie</b> kruist de radius over de ulna en wijst de handpalm (bij een gebogen elleboog) omlaag, bij <b>supinatie</b> draait hij terug en wijst de handpalm omhoog. Kijk naar de duim (geel) en de handpalm (blauw).</p>`,
  `<p>Bij jonge kinderen is de ringband nog slap. Trek je aan de hand of de onderarm, bij het optillen of rondzwaaien, dan kan het kopje half uit de ring schieten: het <b>zondagsarmpje</b>. Geef in het PO hulp bij de bovenarm of de romp en trek nooit aan de handen.</p>`,
  `<p>Het zondagsarmpje komt vooral voor bij kinderen van 1 tot 5 jaar. Het is de meest voorkomende elleboogblessure op die leeftijd.</p>`,
  `<p class="think">Waarom draait bij pronatie alleen de radius en niet de ulna? Wat zou er met het scharnier gebeuren als de ulna wel zou draaien?</p>`]},
 {lv:1,name:'Collaterale banden',lat:'Lig. collaterale ulnare et radiale',at:()=>W.lcl1,view:[[2.5,2,11.5],[0,-.3,1.4]],focus:()=>[].concat(LIG1.lcl.arr,LIG1.lucl.arr,LIG1.mcla.arr,LIG1.mclp.arr,[ANN]),layer:'Banden',tabs:[
  `<p>Aan beide kanten loopt een waaier van bandvezels: de <b>mediale band</b> (lig. collaterale ulnare) van de mediale epicondyl naar de ellepijp, en de <b>laterale band</b> (lig. collaterale radiale) van de laterale epicondyl naar de ringband. Ze houden het scharnier zijwaarts stabiel.</p><p>Grijs is slap, wit gespannen, rood overrekt. Kies stand 3 en vergelijk graad 1, 2 en 3.</p>`,
  `<p>Bij <b>werpen</b> (handbal, speerwerpen) staat de mediale band onder grote spanning, omdat de onderarm in de uithaal naar buiten wordt gedrukt. Bij een val op de gestrekte arm scheurt vaak eerst de <b>laterale</b> kant.</p>`,
  `<p>Bij speer- en honkbalwerpers wordt een versleten mediale band soms vervangen door een pees: de Tommy John-operatie, voor het eerst uitgevoerd in 1974.</p><p>Het hefboommodel met het olecranon als draaipunt is de klassieke uitleg van een luxatie. Onderzoek naar echte vallen (O'Driscoll e.a., 1992; Schreiber e.a., 2013) laat zien dat ook een zijwaartse knik en draaiing van de onderarm meespelen, en dat de volgorde per val verschilt.</p>`,
  `<p class="think">Waarom scheuren de banden in dit model eerst aan de buitenkant? Kijk in stand 3 welke kant de ellepijp op schuift.</p>`]},
 {lv:1,name:'Ellepijpzenuw',lat:'N. ulnaris · sulcus nervi ulnaris',at:()=>W.nerve1,view:[[-10.5,3.6,-9.5],[-.8,.8,-2]],focus:()=>[NV1.im,epiM1],pick:()=>[NV1.im],layer:'Zenuw en vaten',tabs:[
  `<p>De <b>n. ulnaris</b> loopt in een gootje achter de mediale epicondyl, vlak onder de huid. Stoot je daar je elleboog, dan voel je een tinteling tot in je pink en ringvinger. Het <b>telefoonbotje</b> is dus geen bot maar een zenuw.</p><p>De zenuw stuurt kleine handspieren aan en geeft gevoel aan de pinkkant van de hand.</p>`,
  `<p>Bij een luxatie (stand 3) kan de zenuw worden opgerekt. Tintelingen of een doof gevoel in pink en ringvinger na een val zijn een reden om direct een arts te laten kijken. Lang leunen op de elleboog, of lang liggen met een sterk gebogen elleboog, kan de zenuw hier ook irriteren. Bij wielrenners raakt dezelfde zenuw juist bij de pols in de knel, door druk op het stuur.</p>`,
  `<p>Een impuls in de n. ulnaris loopt met ongeveer 50 à 60 m/s. Over de 30 cm van elleboog tot pink duurt dat zo'n 5 milliseconden. Meer over zenuwen bij <a href="zenuw.html">halte 1</a>.</p>`,
  `<p class="think">Waarom ligt juist deze zenuw zo kwetsbaar, terwijl de andere grote armzenuwen dieper liggen?</p>`]},
 {lv:2,name:'Pees en collageenvezels',lat:'Tendo · fibrae collagenae · endotenon',at:()=>W.fib2,view:[[-6,3.5,9],[-4.5,0,0]],focus:()=>[FB2],state:2,tabs:[
  `<p>Een pees is gebouwd uit <b>collageenvezels</b> in bundels, elk in een dun vliesje (endotenon). In rust liggen de vezels in golfjes: de <b>crimp</b>. Trek je aan de pees, dan trekken eerst die golfjes recht en daarna rekken de vezels zelf.</p><p>In de spanning-rekcurve zie je eerst de <b>teenregio</b> (tot ongeveer 2%), dan het <b>lineaire</b> gebied (tot ongeveer 4%). Daarboven ontstaan microscheurtjes.</p>`,
  `<p>Pezen zijn veren: bij elke tik tegen een bal of elke landing slaan ze energie op en geven die terug. Een pees wordt sterker door <b>geleidelijk opbouwen</b>, met zware en langzame oefeningen. Pezen passen zich trager aan dan spieren; een snelle krachttoename geeft dus tijdelijk extra risico.</p>`,
  `<p>Een pees kan ongeveer 100 MPa trekspanning hebben: een pees van 1 cm² doorsnede draagt zo'n 10.000 N.</p><div class="calc">100 MPa · 0,0001 m² = 10.000 N</div>`,
  `<p class="think">Waarom is het handig dat een pees in het begin makkelijk rekt (teenregio) en daarna stijf wordt?</p>`]},
 {lv:2,name:'Enthese',lat:'Enthesis fibrocartilaginea · tidemark',at:()=>W.tide2,view:[[4,4.5,14.5],[1.6,0,.8]],focus:()=>[ufc2,calc2,tide2,CHOI,LACI,cort2],tabs:[
  `<p>Waar pees overgaat in bot verandert het weefsel stap voor stap: <b>pees</b>, <b>vezelkraakbeen</b>, een grenslijn (<b>tidemark</b>, blauw), <b>verkalkt vezelkraakbeen</b> en dan <b>bot</b>.</p><p>Zo gaat een zachte, rekbare pees geleidelijk over in hard bot, zonder scherpe overgang waar alle spanning zich zou ophopen.</p>`,
  `<p>De gemeenschappelijke strekkerpees op de laterale epicondyl trekt bij elke <b>backhand</b> en bij elk stevig vastpakken. Bij een tennisarm zit de schade vooral hier, vlak bij de aanhechting, meestal in het deel van de <b>m. extensor carpi radialis brevis</b>.</p><p>Omdat er weinig ontsteking is, spreken artsen liever van tendinopathie of epicondylalgie dan van epicondylitis.</p>`,
  `<p>De hele overgang van pees naar bot is maar een paar honderd micrometer dik, minder dan een halve millimeter.</p>`,
  `<p class="think">Wat zou er gebeuren als pees en bot direct op elkaar zaten, zonder de tussenlagen? Waar zou het dan scheuren?</p>`]},
 {lv:2,name:'Peescellen',lat:'Tenocyti · chondrocyti',at:()=>W.ten2,view:[[-2,5.0,7.5],[-2.5,2.3,0]],focus:()=>[TENI,CHOI],layer:'Cellen',state:3,tabs:[
  `<p>Tussen de vezels liggen lange, platte <b>peescellen</b> (paars). Ze maken collageen en ruimen beschadigd collageen op. In het vezelkraakbeen liggen rondere <b>kraakbeencellen</b> (lila) in holtes.</p><p>Bij overbelasting (stand 3) worden de peescellen <b>rond</b>, raken de vezels <b>ongeordend</b> en groeien er <b>nieuwe vaatjes</b> de pees in. Dat beeld heet <b>tendinopathie</b>.</p>`,
  `<p>Een tennisarm krijg je niet alleen van tennis, ook van klussen, veel muiswerk of een te zwaar racket. De klachten bouwen vaak langzaam op. Herstel vraagt tijd en geleidelijk opbouwende belasting; helemaal niets doen maakt een pees juist zwakker.</p>`,
  `<p>Op elk moment heeft ongeveer 1 à 3% van de volwassenen een tennisarm (in Finland 1,3%; Shiri e.a., 2006), vooral tussen 35 en 55 jaar. Maar zo'n 5 à 10% van hen speelt tennis.</p>`,
  `<p class="think">Waarom helpt geleidelijk opbouwend belasten een pees beter te herstellen dan volledige rust?</p>`]},
];

// tot 820 px breed liggen het infopaneel en de speurtocht als een la over de onderste helft van het beeld (atlas3d.css).
// Schuif camera en doel dan omlaag, zodat het onderdeel of de letters in de bovenste helft staan. De verschuiving rekent met
// de afstand en de kijkhoek die de motor op dit scherm gebruikt (staand tot 1,9 × verder weg en 48° in plaats van 36°),
// en met een ankerpunt dat hoger of lager ligt dan het doel van de camera.
if(innerWidth<=820){const asp=innerWidth/innerHeight,port=asp<1,mul=port?Math.min(1.9,1/Math.pow(asp,.85)):1,tn=Math.tan((port?24:18)*D2R);
  try{H0.step(0);}catch(e){}   // zet de ankerpunten van de arm (niveau 0 rekent ze pas in step uit)
  // f: hoe ver boven het midden het doel komt (deel van de halve beeldhoogte), h: hoeveel hoger het anker ligt dan het doel, k: camera verder weg
  const lift=(v,f,h,k)=>{const P=V(...v[0]),T=V(...v[1]);if(k)P.sub(T).multiplyScalar(k).add(T);const d=f*mul*tn*P.distanceTo(T)-(h||0);return [[P.x,P.y-d,P.z],[T.x,T.y-d,T.z]];};
  // het anker telt alleen mee bij punten zonder eigen stand: bij een eigen stand ligt het daar ergens anders dan nu (in rust)
  POINTS.forEach(p=>{if(!p.view)return;let h=0;if(!p.state){try{const a=p.at();if(a&&a.isVector3)h=a.y-p.view[1][1];}catch(e){}}p.view=lift(p.view,.45,h);});
  // vier letters vragen meer hoogte: op een liggend scherm gaat de camera daarom iets verder weg
  QUIZ.forEach(q=>{if(q.type==='find'&&q.view)q.view=lift(q.view,.3,0,port?0:1.3);});}
