.tg.ecgt{color:#9ff0c0;border-color:rgba(120,230,160,.5)}
#capX .cyc{display:block;font:600 11px "JetBrains Mono",monospace;color:var(--muted);margin-bottom:3px}
#capX .cyc b{color:var(--gold)}
/* ECG en hartslag in de film (de HUD is dan verborgen) */
#filmEcg{position:absolute;right:28px;top:70px;z-index:7;display:none;pointer-events:none;background:rgba(6,18,14,.74);border:1px solid rgba(120,220,160,.35);border-radius:10px;padding:6px 8px 8px}
body.film #filmEcg.on{display:block}

  #filmEcg{right:12px;padding:4px 6px 6px}#filmEcg canvas{width:150px;height:40px}#filmEcg b{font-size:13px}

  .hh.s3 #steps{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .hh.s3 #steps::-webkit-scrollbar{display:none}
  .hh.s3 #steps span{padding:4px 6px;font-size:10px}
  .hh.s3 canvas.ecg{height:28px}
  #capX .cyc{display:none}
  .hh{flex-wrap:wrap;gap:6px 10px;width:100%}
  .hh .hcol{flex:1 1 220px;min-width:0}
  canvas.ecg{width:100%;height:34px;flex:1 1 100%}
  .trap b{font-size:17px}.trap{min-width:52px}
  /* niveau 0: trap en snelheid als één smalle regel, zodat de balkjes de volle breedte krijgen */
  #hudMid{min-width:0;max-width:100%}

  .hh .trap b,.hh .trap small{display:inline}
  .hh .trap~.hcol{flex-basis:100%}
  .tg.band{display:none}

  body.panel-open .panel{max-height:46vh}
}
@media (prefers-reduced-motion:reduce){#shock{display:none}}

<script>
// staand scherm: de HUD bedekt de onderkant, dus mik iets lager
const PORT=innerWidth<innerHeight*.85;
const pv=(v,dy)=>PORT?[[v[0][0],v[0][1]+dy,v[0][2]],[v[1][0],v[1][1]+dy,v[1][2]]]:v;
// overzicht van niveau 0; met het menu links (breed scherm) iets naar links gemikt, zodat de leerling bij de startlijn niet achter het menu valt
const V0=innerWidth>820&&!PORT?[[1.9,12.5,21.5],[-.6,2.6,.6]]:pv([[2.5,12.5,21.5],[0,2.6,.6]],-1.6);
Atlas3D({
 id:'hart',halte:4,name:'Hart en bloedsomloop',
 docTitle:'Hart en bloedsomloop · Bewegingsatlas',
 aria:'3D-zoomreis door het hart en de bloedsomloop tijdens de bleeptest',
 loader:['Het hart wordt opgebouwd…','Van bleeptest tot hartspiercel'],
 seed:4,
 maxDist:PORT?82:60,fogNear:PORT?60:40,fogFar:PORT?150:100,
 shadow:{left:-11,right:11,top:10,bottom:-8},
 levels:[
  {name:'Bloedsomloop',scale:'1 m',sc:'BLOEDSOMLOOP',title:'Hart en bloedsomloop',sub:'<i>Cor · systema cardiovasculare</i> · tijdens de bleeptest',
   view:V0,zoomTo:[0,4.3,-1.6],s1:'Rust',s2:'Bleeptest',s3:'Noodgeval',
   bg:['#2c3a42','#18232a','#0d1316'],fog:0x17222a,hemi:.62,shadows:true},
  {name:'Kamers en kleppen',scale:'12 cm',sc:'HART',title:'Kamers en kleppen',sub:'Opengesneden hart · <i>atria, ventriculi en valvae</i>',
   view:PORT?[[1.6,.4,13.2],[0,-2.2,0]]:[[2.2,.9,18.5],[0,-.4,0]],zoomTo:[-1.6,2.5,0],s1:'Rust',s2:'Inspanning',s3:'Fibrilleren',
   bg:['#3a2a2c','#1d1416','#0c0809'],fog:0x1d1416,hemi:.82,shadows:false,drone:true},
  {name:'Prikkelgeleiding',scale:'8 cm',sc:'GELEIDING',title:'De prikkelgeleiding',sub:'<i>Systema conducens cordis</i> · van sinusknoop tot Purkinjevezel',
   view:pv([[4.2,1.8,25.5],[0,-.5,0]],-1.8),zoomTo:[1.4,-1.6,.6],s1:'Rust',s2:'Inspanning',s3:'Fibrilleren',
   bg:['#1d2436','#10131f','#06070d'],fog:0x10131f,hemi:.7,shadows:false,drone:true},
  {name:'Hartspiercel',scale:'0,1 mm',sc:'HARTSPIERCEL',title:'De hartspiercel',sub:'<i>Myocytus cardiacus</i> · vertakt, gekoppeld en onvermoeibaar',
   view:pv([[4.0,3.4,15.2],[.2,-.45,-.9]],-3.8),s1:'Rust',s2:'Inspanning',s3:'Fibrilleren',
   bg:['#2a1e2c','#160f18','#08060a'],fog:0x160f18,hemi:.8,shadows:false,drone:true}],
 help:{title:'Zo werkt de zoomreis',
  html:`<p>Op de sokkel staat een vergroot <b>hart</b> tussen een <b>longblok</b> (links) en een <b>lichaamsblok</b> met een kuitspier en de buikorganen (rechts). Rode en blauwe bloedcellen stromen door de <b>kleine</b> en de <b>grote bloedsomloop</b>. Op de gymvloer loopt een leerling de <b>bleeptest</b> tussen twee lijnen op 20 m. Het hart klopt synchroon. Daarna zoom je drie keer in:</p>
  <ul><li><b>Bloedsomloop</b> (≈ 1 m): trap, hartslag, slagvolume, hartminuutvolume en een ECG.</li>
  <li><b>Kamers en kleppen</b> (≈ 12 cm): een opengesneden hart met vier holtes en vier kleppen die openen en sluiten.</li>
  <li><b>Prikkelgeleiding</b> (≈ 8 cm): de elektrische golf van sinusknoop tot Purkinjevezel, gekoppeld aan het ECG.</li>
  <li><b>Hartspiercel</b> (≈ 0,1 mm): vertakte cellen, intercalaire schijven en gap junctions.</li></ul>
  <h3>Drie standen, op elk niveau</h3>
  <p><b>1 · Rust</b> om te verkennen. <b>2 · Bleeptest of inspanning</b>: met een schuif voor de trap of automatisch. <b>3 · Noodgeval</b>: kies <b>Flauwvallen</b> (na abrupt stoppen valt de spierpomp weg; eerst controleren, dan de benen omhoog) of <b>Hartstilstand</b> (ventrikelfibrilleren, met het stappenplan herkennen, bellen, reanimeren, AED en doorgaan na de schok). De camera rijdt mee naar het noodgeval. Op de diepere niveaus zie je wat er bij fibrilleren misgaat en wat de schok van een AED doet.</p>
  <h3>Tempo</h3>
  <p>Het hart slaat snel. Met de knop <b>Tempo</b> (kamers, prikkelgeleiding en hartspiercel) of <b>Slow motion</b> volg je elke fase; het bijschrift loopt dan per fase mee met de stappenbalk.</p>
  <h3>Kleuren</h3>
  <p>Rood is zuurstofrijk bloed, blauw is zuurstofarm bloed. Op het niveau Prikkelgeleiding licht geel-wit op waar de spier net elektrisch geprikkeld wordt. Groen in de cel is calcium.</p>
  <p class="hint">De hartstilstand is zakelijk in beeld gebracht als oefenscenario. Volg in de les altijd de BHV- en reanimatieafspraken van je school en de richtlijn van de Nederlandse Reanimatie Raad.</p>`,
  states:'Rust · bleeptest · noodgeval',keys:[['<kbd>S</kbd>','Eén hartslag verder (als gepauzeerd)']],
  note:'Vereenvoudigd didactisch model: aantallen, kleuren, tempo en verhoudingen zijn aangepast om het zichtbaar te maken. Hartslag en slagvolume per trap zijn vuistregels voor een getrainde student van ongeveer 19 jaar.'},
 film:{brand:'HART EN BLOEDSOMLOOP',blurb:'Hoe je hart de bleeptest volhoudt · ca. 6 minuten · met stem en ondertitels',file:'hart-uitleg'},
 quizEnd:'<p>Bespreek de slotvraag met je groep. Zoek daarna in je eigen sporthal op waar de AED hangt, en spreek af wie belt en wie reanimeert als het ooit misgaat tijdens een test.</p>',
 build(K){
 const {THREE,V,AX,AY,AZ,R,clamp,sunflower,lerp,smooth,ease,bump,D2R,TAU,mesh,std,glass,glow,add,BAND,UCYL,orient,segMatrix,placeMatrix,ZERO,inst,tube,lathe,canvasTex,groups,W,S}=K;
 const $=K.$;
 const _c=new THREE.Color(),_v=V(0,0,0),_v2=V(0,0,0),_q=new THREE.Quaternion();
 const G0=groups[0],G1=groups[1],G2=groups[2],G3=groups[3];
 const RED=new THREE.Color(0xd8352c),BLUE=new THREE.Color(0x3f5fc4);
 // schokflits (wit-blauw) naast de rode blessureflits van de motor
 const shockEl=document.createElement('div');shockEl.id='shock';$('#app').appendChild(shockEl);
 function shockFlash(){if(K.reduced){K.FILM.flashA=.4;return;}shockEl.style.transition='none';shockEl.style.opacity=1;requestAnimationFrame(()=>{shockEl.style.transition='opacity 1s';shockEl.style.opacity=0;});K.shake(.25);K.FILM.flashA=.6;}
 // in de film is de HUD verborgen: een eigen ECG met hartslag rechtsboven
 const fEcg=document.createElement('div');fEcg.id='filmEcg';fEcg.setAttribute('aria-hidden','true');fEcg.innerHTML='<b id="fEcgT">♥</b><canvas id="ecgF" width="500" height="128"></canvas>';$('#app').appendChild(fEcg);
 function filmEcg(strip,col,txt,bad){const on=K.FILM.on&&!K.FILM.title;fEcg.classList.toggle('on',on);if(!on)return;
   const s=Math.max(Math.min(innerHeight/1080,innerWidth/1500),.4),bh=74*s,wide=innerWidth/innerHeight>=1.6;
   fEcg.style.top=Math.round(bh+(K.FILM.steps?(wide?76:158)*s+12:(innerWidth<820?64:16)))+'px';
   const t=$('#fEcgT');if(t.textContent!==txt)t.textContent=txt;t.className=bad?'bad':'';drawStrip('ecgF',strip,col,'');}
 // mist per niveau: dichtbij op het celniveau, ver weg op de andere niveaus
 const FOGN=PORT?60:40,FOGF=PORT?150:100;function fogSet(n,f){K.scene.fog.near=n;K.scene.fog.far=f;}
 // film: een zin kan de klok van het scenario vasthouden tot de stem klaar is (FH.t), zodat beeld en stem gelijk lopen
 const FH={lv:-1,t:null};const hold=(lv,t)=>()=>{FH.lv=lv;FH.t=t;};
 function filmHold(lv){if(K.FILM.on&&FH.t!=null&&FH.lv===lv&&S.stT>FH.t)S.stT=FH.t;}
 const jump=(lv,t,h)=>()=>{if(S.stT<t)S.stT=t;FH.lv=lv;FH.t=h===undefined?null:h;};

 /* ================= gedeelde hartcyclus en ECG ================= */
 // tijd tau loopt van 0 (begin QRS) tot T (duur van één slag). Systole en PQ-tijd worden korter bij een hogere hartslag.
 function cyc(hr){const x=clamp((hr-60)/130,0,1);const T=60/hr;return {hr,T,x,PR:lerp(.16,.11,x),sys:lerp(.32,.18,x),ivr:lerp(.06,.03,x)};}
 function phase(tau,c){const s0=.03,s1=s0+c.sys;const pOn=c.T-c.PR;
   const vc=tau>s0&&tau<s1?Math.pow(Math.sin(Math.PI*(tau-s0)/c.sys),.7):0;
   let ac=Math.exp(-Math.pow((tau-(pOn+.07))/.045,2));
   const av=!(tau>=s0-.004&&tau<s1+c.ivr);const sl=tau>=s0+.045&&tau<s1;
   let stage=tau<s0+.045?2:tau<s1?3:tau<s1+c.ivr?4:tau>pOn+.03?1:0; // 0 vullen, 1 boezems, 2 aanspannen, 3 uitdrijven, 4 ontspannen
   return {vc,ac,av,sl,stage,s0,s1,pOn};}
 function ecgV(tau,c){const T=c.T,g=(m,w,a)=>a*Math.exp(-Math.pow((tau-m)/w,2));const pOn=T-c.PR;const qt=.40*Math.sqrt(T);
   return g(pOn+.045,.022,.14)+g(pOn+.045-T,.022,.14)+g(.012,.008,-.12)+g(.035,.0105,1)+g(.058,.011,-.26)+g(qt-.085,.048,.28);}
 function vfV(t){return .38*Math.sin(t*33+1.6*Math.sin(t*2.3))+.22*Math.sin(t*51.7+.7*Math.sin(t*5.1))+.14*Math.sin(t*21.3);}
 // een rollende monitorstrook
 function Strip(n,lo,hi){this.b=new Float32Array(n);this.n=n;this.i=0;this.lo=lo;this.hi=hi;this.acc=0;this.b.fill(lo+(hi-lo)*.33);}
 Strip.prototype.feed=function(dt,rate,fn){this.acc+=dt;const st=1/rate;let k=0;while(this.acc>=st&&k<400){this.acc-=st;this.b[this.i]=fn(k*st);this.i=(this.i+1)%this.n;k++;}};
 Strip.prototype.fill=function(v){this.b.fill(v);};
 function drawStrip(id,s,col,lbl,zero){const c=document.getElementById(id);if(!c)return;const x=c.getContext('2d'),w=c.width,h=c.height;
   x.clearRect(0,0,w,h);x.fillStyle='rgba(6,18,14,.82)';x.fillRect(0,0,w,h);x.strokeStyle='rgba(120,220,160,.11)';x.lineWidth=1;
   for(let i=0;i<=20;i++){x.beginPath();x.moveTo(i*w/20,0);x.lineTo(i*w/20,h);x.stroke();}for(let j=0;j<=5;j++){x.beginPath();x.moveTo(0,j*h/5);x.lineTo(w,j*h/5);x.stroke();}
   if(zero!==undefined){const zy=h-(zero-s.lo)/(s.hi-s.lo)*h;x.strokeStyle='rgba(241,233,218,.18)';x.setLineDash([4,4]);x.beginPath();x.moveTo(0,zy);x.lineTo(w,zy);x.stroke();x.setLineDash([]);}
   x.strokeStyle=col;x.lineWidth=2.4;x.lineJoin='round';x.shadowColor=col;x.shadowBlur=6;x.beginPath();let py=0;
   for(let k=0;k<s.n;k++){const v=s.b[(s.i+k)%s.n];const px=k/(s.n-1)*w;py=h-clamp((v-s.lo)/(s.hi-s.lo),-.05,1.05)*h;k?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();x.shadowBlur=0;
   x.fillStyle='#ffffff';x.beginPath();x.arc(w-3,py,3.2,0,TAU);x.fill();
   if(lbl){x.font='600 17px "JetBrains Mono",monospace';x.fillStyle='rgba(180,240,200,.8)';x.fillText(lbl,8,20);}}
 // rode bloedcel: biconcaaf schijfje
 const rbcGeo=new THREE.LatheGeometry([[.001,-.1],[.35,-.17],[.75,-.24],[.97,-.14],[1,0],[.97,.14],[.75,.24],[.35,.17],[.001,.1]].map(p=>new THREE.Vector2(p[0],p[1])),18);
 const rbcMat=()=>std(0xffffff,{roughness:.32});
 // spierweefseltextuur voor het hart (vochtig, gevlekt, met vezelrichting)
 const heartTex=canvasTex(512,512,(x,w,h)=>{x.fillStyle='#7e2924';x.fillRect(0,0,w,h);for(let i=0;i<2600;i++){const a=R();x.fillStyle=`rgba(${105+a*70|0},${26+a*26|0},${26+a*18|0},.35)`;x.beginPath();x.ellipse(R()*w,R()*h,2+R()*9,1+R()*3,.6,0,TAU);x.fill();}
   x.strokeStyle='rgba(255,200,180,.07)';x.lineWidth=1.2;for(let i=0;i<260;i++){const y=R()*h;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(w*.3,y+30*(R()-.5),w*.7,y+30*(R()-.5),w,y+20*(R()-.5));x.stroke();}},[2,2]);

 /* ================= het hartmodel (solide op niveau 0, van glas op niveau 2) ================= */
 // lokale maat: ongeveer 2,4 hoog; de voorkant kijkt naar +z; links in beeld is de rechterharthelft
 const CH=[{n:'RA',c:[-.62,.42,.05],s:[.5,.52,.45],rz:0},{n:'RV',c:[-.22,-.2,.18],s:[.62,.78,.5],rz:.3},{n:'LA',c:[.3,.5,-.35],s:[.45,.38,.42],rz:0},{n:'LV',c:[.28,-.25,-.1],s:[.62,.95,.62],rz:.45}];
 const AUR=[{c:[-.33,.72,.36],s:[.26,.12,.17],rz:-.5},{c:[.56,.62,.2],s:[.22,.1,.15],rz:.6}];
 function heartModel(parent,o){const g=new THREE.Group();parent.add(g);if(o.pos)g.position.copy(o.pos);g.scale.setScalar(o.scale||1);
   const vent=new THREE.Group();vent.position.set(0,.22,0);g.add(vent);const atr=new THREE.Group();atr.position.set(-.1,.45,-.1);g.add(atr);
   const sph=new THREE.SphereGeometry(1,48,32);const P={};
   CH.forEach(c=>{const par=c.n[1]==='V'?vent:atr;P[c.n]=mesh(sph,o.mat,[c.c[0]-par.position.x,c.c[1]-par.position.y,c.c[2]-par.position.z],[0,0,c.rz],c.s,par);});
   P.aur=AUR.map(a=>mesh(sph,o.mat,[a.c[0]-atr.position.x,a.c[1]-atr.position.y,a.c[2]-atr.position.z],[0,0,a.rz],a.s,atr));
   const T=(pts,r,m)=>tube(pts.map(p=>V(...p)),r,m,g,48,14);
   const ves={};
   ves.ao=T([[.06,.3,0],[.06,.9,.02],[.1,1.3,-.05],[.3,1.5,-.3],[.52,1.36,-.62],[.58,.9,-.8],[.58,.3,-.82]],.17,o.art);
   ves.br=[[-.0,1.45,-.18],[.18,1.53,-.28],[.36,1.52,-.42]].map((p,i)=>T([p,[p[0]-.04,p[1]+.42-.06*i,p[2]-.02]],.065-.008*i,o.art));
   ves.pt=T([[-.12,.3,.36],[-.05,.75,.4],[.02,1.0,.28],[-.3,1.12,.06],[-.75,1.08,-.08]],.15,o.ven);
   ves.lpa=T([[.02,1.0,.28],[.35,1.06,.05],[.75,1.02,-.12]],.11,o.ven);
   ves.svc=T([[-.62,.78,0],[-.62,1.2,-.02],[-.6,1.62,-.05]],.13,o.ven);
   ves.ivc=T([[-.58,.05,-.12],[-.56,-.4,-.16],[-.54,-.85,-.18]],.14,o.ven);
   ves.pv=[[-.05,.55,-.58,-.55],[.05,.38,-.62,-.5],[.6,.58,-.55,.55],[.6,.4,-.6,.5]].map(p=>T([[p[0],p[1],p[2]],[p[0]+p[3]*.6,p[1]+.02,p[2]-.12],[p[0]+p[3],p[1]+.05,p[2]-.2]],.075,o.art));
   return {g,vent,atr,P,ves};}
 // punten op het oppervlak vinden door te schieten op het model
 const _ray=new THREE.Raycaster();
 function wrapOn(objs,pts,dir,off){const out=[];pts.forEach(p=>{const o=(p.isVector3?p.clone():V(p[0],p[1],p[2])).sub(dir.clone().multiplyScalar(4));_ray.set(o,dir);const h=_ray.intersectObjects(objs,false)[0];
   if(h){const n=h.face.normal.clone().transformDirection(h.object.matrixWorld);out.push(h.point.clone().add(n.multiplyScalar(off)));}});return out;}

 // een klep: n bladen aan een ring; set(0) is dicht, set(1) is open. dir is de stroomrichting.
 function valve(o){const g=new THREE.Group();g.position.copy(o.pos);g.quaternion.setFromUnitVectors(AY,o.dir.clone().normalize());o.parent.add(g);
   const geo=new THREE.PlaneGeometry(o.w,o.len,8,5);geo.translate(0,o.len/2,0);const pa=geo.attributes.position;

  `<p>Het hart is een holle spier van ongeveer een vuist groot. Het zijn eigenlijk <b>twee pompen naast elkaar</b>. De rechterhelft (links in beeld) pompt zuurstofarm bloed naar de longen, de linkerhelft pompt zuurstofrijk bloed naar het hele lichaam.</p><p>Beide pompen slaan tegelijk en pompen per slag evenveel bloed. Wat rechts de longen in gaat, komt links weer terug.</p>`,
  `<p>Kijk in stand 2 naar de HUD. Het <b>hartminuutvolume</b> is hartslag × slagvolume. In rust is dat 65 × 70 ml ≈ 5 L/min. Aan het eind van de bleeptest is het bij een getrainde student 200 × 120 ml ≈ 24 L/min: bijna vijf keer zoveel.</p><p>Meet in de les de hartslag na elke trap, met een hartslagmeter of twee vingers in de hals. Bij elke trap legt de leerling dezelfde 20 m af in minder tijd: v = Δs/Δt (zie het lab <a href="bocht.html">De bocht</a>).</p>`,
  `<p>Een hart slaat in een mensenleven ruim 2,5 miljard keer. Bij topduursporters kan het hartminuutvolume tot 35 à 40 L/min stijgen, vooral door een groter slagvolume.</p>`,
  `<p class="think">Waarom hebben duursporters in rust vaak een lage hartslag, soms onder de 50? Gebruik de formule hartminuutvolume = hartslag × slagvolume.</p>`]},

  `<p>Hartspier haalt al in rust zo’n 70% van de zuurstof uit het bloed. Bij inspanning kan dat nauwelijks meer, dus moet de <b>doorbloeding</b> zelf stijgen: de kransslagaders verwijden. Een vernauwing merk je daarom het eerst bij inspanning, bijvoorbeeld als pijn op de borst tijdens de bleeptest.</p>`,

  `<p>Tijdens de bleeptest gaat er per minuut net zoveel bloed door de longen als door de rest van het lichaam: tot 20 à 25 liter. Je ademhaling stijgt mee, zie <a href="longen.html">halte 3, de longen</a>.</p>`,

  `<p>De aortawand is elastisch. Bij elke slag rekt hij op en daarna veert hij terug. Zo wordt de stootsgewijze stroom uit het hart een meer gelijkmatige stroom. Die golf voel je als <b>polsslag</b>, zelfs in je pols, ver van het hart.</p>`,
  `<p>Bij een normale bloeddruk van 120/80 mmHg is 120 de druk tijdens het uitpompen (systole) en 80 de druk tussen twee slagen (diastole). Bij maximale inspanning stijgt de bovendruk bij jonge sporters vaak naar 180 à 200 mmHg.</p>`,
  `<p class="think">Waarom stijgt bij inspanning vooral de bovendruk en blijft de onderdruk ongeveer gelijk? Denk aan de verwijde bloedvaten in de spieren.</p>`]},
 {lv:0,name:'Haarvaten in de spier',lat:'Vasa capillaria',state:2,at:()=>W.musc,view:[[9.2,5.2,3.2],[5.1,3.1,-2.4]],focus:()=>[MUS,CAPM,RBC0],tabs:[
  `<p>In de spier vertakken de slagaders tot <b>haarvaten</b>: buisjes van 5 tot 10 µm, net breed genoeg voor één rode bloedcel. Hier geeft het bloed zuurstof af aan de spiervezels en neemt het CO₂ en warmte mee. Kijk hoe de cellen van rood naar blauw kleuren.</p><p>In rust is maar een deel van de haarvaten open. Bij inspanning gaan ze bijna allemaal open.</p>`,
  `<p>Tijdens de bleeptest verschuift de bloedverdeling: in rust gaat ongeveer 20% van het hartminuutvolume naar de spieren, aan het eind meer dan 80%. Organen zoals darmen en nieren krijgen dan relatief minder. Daarom is een zware maaltijd vlak voor de test geen goed idee.</p>`,
  `<p>Duurtraining maakt extra haarvaten rond elke spiervezel aan. Zo wordt de afstand voor zuurstof kleiner. Zie ook <a href="spier.html#6">halte 8, de bloedvaten in de spier</a>.</p>`,
  `<p class="think">Een getrainde leerling haalt uit hetzelfde bloed meer zuurstof dan een ongetrainde. Hoe zie je dat terug in de kleur van het bloed dat de spier verlaat?</p>`]},
 {lv:0,name:'Spierpomp en aderkleppen',lat:'Venae profundae · valvulae venosae',state:2,at:()=>W.vein,view:[[8.8,3.6,4.8],[5.0,3.0,-1.8]],focus:()=>[deepV,MUS,RBC0].concat(VVAL.map(v=>v.g)),pick:()=>[deepV].concat(VVAL.map(v=>v.g)),tabs:[
  `<p>In de aders van de benen is de druk laag. Het bloed moet tegen de zwaartekracht in terug naar het hart. Daarbij helpt de <b>spierpomp</b>: als de kuitspier aanspant, knijpt hij de diepe aders samen.</p><p>De <b>aderkleppen</b> laten het bloed alleen naar boven door. Bij ontspanning vallen ze dicht, zodat het bloed niet terugzakt.</p>`,
  `<p>Stop je na de bleeptest abrupt en blijf je stil staan, dan valt de spierpomp weg. Het bloed zakt in de benen, het slagvolume en de bloeddruk dalen en je kunt flauwvallen. Bekijk het in stand 3, knop <b>Flauwvallen</b>. Een <b>cooling-down</b> (rustig uitlopen) voorkomt dat.</p><p>Zakt een leerling in elkaar, controleer dan altijd eerst of hij reageert en normaal ademt. Een collaps tijdens het sporten is een hartstilstand tot het tegendeel blijkt.</p>`,
  `<p>In rust zit ongeveer twee derde van al het bloed in de aders. Ze werken als een voorraadvat dat bij inspanning wordt aangesproken.</p>`,
  `<p class="think">Waarom zakken soldaten die lang stil in de houding staan soms in elkaar, en waarom wiebelen ze daarom op hun tenen?</p>`]},
 {lv:1,name:'Rechterboezem en rechterkamer',lat:'Atrium dextrum · ventriculus dexter',at:()=>W.RV,view:[[-4.5,1.2,8.5],[-1.5,0,-.3]],focus:()=>[CHB.RA.tilt,CHB.RV.tilt,SVC1,IVC1,PT1[0],VL.tri.g,VL.pul.g],pick:()=>[CHB.RA.tilt,CHB.RV.tilt],tabs:[
  `<p>Via de <b>bovenste en onderste holle ader</b> komt zuurstofarm bloed in de <b>rechterboezem</b>. Door de <b>driepuntige klep</b> stroomt het in de <b>rechterkamer</b>, die het via de longslagaderklep naar de longen pompt.</p><p>De rechterkamerwand is dun (3 tot 5 mm). De longen liggen dichtbij en de druk in de kleine bloedsomloop is laag.</p>`,
  `<p>Bij inspanning komt er veel meer bloed terug uit de spieren. De rechterboezem vult daardoor sneller en de kamerwand wordt verder opgerekt. Een opgerekte hartspier trekt krachtiger samen (de wet van Frank-Starling): zo pompt het hart vanzelf uit wat er binnenkomt.</p>`,
  `<p>In de wand van de rechterboezem, vlak bij de bovenste holle ader, ligt de sinusknoop: de natuurlijke pacemaker. Zoom in naar <b>Prikkelgeleiding</b> om hem te zien.</p>`,
  `<p class="think">Waarom is het belangrijk dat rechter- en linkerkamer per slag precies evenveel bloed wegpompen? Wat gebeurt er als rechts ook maar 1 ml per slag meer pompt?</p>`]},
 {lv:1,name:'Linkerkamer en hartspier',lat:'Ventriculus sinister · myocardium',at:()=>W.LVw,view:[[5,0,8.5],[1.4,-1,-.3]],focus:()=>[CHB.LA.tilt,CHB.LV.tilt,AO1,VL.mit.g,VL.aov.g].concat(PV1),pick:()=>[CHB.LV.tilt,CHB.LA.tilt],tabs:[
  `<p>Zuurstofrijk bloed uit de longen komt in de <b>linkerboezem</b>, stroomt door de <b>mijterklep</b> in de <b>linkerkamer</b> en wordt via de aortaklep de aorta in gepompt.</p><p>De linkerkamer heeft de dikste wand, ongeveer 1 cm. Kijk naar het snijvlak: die spier moet het bloed door het hele lichaam drukken, tegen een druk van 120 mmHg in.</p>`,
  `<p>Duurtraining laat de linkerkamer groeien: de holte wordt groter en de wand iets dikker (het ‘sporthart’). Het slagvolume neemt toe, dus is in rust een lagere hartslag genoeg.</p>`,
  `<p>Hartspiercellen vernieuwen nauwelijks: rond je 25e wordt ongeveer 1% per jaar vervangen (Bergmann e.a., <i>Science</i> 2009). Daarom is schade aan de hartspier, zoals na een infarct, blijvend.</p>`,
  `<p class="think">Vergelijk in stand 2 de drukbalk met die in rust. Waarom stijgt de druk in de linkerkamer bij inspanning?</p>`]},
 {lv:1,name:'Hartkleppen',lat:'Valva tricuspidalis · valva mitralis · valva aortae · valva trunci pulmonalis',at:()=>W.mit,view:[[.6,1.8,7],[-.2,.1,0]],focus:VALV,pick:VALV,tabs:[
  `<p>Vier kleppen zorgen dat het bloed maar één kant op kan. Tussen boezem en kamer zitten de <b>zeilkleppen</b>: rechts de driepuntige klep, links de mijterklep. <b>Peesdraden</b> naar de papillairspieren voorkomen dat ze doorslaan naar de boezem.</p><p>Bij de uitgang van de kamers zitten de <b>halvemaanvormige kleppen</b>: de aortaklep en de longslagaderklep. Hun zakjes vullen zich met bloed en sluiten zo de opening af.</p>`,
  `<p>De harttonen zijn het geluid van dichtslaande kleppen. <b>Lub</b>: de zeilkleppen sluiten als de kamers aanspannen. <b>Dub</b>: de halvemaanvormige kleppen sluiten aan het eind van het uitpompen. Zet het geluid aan en vergelijk rust met inspanning.</p>`,
  `<p>Een klep gaat open of dicht door het drukverschil, niet door een spier. Ruis tussen de tonen (een geruis) kan wijzen op een klep die lekt of te nauw is. Een arts luistert daar met een stethoscoop naar.</p>`,
  `<p class="think">Wat zou er met het slagvolume gebeuren als de mijterklep tijdens het uitpompen een beetje lekt?</p>`]},
 {lv:2,name:'Sinusknoop',lat:'Nodus sinuatrialis',at:()=>W.SAm,view:[[-4,5.2,8.5],[-1.6,2.4,.5]],focus:()=>[SAm,SYM,VAG,MYP].concat(tracts.map(c=>c.m)),pick:()=>[SAm],tabs:[
  `<p>De <b>sinusknoop</b> is een klein groepje gespecialiseerde hartspiercellen in de wand van de rechterboezem. Zijn membraanpotentiaal kruipt vanzelf omhoog tot hij vuurt: een ingebouwde <b>pacemaker</b>.</p><p>De prikkel loopt over beide boezems, die daardoor samentrekken. Op het ECG is dat de <b>P-top</b>.</p>`,
  `<p>Het autonome zenuwstelsel stelt het tempo bij. De <b>nervus vagus</b> (groen, stand 1) remt, de <b>sympathicus</b> (geel, stand 2) versnelt, samen met adrenaline. Daarom stijgt je hartslag al vóór de start van de bleeptest. Zie <a href="zenuw.html">halte 1, het zenuwstelsel</a>.</p>`,
  `<p>Zonder zenuwinvloed vuurt de sinusknoop ongeveer 100 keer per minuut. De rusthartslag van 60 à 70 komt doordat de nervus vagus continu remt. Een vuistregel voor de maximale hartslag is 220 min je leeftijd, met een spreiding van ruim 10 slagen.</p>`,
  `<p class="think">Na een harttransplantatie zijn de zenuwen naar het hart doorgesneden. Hoe zou de hartslag van zo iemand reageren op de start van een inspanning?</p>`]},
 {lv:2,name:'AV-knoop en bundel van His',lat:'Nodus atrioventricularis · fasciculus atrioventricularis',at:()=>W.AV,view:[[2,2.2,8],[-.4,.2,.2]],focus:()=>[AVm,his.m,lbb.m,rbb.m],pick:()=>[AVm,his.m],tabs:[
  `<p>Tussen boezems en kamers zit een isolerende laag bindweefsel. De enige doorgang voor de prikkel is de <b>AV-knoop</b>. Die geleidt langzaam: de prikkel wacht er ongeveer 0,1 seconde.</p><p>Daarna gaat de prikkel snel door de <b>bundel van His</b> in het tussenschot, die zich splitst in een linker en een rechter bundeltak.</p>`,
  `<p>Dankzij de vertraging zijn de boezems klaar met vullen voordat de kamers samentrekken. Op het ECG is dat de <b>PQ-tijd</b>. Kijk naar de PQ-tijd achter de hartslag in de HUD: bij inspanning wordt hij korter, zodat de kamers ook bij 180 slagen per minuut nog op tijd gevuld worden.</p>`,
  `<p>Een normale PQ-tijd is 0,12 tot 0,20 seconde. De AV-knoop beschermt de kamers ook: komen er te veel prikkels uit de boezems, dan laat hij er maar een deel door.</p>`,
  `<p class="think">Zet de tempoknop op 16× trager. Wat zie je in de boezems en in de kamers gebeuren tijdens de PQ-tijd?</p>`]},
 {lv:2,name:'Purkinjevezels',lat:'Rami subendocardiales',at:()=>W.Pk,view:[[6,-1.5,9],[1.2,-1.8,0]],focus:()=>[PKL,lbb.m,rbb.m,MYP],pick:()=>[lbb.m,rbb.m],tabs:[
  `<p>De bundeltakken vertakken zich onder de binnenwand van de kamers in een net van <b>Purkinjevezels</b>. Die geleiden met 2 tot 4 m/s veel sneller dan gewone hartspier.</p><p>Zo wordt de hele kamerwand binnen ongeveer 0,1 seconde geprikkeld, eerst bij de punt en dan richting basis. Op het ECG is dat het <b>QRS-complex</b>.</p>`,
  `<p>Doordat de punt het eerst samentrekt, wordt het bloed omhoog geperst, naar de uitgangen bij de kleppen. Net als tandpasta die je van onderen uit de tube knijpt.</p>`,
  `<p>Een ECG meet op de huid spanningen van ongeveer 1 millivolt. In de cel zelf schommelt de spanning met ruim 100 millivolt. Zoom in naar de <b>hartspiercel</b>.</p>`,
  `<p class="think">Bekijk stand 3. Waarom kan een hart met chaotische golven geen bloed rondpompen, ook al trekken alle cellen nog steeds samen?</p>`]},
 {lv:3,name:'Hartspiercel',lat:'Myocytus cardiacus',at:()=>W.FC,view:[[2.5,2.2,7.2],[FC.x+FC.L0/2,0,0]],focus:()=>[FG],pick:()=>[FG,nuc3],tabs:[
  `<p>Een <b>hartspiercel</b> is ongeveer 100 µm lang en 15 µm breed. Hij is gestreept zoals skeletspier, maar <b>vertakt</b>, en heeft één of twee <b>kernen in het midden</b> (paars). Skeletspiervezels zijn veel langer en hebben honderden kernen aan de rand.</p><p>Ongeveer een derde van de cel bestaat uit <b>mitochondriën</b> (oranje): het hart werkt bijna volledig aeroob.</p>`,
  `<p>Kijk naar het membraanpotentiaal. Na de snelle depolarisatie volgt een <b>plateau</b> van ruim 200 ms waarin calcium binnenstroomt. Zolang dat duurt, is de cel onprikkelbaar. Daardoor kunnen prikkels niet optellen tot één lange, aanhoudende samentrekking (<b>tetanus</b>), zoals bij skeletspier wel kan (zie <a href="spier.html#8">halte 8, de motorische eindplaat</a>).</p>`,
  `<p>Hartspier raakt niet vermoeid zoals skeletspier: hij heeft altijd zuurstof nodig en kan bijna geen zuurstofschuld opbouwen. Daarom is een afgesloten kransslagader zo snel schadelijk.</p>`,
  `<p class="think">Waarom zou een hart dat in tetanus kan schieten gevaarlijk zijn? Denk aan vullen en pompen.</p>`]},
 {lv:3,name:'Intercalaire schijf en gap junctions',lat:'Discus intercalatus · nexus',at:()=>W.disc,view:[[1.2,1.4,5.2],[FC.x+FC.L0,0,0]],focus:()=>[GJ,ION].concat(CELL3.map(c=>c.disc)),pick:()=>CELL3.map(c=>c.disc),tabs:[
  `<p>Hartspiercellen zitten kop aan kop vast via de <b>intercalaire schijven</b> (donker, getand). Daarin zitten twee soorten verbindingen: stevige <b>desmosomen</b> die de cellen bij elkaar houden als ze trekken, en <b>gap junctions</b> (blauw).</p><p>Gap junctions zijn kanaaltjes tussen twee cellen. Ionen glippen er direct doorheen (gele bolletjes), zodat de prikkel van cel naar cel springt.</p>`,
  `<p>Door de gap junctions werken alle cellen van de boezems samen als één geheel, en alle cellen van de kamers ook: twee <b>functionele syncytia</b>. De bindweefselring ertussen laat de prikkel alleen door via de AV-knoop. Zo trekken eerst de boezems en dan de kamers samen, net als een team dat tegelijk aan een touw trekt.</p>`,
  `<p>Een gap junction bestaat uit twee halve kanaaltjes (connexonen), elk opgebouwd uit zes eiwitten. Er passen kleine ionen en moleculen door, geen grote eiwitten.</p>`,
  `<p class="think">Wat gebeurt er met de samenwerking van de cellen als een stuk hartspier na een infarct vervangen is door littekenweefsel zonder gap junctions?</p>`]}];

 const quiz=[
  {t:'R',type:'find',lv:1,state:1,view:[[2.2,.9,18.5],[0,-.4,0]],q:'Klik op de <b>ventriculus sinister</b>.',opts:[()=>W.RV,()=>W.LA,()=>W.LV,()=>W.RA],ok:2,
   fb:['Dat is de ventriculus dexter, de rechterkamer: dunne wand, hij pompt naar de longen.','Dat is het atrium sinistrum, de linkerboezem. Die vangt het bloed uit de longen op.','Goed! De ventriculus sinister is de linkerkamer, met een wand van ongeveer 1 cm. Hij pompt het bloed door het hele lichaam.','Dat is het atrium dextrum, de rechterboezem, waar de holle aders uitkomen.']},
  {t:'R',type:'find',lv:0,state:1,view:[[1,8.6,12.5],[-1.6,4.6,-2.2]],q:'Klik op het bloedvat dat <b>zuurstofrijk</b> bloed van de longen naar het hart brengt.',opts:[()=>W.pa,()=>W.aoD,()=>W.ivc,()=>W.pv],ok:3,
   fb:['Dat is de truncus pulmonalis, de longslagader. Die brengt zuurstofarm bloed van het hart náár de longen.','Dat is de aorta. Die vervoert wel zuurstofrijk bloed, maar van het hart naar het lichaam.','Dat is de vena cava inferior, de onderste holle ader: zuurstofarm bloed uit het lichaam.','Goed! De venae pulmonales, de longaders, brengen zuurstofrijk bloed naar de linkerboezem. Een ader die rood bloed vervoert: ader zegt iets over de richting, niet over de zuurstof.']},
  {t:'T1',type:'mc',lv:2,state:1,q:'Zet het tempo op <b>8× trager</b> en kijk naar de gele golf. In welke volgorde loopt de prikkel door het hart?',opts:['Sinusknoop, boezems, AV-knoop, bundel van His, Purkinjevezels','AV-knoop, sinusknoop, boezems, Purkinjevezels, bundel van His','Sinusknoop, bundel van His, AV-knoop, boezems, Purkinjevezels','Purkinjevezels, bundel van His, AV-knoop, sinusknoop, boezems'],ok:0,
   ex:'Het startsein komt uit de sinusknoop in de rechterboezem. De golf loopt over beide boezems (P-top). In de AV-knoop wacht de prikkel ongeveer 0,1 s, daarna gaat hij snel via de bundel van His en de Purkinjevezels door de kamers (QRS).',
   why:[null,'De AV-knoop vuurt niet als eerste: hij wacht juist op de prikkel uit de boezems. Kijk waar de golf begint.','De bundel van His ligt in het tussenschot van de kamers. De prikkel moet eerst door de AV-knoop om daar te komen.','Dit is precies omgekeerd. De Purkinjevezels in de kamerwand zijn het eindstation.']},
  {t:'T1',type:'mc',lv:3,state:1,q:'Kijk naar het membraanpotentiaal van de hartspiercel. Waarom kan hartspier niet in een aanhoudende samentrekking (tetanus) schieten, zoals skeletspier wel kan?',opts:['Omdat hartspiercellen geen calcium gebruiken','Omdat het lange plateau de cel onprikkelbaar houdt tot hij bijna ontspannen is','Omdat de nervus vagus elke cel afremt','Omdat hartspiercellen geen myosine hebben'],ok:1,
   ex:'Tijdens het plateau en het grootste deel van de repolarisatie kan geen nieuwe prikkel komen. Prikkels kunnen dus niet optellen: een nieuwe samentrekking kan pas als de vorige bijna voorbij is, en de kamer kan tussendoor weer vullen.',
   why:['Juist calcium zet de samentrekking aan; kijk naar de groene gloed tijdens het plateau.',null,'De vagus remt de sinusknoop, niet de samentrekking van elke cel.','Hartspier is gestreept: actine en myosine zijn er gewoon.']},
  {t:'T2',type:'mc',lv:0,state:2,q:'Aan het eind van de bleeptest slaat het hart van een student 190 keer per minuut, met een slagvolume van 120 ml. Hoe groot is het hartminuutvolume ongeveer?',opts:['2,3 L/min','5 L/min','23 L/min','230 L/min'],ok:2,
   ex:'190 × 120 ml = 22.800 ml, dus bijna 23 liter per minuut. Dat is ruim vier keer zoveel als in rust.',

  {t:'I',type:'open',lv:0,state:2,q:'Je neemt als docent LO de bleeptest af bij een klas. Leg uit wat het hart en de bloedsomloop van een leerling doen tussen trap 1 en het einde van de test. Beschrijf daarna drie afspraken die je vooraf maakt voor de veiligheid, en leg bij elke afspraak uit waarom.',
   model:'<p><b>Hart en bloedsomloop</b>: de hartslag stijgt van ongeveer 65 naar bijna het maximum (vuistregel 220 min leeftijd). Het slagvolume stijgt eerst van 70 naar ongeveer 120 ml en vlakt dan af. Het hartminuutvolume gaat van 5 naar 20 à 25 L/min. De sympathicus versnelt de sinusknoop en verkort de AV-vertraging. Het bloed wordt verdeeld naar de werkende spieren (van ongeveer 20% naar meer dan 80%), en de spierpomp stuwt het via de aderkleppen terug.</p><p><b>Afspraken</b>: (1) een <b>cooling-down</b>: na het uitvallen rustig uitlopen, zodat de spierpomp blijft werken en niemand flauwvalt; (2) weten waar de <b>AED</b> hangt en wie hem haalt, omdat elke minuut zonder schok de overlevingskans bij een hartstilstand verkleint; (3) wie <b>112 belt</b> en wie <b>reanimeert</b> (BHV-afspraken). Zakt iemand in elkaar, dan controleer je eerst of hij reageert en normaal ademt; zo niet, dan behandel je het als een hartstilstand. Leerlingen die zich ziek voelen of klachten krijgen, laat je niet doorgaan.</p>'}];
