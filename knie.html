 help:{title:'Zo werkt de zoomreis',
  html:`<p>Je begint bij een vergrote <b>rechterknie</b> op een standaard in de gymzaal. Op de mat staat een sporter: zijn rechterknie (rode ring) beweegt precies zoals het grote model. Daarna zoom je drie keer in:</p>

  x.strokeStyle='#d06b2c';x.beginPath();x.arc(w*.62,h/2,95,0,TAU);x.stroke();x.strokeStyle='#2f6f9a';x.beginPath();x.arc(30,h/2,250,-Math.PI/2,Math.PI/2);x.stroke();
  x.strokeStyle='#d06b2c';x.strokeRect(30,h/2-75,170,150);x.globalAlpha=1;

(function(){const g=new THREE.Group();g.position.set(6.6,0,-4.7);g.rotation.y=.25;G0.add(g);mesh(new THREE.BoxGeometry(4.2,.09,.42),E.wood,[0,.62,0],0,0,g);mesh(new THREE.BoxGeometry(3.9,.06,.12),E.woodD,[0,.26,0],0,0,g);[-1.7,1.7].forEach(x=>mesh(new THREE.BoxGeometry(.12,.58,.5),E.woodD,[x,.3,0],0,0,g));})();

const sdEl=(p,c,r)=>{const x=(p.x-c[0])/r[0],y=(p.y-c[1])/r[1],z=(p.z-c[2])/r[2];const k0=Math.sqrt(x*x+y*y+z*z),k1=Math.sqrt(x*x/(r[0]*r[0])+y*y/(r[1]*r[1])+z*z/(r[2]*r[2]));return k1<1e-9?-Math.min(r[0],r[1],r[2]):k0*(k0-1)/k1;};

 {lv:0,name:'Dijbeen',lat:'Femur · condylus medialis et condylus lateralis',layer:'Botten',at:()=>V(.82,5.75,.25),view:[[4.6,6.8,6.4],[0,5.4,0]],focus:()=>OB.femur.concat([cartFem]),pick:()=>OB.femur,tabs:[
  `<p>Het dijbeen is het langste en sterkste bot van je lichaam. Onderaan verbreedt het tot twee knobbels: de <b>mediale en laterale condylus</b>. Ze zijn bekleed met glad gewrichtskraakbeen (blauwig in het model) en rollen en glijden over het scheenbeen als je de knie buigt.</p><p>Tussen de condylen ligt een diepe groeve, de <b>fossa intercondylaris</b>. Daar lopen de kruisbanden. Aan de voorkant ligt de <b>trochlea</b> (facies patellaris): de goot waar de knieschijf doorheen glijdt.</p>`,
  `<p>Bij een diepe squat rollen de condylen naar achteren over het scheenbeenplateau (<i>rollback</i>) en glijden ze tegelijk naar voren. Zo kan de knie ver buigen zonder dat het dijbeen van het plateau af rolt.</p><p>Bij springen en landen krijgt het kraakbeen in de knie krachten van enkele keren je lichaamsgewicht te verwerken.</p>`,
  `<p>Kraakbeen heeft geen bloedvaten. Het krijgt zijn voeding uit het gewrichtsvocht, en dat werkt het best als je beweegt: belasten en ontlasten werkt als een spons die vocht opzuigt en weer uitknijpt. Op de condylen is het kraakbeen maar 2 tot 3 mm dik.</p>`,
  `<p class="think">Een botbreuk geneest meestal binnen een paar maanden. Een beschadiging van het kraakbeen herstelt bijna niet. Hoe verklaar je dat verschil?</p>`]},
 {lv:0,name:'Knieschijf',lat:'Patella',layer:'Botten',at:()=>W.patC&&W.patC.clone().add(V(.05,.45,.45)),view:[[2.6,6,5.8],[0,5.2,.4]],focus:()=>OB.patella.concat([QT,PT]),pick:()=>OB.patella,tabs:[
  `<p>De knieschijf is een <b>sesambeentje</b>: een bot dat ín een pees ligt. Boven zit de quadricepspees, onder loopt de <b>kniepees</b> (lig. patellae) naar het scheenbeen.</p><p>De achterkant is bedekt met het dikste kraakbeen van het lichaam, tot ongeveer 5 mm, en glijdt door de trochlea van het dijbeen.</p>`,
  `<p>De knieschijf houdt de pees verder van het draaipunt van de knie. Daardoor heeft de quadriceps een grotere <b>momentarm</b> en levert dezelfde spierkracht meer draaimoment. Handig bij afzetten, sprinten en remmen.</p><p>De keerzijde: bij een diepe squat of een landing drukt de knieschijf hard tegen het dijbeen.</p>`,
  `<p>Een pasgeboren baby heeft nog geen benige knieschijf. Die bestaat dan uit kraakbeen. De verbening begint pas rond 3 tot 6 jaar.</p>`,
  `<p class="think">Zet de <b>squat</b> aan en volg de knieschijf. Hoe verandert zijn positie? En waarom wordt de druk áchter de knieschijf groter naarmate je dieper zakt?</p>`]},
 {lv:0,name:'Scheenbeen en kuitbeen',lat:'Tibia · fibula · tuberositas tibiae',layer:'Botten',at:()=>W.tibPt,view:[[4.8,4.4,6.8],[0,3.3,0]],focus:()=>OB.tibia.concat([cartTib]),pick:()=>OB.tibia,tabs:[
  `<p>Het <b>scheenbeen</b> draagt bijna al het gewicht. Bovenaan is het vrij vlak: het <b>tibiaplateau</b>. Vooraan zit een knobbel, de <b>tuberositas tibiae</b>, waar de kniepees aanhecht.</p><p>Het dunne <b>kuitbeen</b> ligt aan de buitenkant. Het hoort niet bij het kniegewricht zelf, maar de buitenste collaterale band en de biceps femoris hechten aan op het fibulakopje.</p>`,
  `<p>Bij sporters in de groei (ongeveer 10 tot 15 jaar) trekt de kniepees hard aan de groeischijf bij de tuberositas. Dat kan de <b>ziekte van Osgood-Schlatter</b> geven: een pijnlijke, soms dikke knobbel onder de knie bij springen en sprinten. Herken je dat bij leerlingen in de onderbouw?</p>`,
  `<p>De voorkant van je scheenbeen ligt vrijwel direct onder de huid, zonder spier ertussen. Daarom doet een trap tegen je scheen zo veel pijn en dragen voetballers scheenbeschermers.</p>`,
  `<p class="think">Het tibiaplateau is vrij plat, de condylen van het dijbeen zijn rond. Wat betekent dat voor de stabiliteit van de knie, en welke structuren moeten dat compenseren?</p>`]},
 {lv:0,name:'Collaterale banden',lat:'Lig. collaterale tibiale · lig. collaterale fibulare',layer:'Banden',at:()=>W.mclMid&&W.mclMid.clone().add(V(.16,.2,-.05)),view:[[6,5.2,2.4],[0,4.5,0]],focus:()=>[MCL,LCL].concat(OB.meni),pick:()=>[MCL,LCL],tabs:[
  `<p>Aan beide kanten zit een stevige band. De <b>binnenste collaterale band</b> (lig. collaterale tibiale, in de kliniek MCL) is breed en plat en loopt van dijbeen naar scheenbeen. De <b>buitenste collaterale band</b> (lig. collaterale fibulare, LCL) is een rond koord van dijbeen naar het fibulakopje.</p><p>Samen voorkomen ze dat de knie zijwaarts openklapt. Bij een gestrekte knie staan ze strak, bij buigen iets losser.</p>`,
  `<p>De binnenste band beschermt tegen <b>valgus</b>: de knie die naar binnen klapt. Een sliding tegen de buitenkant van de knie rekt hem op. Bij een harde klap tegen de buitenkant van de knie kunnen deze band, de VKB en de mediale meniscus samen scheuren: de <b>unhappy triad</b>. Dat komt minder vaak voor dan de bekende naam doet denken.</p><p>Kijk in stand 3 hoe hij oranje kleurt bij de slechte landing.</p>`,
  `<p>De binnenste collaterale band geneest meestal zonder operatie. Hij ligt buiten het gewricht en is goed doorbloed. De VKB ligt ín het gewricht en geneest bijna nooit vanzelf. Zoom in op de kruisband en het collageen om te zien waarom.</p>`,
  `<p class="think">Bij een valgus-landing staat de binnenste band onder spanning en de buitenste juist niet. Leg uit waarom.</p>`]},
 {lv:0,name:'Quadriceps en kniepees',lat:'M. quadriceps femoris · lig. patellae',layer:'Spieren en pezen',state:2,at:()=>W.rfMid&&W.rfMid.clone().add(V(.15,.8,.82)),view:[[6,7.6,8],[0,6.4,.3]],focus:()=>OB.quad.concat(OB.patella),pick:()=>OB.quad,tabs:[
  `<p>De <b>quadriceps femoris</b> heeft vier koppen: rectus femoris, vastus lateralis, vastus medialis en vastus intermedius (onder de rectus, hier niet zichtbaar). Via de quadricepspees, de knieschijf en de kniepees trekken ze aan de tuberositas tibiae: ze <b>strekken de knie</b>.</p><p>De rectus femoris loopt ook over de heup en helpt de heup te buigen.</p>`,
  `<p>Kijk in stand <b>2 · Squat</b>: bij het zakken werkt de quadriceps <b>excentrisch</b> (hij wordt langer onder spanning en remt je af), bij het omhoogkomen <b>concentrisch</b>. Bij een landing vangt hij de klap excentrisch op.</p><p>Let op: bij een bijna gestrekte knie trekt de quadriceps het scheenbeen naar voren. Dat is precies de richting die de VKB moet tegenhouden.</p>`,
  `<p>Excentrisch kan de quadriceps ongeveer een kwart tot de helft meer kracht leveren dan concentrisch. Daarom kun je langzaam zakken met een gewicht dat je niet meer omhoog krijgt.</p>`,
  `<p class="think">Waarom heb je na een lange afdaling in de bergen meer spierpijn in je bovenbenen dan na de klim omhoog?</p>`]},
 {lv:0,name:'Hamstrings en kuitspier',lat:'M. biceps femoris · m. semitendinosus · m. semimembranosus · m. gastrocnemius',layer:'Spieren en pezen',at:()=>W.bfMid&&W.bfMid.clone().add(V(-.7,-.4,-.6)),view:[[-4.8,6.8,-7],[0,5.6,-.6]],focus:()=>OB.ham.concat(OB.gas),pick:()=>OB.ham.concat(OB.gas),tabs:[
  `<p>Aan de achterkant liggen de <b>hamstrings</b>: de biceps femoris aan de buitenkant, de semitendinosus (dun, met een lange pees) en de semimembranosus aan de binnenkant. Ze <b>buigen de knie</b> en strekken de heup.</p><p>De <b>kuitspier</b> (gastrocnemius) ontspringt met twee koppen boven de knie aan het dijbeen en helpt ook bij het buigen van de knie.</p>`,
  `<p>De hamstrings trekken het scheenbeen naar achteren. Daarmee zijn ze een <b>bondgenoot van de VKB</b>. Landen met gebogen heupen én knieën laat ze meewerken. Daarom zitten de Nordic hamstring curl en landingsoefeningen in preventieprogramma's als <b>FIFA 11+</b>.</p><p><a href="spier.html">Zoom in op de hamstring, tot op de kruisbrug: halte 8 →</a></p>`,
  `<p>Hamstrings zijn <b>tweegewrichtsspieren</b>. In dit model staat het dijbeen stil, dus je ziet alleen de knie buigen. In een echte squat buigt ook de heup, en daar worden ze langer. Netto verandert hun lengte weinig: in de squat werken ze vooral <b>mee</b> om de knie stabiel te houden (co-contractie).</p><p>FIFA 11+ verminderde in een groot onderzoek bij jonge voetbalsters het aantal blessures met ongeveer een derde (Soligard e.a., 2008).</p>`,
  `<p class="think">Bij de slechte landing in stand 3 zijn de hamstrings nauwelijks actief, bij de goede landing wel. Wat doet dat met de spanning op de VKB? Kijk naar het onderste balkje.</p>`]},
 {lv:0,name:'Voorste kruisband',lat:'Lig. cruciatum anterius (VKB)',layer:'Banden',at:()=>W.aclMid&&W.aclMid.clone().add(V(-1.0,-.55,.1)),view:[[-3.3,5.4,3.4],[0,4.7,0]],focus:()=>[aclIM,pclIM,cartTib].concat(OB.meni),pick:()=>[aclIM],tabs:[
  `<p>De voorste kruisband loopt door de fossa intercondylaris: van de binnenkant van de <b>laterale condylus</b> (achter-boven) naar het <b>voorste deel van het tibiaplateau</b> (voor-onder).</p><p>Hij voorkomt dat het scheenbeen naar <b>voren</b> schuift ten opzichte van het dijbeen en remt de binnenwaartse draaiing van het scheenbeen. Zoom in met <b>+</b>: hij bestaat uit twee bundels.</p>`,
  `<p>Ongeveer <b>70%</b> van de VKB-scheuren ontstaat zonder contact met een tegenstander: bij landen, afremmen of draaien met een licht gebogen knie die naar binnen knikt (valgus), terwijl het scheenbeen naar binnen draait.</p><p>Een knie die naar binnen klapt, begint vaak bij de heup: het dijbeen draait naar binnen. De middelste bilspier (m. gluteus medius) remt dat af. <a href="heup.html">Bekijk het in de heup: halte 7 →</a></p><p>Vergelijk in stand <b>3</b> de slechte en de goede landing, en bekijk de krachten in het lab <a href="landing.html">Landing</a>.</p>`,
  `<p>Een VKB is ongeveer 3 cm lang en 1 cm breed. Bij jonge mensen houdt hij in het lab zo'n 2000 N trekkracht uit, ongeveer het gewicht van 200 kilo (Woo e.a., 1991). Vrouwelijke sporters in spring- en draaisporten hebben ongeveer 2 tot 3 keer zo veel kans op een VKB-scheur als mannen (overzichtsstudie, Prodromos e.a., 2007).</p><p>Een VKB scheurt meestal binnen 50 ms na het neerkomen (Koga e.a., 2010). Dat is te snel om nog bewust bij te sturen. Daarom oefen je de landing vooraf, tot hij automatisch gaat.</p>`,
  `<p class="think">Na een VKB-scheur kunnen veel mensen gewoon rechtuit lopen, maar heeft hun knie het gevoel weg te schieten bij een draai of een sprongetje. Welke taak van de VKB valt dan weg?</p>`]},
 {lv:1,name:'Twee bundels: AM en PL',lat:'Lig. cruciatum anterius · bundel anteromediaal en posterolateraal',layer:'Kruisbanden',state:2,at:()=>W.amMid&&W.amMid.clone().add(V(.75,.95,.45)),view:[[2.6,2.2,8.2],[-.35,1.1,.25]],focus:()=>[amIM,plIM,sheath1,vascIM],pick:()=>[amIM,plIM],tabs:[
  `<p>De VKB is geen touw maar een waaier van vezelbundels. Je onderscheidt er twee: de <b>anteromediale bundel</b> (AM, goud label) en de <b>posterolaterale bundel</b> (PL, blauw label). Ze heten naar hun plek op het scheenbeen.</p><p>Op het dijbeen hechten ze op een andere plek aan. Daardoor draaien ze om elkaar als de knie buigt: bij een gestrekte knie staat vooral de <b>PL-bundel</b> strak, bij een gebogen knie vooral de <b>AM-bundel</b>. Zo is er bij elke kniehoek een deel van de band op spanning.</p>`,
  `<p>Kijk in stand <b>3</b>: de scheur ontstaat bij een licht gebogen knie (zo'n 20 tot 30°) met valgus en endorotatie. In die stand staan beide bundels onder spanning en kunnen ze samen te ver worden opgerekt.</p><p>Kies met <b>Graad 1–3</b> hoe ernstig: overrekking, een gedeeltelijke scheur (vaak één bundel) of een volledige scheur.</p>`,
  `<p>Een gescheurde VKB groeit niet vanzelf weer aan. Het gewrichtsvocht spoelt het stolsel weg en de uiteinden trekken terug. Bij een operatie maakt de chirurg een nieuwe band van een stuk pees, bijvoorbeeld van de hamstrings of de kniepees. Terug naar sport duurt meestal 9 tot 12 maanden.</p>`,
  `<p class="think">Zet stand 2 aan en volg de kleuren. Bij welke kniehoek staat de VKB als geheel het meest onder spanning? Waarom is landen met bijna gestrekte knieën dan riskant?</p>`]},
 {lv:1,name:'Achterste kruisband',lat:'Lig. cruciatum posterius (AKB)',layer:'Kruisbanden',at:()=>W.pcMid,view:[[6.5,2.8,-7.5],[.4,.7,-1.0]],focus:()=>[pcIM],pick:()=>[pcIM],tabs:[
  `<p>De achterste kruisband is dikker en sterker dan de voorste. Hij loopt van de binnenkant van de <b>mediale condylus</b> (vooraan in de groeve) naar de <b>achterkant van het scheenbeen</b>, onder het plateau.</p><p>Hij voorkomt dat het scheenbeen naar <b>achteren</b> wegschuift en staat het strakst in buiging. Samen met de VKB vormt hij een <b>X</b>: daar komt de naam kruisband vandaan.</p>`,
  `<p>Een AKB-letsel ontstaat vaak door een klap op de voorkant van het scheenbeen bij een gebogen knie: een val op de knie op een harde vloer, of het bekende dashboardletsel bij een auto-ongeluk.</p>`,
  `<p>De doorsnede van de AKB is ongeveer anderhalf keer zo groot als die van de VKB. Van alle kruisbandletsels is maar een klein deel een AKB-letsel.</p>`,
  `<p class="think">De AKB scheurt veel minder vaak dan de VKB. Bedenk twee redenen waarom.</p>`]},
 {lv:1,name:'Menisci',lat:'Meniscus medialis et lateralis',layer:'Menisci',state:2,at:()=>W.menMed,view:[[4.1,6.8,8.0],[1.2,.2,.2]],focus:()=>[menMed,menLat].concat(cartT1),pick:()=>[menMed,menLat],tabs:[
  `<p>Op het tibiaplateau liggen twee halvemaanvormige schijven van <b>vezelkraakbeen</b>: de mediale meniscus (binnenkant, C-vormig) en de laterale (buitenkant, bijna O-vormig). Ze zijn aan de buitenrand dik en lopen naar binnen dun uit. Zo maken ze van het platte plateau een kommetje voor de ronde condylen.</p><p>De meeste collageenvezels lopen <b>in de rondte</b>. Drukt het dijbeen de meniscus naar buiten, dan worden die vezels op trek belast: <b>ringspanning</b>. Zo wordt druk omgezet in trek. In stand 2 gloeien de ringen op.</p>`,
  `<p>De menisci verdelen de druk en vangen schokken op. Een <b>meniscusscheur</b> ontstaat vaak bij draaien op een gebogen, belaste knie, zoals bij een snelle richtingsverandering bij voetbal of hockey. Bij een VKB-scheur raakt vaak ook een meniscus beschadigd.</p>`,
  `<p>Alleen de buitenste rand van een meniscus, ongeveer een derde, heeft bloedvaten (de rode zone). Een scheur daar kan genezen. Een scheur in de binnenste witte zone geneest nauwelijks. In een gestrekte knie dragen de menisci ongeveer de helft van de belasting.</p>`,
  `<p class="think">De mediale meniscus is vastgegroeid aan de binnenste collaterale band, de laterale meniscus niet. Waarom raakt de mediale meniscus daardoor vaker beschadigd?</p>`]},
 {lv:2,name:'Collageenvezels en crimp',lat:'Fibrae collagenosae · collageen type I',state:2,at:()=>W.fib,view:[[3.2,2.6,9.5],[1.2,.4,1.6]],focus:()=>[fibIM,fanIM],pick:()=>[fibIM],tabs:[
  `<p>Onder de microscoop bestaat een band uit evenwijdige <b>collageenvezels</b>, elk een paar micrometer dik. In rust zijn ze golvend: de <b>crimp</b>.</p><p>Rek je de band, dan trekken eerst de golfjes recht. Dat kost weinig kracht: het <b>teengebied</b> van de rek-spanningscurve. Pas als een vezel gestrekt is, gaat hij echt kracht dragen: het <b>lineaire gebied</b>. Niet alle vezels zijn even golvend, dus ze worden één voor één ingeschakeld. Je ziet ze dan wit worden.</p>`,
  `<p>De crimp werkt als een schokdemper. Bij een normale squat of landing blijft de rek in de VKB laag, binnen het teengebied en het begin van het lineaire gebied. Gaat de rek verder, dan scheuren eerst losse vezels (graad 1). Bij nog meer rek bezwijken grote delen van de band (graad 2 en 3). Zie stand <b>3 · Overrekking</b>.</p>`,
  `<p>Een band bestaat voor ongeveer twee derde uit water. Van het droge gewicht is zo'n 70 tot 80% collageen, vooral type I. In het lab scheuren de eerste vezels rond 4 tot 8% rek, en bezwijkt de hele band meestal tussen 8 en 15%.</p>`,
  `<p class="think">Na een paar weken in het gips wordt een band slapper en zwakker. Wat zou er met de vezels gebeuren, en wat betekent dat voor de terugkeer naar sport?</p>`]},
 {lv:2,name:'Fibroblasten en haarvat',lat:'Fibroblastus · vas capillare',layer:'Fibroblasten',at:()=>W.cell,view:[[CV.x0*1.05+.3,CV.y+2.6,CV.z+9],[CV.x0*1.05,CV.y+1.4,CV.z]],focus:()=>[cellIM,nucIM,cap2,rbcIM],pick:()=>[cellIM,nucIM,cap2],tabs:[
  `<p>Tussen de vezels liggen <b>fibroblasten</b>: langgerekte cellen (paars, met een donkere kern) die collageen aanmaken en afbreken. Ze liggen in rijen tussen de vezels en voelen de rek. Belasting zet ze aan tot onderhoud.</p><p>Bloedvaten zijn er weinig. In de VKB lopen ze vooral in het dunne vlies eromheen (het rode haarvat). Daardoor gaan onderhoud en herstel langzaam.</p>`,
  `<p>Banden en pezen passen zich aan training aan, maar trager dan spieren. Een spier wordt binnen weken sterker, bindweefsel heeft maanden nodig. Bouw sprongvolume en nieuwe sporten daarom geleidelijk op, zeker in een groeispurt.</p>`,
  `<p>Met de koolstof-14 uit de kernproeven van de jaren zestig is gemeten hoe oud het collageen in pezen is. In de kern van de achillespees wordt het collageen na de puberteit vrijwel niet meer vervangen (Heinemeier e.a., 2013).</p>`,
  `<p class="think">De binnenste collaterale band geneest meestal vanzelf, de VKB bijna nooit. Gebruik de fibroblasten, het haarvat en het gewrichtsvocht in je uitleg.</p>`]},
 {lv:3,name:'Tropocollageen en D-streping',lat:'Fibrilla collagenosa · tropocollageen · D-periode',at:()=>W.mol,view:[[2.6,2.2,8.6],[-1,.5,.6]],focus:()=>[molIM],pick:()=>[molIM],tabs:[
  `<p>Eén collageenmolecuul, <b>tropocollageen</b>, is een <b>drievoudige helix</b>: drie eiwitketens om elkaar gedraaid, twee α1-ketens (roze) en één α2-keten (blauwgroen). Hij is ongeveer 300 nm lang en maar 1,5 nm dik; in het model is hij veel dikker getekend.</p><p>De moleculen liggen verspringend naast elkaar. Daardoor wisselen om de 67 nm een <b>gat</b> en een <b>overlap</b> elkaar af: de <b>D-streping</b> die je onder de elektronenmicroscoop ziet. De kleurstof zakt in de gaten: die kleuren donker (de blauwe vulling en de donkere banden op het vlies), de overlap blijft licht.</p>`,
  `<p>Rek je een fibril (stand 2), dan worden de moleculen een fractie langer en schuiven de gaten iets open. De D-periode groeit van 67 naar ongeveer 68 nm. Dat is de kleinste schaal waarop een band meegeeft als je landt.</p>`,
  `<p>Elke derde bouwsteen in een collageenketen is glycine, het kleinste aminozuur. Alleen dat past in het hart van de helix. Voor stevig collageen is ook vitamine C nodig: bij een tekort krijg je scheurbuik, waarbij bindweefsel uit elkaar valt.</p>`,
  `<p class="think">Een molecuul is 300 nm lang, een VKB ongeveer 3 cm. Hoeveel moleculen passen er achter elkaar over de lengte van de band? Reken het uit.</p>`]},
 {lv:3,name:'Crosslinks',lat:'Fibrilla collagenosa · crosslinks (lysyloxidase)',layer:'Crosslinks',at:()=>W.link&&W.link.clone().add(V(0,.95,.4)),view:[[-1.5,2.2,7.6],[0,.3,.4]],focus:()=>[linkIM],pick:()=>[linkIM],tabs:[
  `<p>De moleculen worden aan hun uiteinden aan elkaar vastgemaakt met <b>crosslinks</b> (oranje): chemische bruggetjes tussen buurmoleculen. Het enzym <b>lysyloxidase</b> maakt ze. Zonder crosslinks zou een fibril als een bos losse spaghetti uit elkaar glijden.</p><p>Bij overbelasting (stand 3) breken eerst de crosslinks. De moleculen glijden langs elkaar en de fibril scheurt. Zo kan een bandscheur op de kleinste schaal beginnen, ook in de VKB.</p>`,
  `<p>Met de jaren komen er meer crosslinks bij en wordt bindweefsel stugger. Bij jonge leerlingen is het soepeler, maar daar zit het zwakke punt vaak juist bij de groeischijf of de aanhechting aan het bot.</p>`,
  `<p>Collageen type I heeft een treksterkte van ongeveer 50 tot 100 MPa. Een koord van pees zo dik als een potlood kan ongeveer 300 kilo dragen.</p>`,
  `<p class="think">Waarom is het voor een fibril gunstig dat de moleculen verspringend liggen en niet allemaal kop aan kop? Denk aan waar de crosslinks zitten.</p>`]}];

const quiz=[
 {t:'R',type:'find',lv:0,state:1,view:[[-3.6,5.6,5.2],[0,4.7,0]],q:'Klik op de band die voorkomt dat het scheenbeen naar <b>voren</b> schuift. Het dijbeen en de knieschijf zijn nu doorzichtig.',

  fb:['Dat is de buitenste collaterale band (lig. collaterale fibulare). Die voorkomt dat de knie naar buiten openklapt (varus).','Goed! De voorste kruisband (lig. cruciatum anterius) loopt van achter-boven op het dijbeen naar voor-onder op het scheenbeen.','Dat is de kniepees (lig. patellae). Die brengt de kracht van de quadriceps over op het scheenbeen.','Dat is de laterale meniscus (meniscus lateralis): vezelkraakbeen dat de druk verdeelt, geen band.']},
 {t:'R',type:'find',lv:1,state:1,view:[[3.2,4.6,9.6],[0,.4,.4]],q:'Klik op de <b>meniscus medialis</b>. Tip: mediaal is de kant van de andere knie.',

 {t:'T1',type:'mc',lv:0,state:2,q:'Een leerling loopt de trap af naar de gymzaal. Welk spierwerk levert zijn quadriceps bij elke stap <b>omlaag</b>? Gebruik wat je in stand 2 zag.',
  opts:['Excentrisch: de spier wordt langer en remt de beweging af','Concentrisch: de spier wordt korter','Isometrisch: de lengte blijft gelijk','Hij is niet actief; de hamstrings doen het werk'],ok:0,
  ex:'Bij elke stap omlaag buigt de standknie, terwijl de quadriceps aanspant om je af te remmen. De spier wordt langer onder spanning: excentrisch, net als het zakken in de squat.',
  why:[null,'Concentrisch werkt hij bij de trap óp: dan strekt de knie en wordt de spier korter. Bij de trap af buigt de knie onder belasting.','Isometrisch zou betekenen dat de kniehoek gelijk blijft. Bij elke stap omlaag buigt de standknie.','Zonder quadriceps zak je door je knie. De hamstrings werken wel mee, maar remmen het buigen niet af.']},
 {t:'T1',type:'mc',lv:1,state:2,q:'Laat de knie buigen of gebruik de schuif. Welke bundel staat bij <b>90° buiging</b> het strakst?',
  opts:['De PL-bundel','Beide bundels zijn dan even slap','De AM-bundel','Geen van beide; alleen de AKB is dan gespannen'],ok:2,

  why:['De PL-bundel staat strak bij een gestrekte knie. Kijk naar de kleur en het balkje bij 90°: hij wordt grijs en hangt door.',"Kijk naar de kleuren: één bundel blijft wit. De twee bundels gedragen zich verschillend.",null,'De AKB staat in buiging inderdaad strak, maar een deel van de VKB ook. Kijk naar het balkje van de AM-bundel.']},
 {t:'T2',type:'mc',lv:0,state:3,q:'Vergelijk in stand 3 de <b>slechte</b> en de <b>goede landing</b>. Welk verschil verklaart het best waarom de VKB alleen bij de slechte landing scheurt?',
  opts:['Bij de goede landing springt de sporter minder hoog en komt hij zachter neer','Bij de slechte landing trekken de hamstrings het scheenbeen te hard naar achteren','Bij de slechte landing buigt de knie te diep, zodat de band te ver oprekt','Bij de goede landing buigen heup en knie meer, zonder valgus, en werken de hamstrings mee'],ok:3,
  ex:'De slechte landing combineert een stijve, licht gebogen knie met valgus, endorotatie en een quadriceps die het scheenbeen naar voren trekt. Bij de goede landing ontbreekt de valgus, trekken de hamstrings het scheenbeen naar achteren en is de remtijd langer, dus de piekkracht lager.',
  why:['De sprong is in beide gevallen even hoog. Het verschil zit in de landing zelf.','Het is andersom: bij de slechte landing zijn de hamstrings nauwelijks actief. Juist meewerkende hamstrings beschermen de VKB.','Het is andersom: bij de slechte landing buigt de knie weinig, van ongeveer 18° bij het neerkomen tot ruim 20° op het moment van de scheur. Bij de goede landing buigt hij tot ruim 70°. Diep inveren verlaagt de belasting op de VKB.',null]},
 {t:'T2',type:'mc',lv:2,state:2,q:'Bij een landing schiet de rek in de VKB binnen enkele honderdsten van een seconde omhoog. Waarom is het gunstig dat niet alle vezels even golvend zijn?',
  opts:['Golvende vezels maken meer fibroblasten aan, die de band versterken','De vezels gaan één voor één dragen, zodat de band geleidelijk stijver wordt en niet in één klap','Golvende vezels nemen extra water op en werken zo als een kussen','Zo breken de crosslinks pas als alle vezels helemaal recht zijn getrokken'],ok:1,
  ex:'Omdat elke vezel op een ander moment recht trekt, neemt het aantal dragende vezels geleidelijk toe. De band wordt vloeiend stijver: het teengebied van de curve. Zo vangt hij een plotselinge rek op zonder harde piek.',
  why:['Fibroblasten onderhouden het collageen, maar de golving bepaalt niet hoeveel cellen er zijn. Het gaat erom wanneer een vezel kracht gaat dragen.',null,'Water speelt een rol bij snelheidsafhankelijk gedrag, maar de golving is een eigenschap van de vezels zelf. Kijk in stand 2 hoe ze één voor één wit worden.','Crosslinks zitten binnen de fibrillen, een niveau dieper. De verschillen in golving bepalen wanneer elke vezel gaat meedragen.']},
 {t:'T2',type:'mc',lv:3,state:3,q:'Bij een tekort aan vitamine C of aan het enzym lysyloxidase maakt het lichaam weinig crosslinks. Wat verwacht je als zo\'n fibril wordt gerekt? Kijk in stand 3 wat er gebeurt als de crosslinks breken.',
  opts:['De moleculen worden korter, waardoor de fibril stugger wordt','De fibril wordt sterker, omdat de moleculen vrijer kunnen bewegen','De moleculen glijden al bij een kleine kracht langs elkaar: de fibril is zwak','Er verandert niets, want de drievoudige helix draagt alle kracht'],ok:2,
  ex:'Crosslinks geven de kracht door van molecuul naar molecuul. Zonder genoeg crosslinks glijden de moleculen al bij een kleine kracht langs elkaar, zoals je in stand 3 ziet als ze breken. Daarom is bindweefsel bij scheurbuik zwak.',
  why:['Moleculen worden bij rek juist een fractie langer. Zonder crosslinks verandert hun lengte niet, wel hun houvast aan elkaar.','Vrij bewegende moleculen kunnen geen kracht aan elkaar doorgeven. Kijk in stand 3: zodra de crosslinks breken, glijdt de fibril uit elkaar.',null,'Eén molecuul is sterk, maar maar 300 nm lang. De kracht moet via crosslinks van molecuul naar molecuul. Zonder die bruggetjes glijden ze los.']},
 {t:'I',type:'open',q:'Je geeft een les LO met veel spring- en landingsmomenten. Ontwerp één warming-up oefening die de kans op een VKB-scheur verkleint. Leg uit welke structuur uit de zoomreis je ermee beschermt, en hoe dat werkt van landing tot collageen.',
  model:'<p>Bijvoorbeeld: <b>landen als een veer</b>. Leerlingen springen van een bankje en landen zacht op twee voorvoeten, met heupen en knieën gebogen en de knieën recht boven de tenen. Uitbreiding: landen op één been, of landen en meteen wegdraaien. Spiegel in tweetallen op de kniepositie.</p><p>Je beschermt de <b>voorste kruisband</b>. Zonder valgus en endorotatie en met meer buiging blijft de rek in de band laag: de vezels blijven in het teengebied of net daarboven, en de crosslinks blijven heel. Door de heup mee te buigen werken de <b>hamstrings</b> mee: ze trekken het scheenbeen naar achteren. Langer remmen geeft een lagere piekkracht (zie <a href="landing.html" style="color:var(--gold)">Landing</a>).</p><p>Andere goede antwoorden: de Nordic hamstring curl, oefeningen uit FIFA 11+, of een balansoefening op één been met een knie die boven de tenen blijft (zie het lab <a href="evenwicht.html" style="color:var(--gold)">Evenwicht</a>).</p>'}];

  {t:'De voorste kruisband bestaat uit twee bundels: de anteromediale en de posterolaterale bundel.',cam:CAM1.close},
  {t:'Buigt de knie, dan winden de bundels om elkaar. Gestrekt staat vooral de PL-bundel strak, gebogen vooral de AM-bundel.',min:6},

 {chap:'4 · Collageen',lv:2,st:2,view:CAM2.wide,setup:()=>{S.slow=false;},lines:[

 {chap:'5 · De fibril',lv:3,st:2,view:CAM3.wide,setup:()=>{S.slow=false;},lines:[

 {chap:'6 · Overrekking',lv:3,st:3,view:CAM3.wide,setup:()=>{S.slow=false;},lines:[

  {t:'De crosslinks breken één voor één. De moleculen glijden langs elkaar en de fibril scheurt.',min:5.5},

 {chap:'7 · De scheur',lv:1,st:3,view:CAM1.front,setup:()=>{S.grade=3;},lines:[
