@media (max-width:820px){#hudMid .calc{font-size:10.5px;max-width:none}#hudMid .calc small{display:none}#ctl input[type=range]{width:70px}
  body.panel-open #hudMid,body.panel-open #ctl,body.panel-open #capX{display:none}
  #info.panel{max-height:min(calc(100% - var(--hudH,150px) - 170px),46vh)}
  body.panel-open #markers .mk:not(.on):not(.q),body.panel-open #markers .tg{display:none!important}}

body.quiz-on:has(.mk.q) .tg{display:none}

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

<script>
// op een smal scherm zet de motor de camera verder weg: begin daarom wat dichterbij
const NARROW=innerWidth<700;
// het model op de standaard: midden van de bovenkant van het heiligbeen (S1) in wereldcoördinaten
const SX=-4.4,SZ=-2.3,Y0=3.25,S0=.46;
// op een smal scherm staan de letters van een aanwijsopdracht in de bovenste helft (boven het paneel)
const QV=(v,dy)=>NARROW?[[v[0][0],v[0][1]-dy,v[0][2]],[v[1][0],v[1][1]-dy,v[1][2]]]:v;
const MX=.7,FZ=1.9,LB=4.2,FS=1.32;
Atlas3D({
 id:'wervel',halte:6,name:'Wervelkolom',docTitle:'Wervelkolom · Bewegingsatlas',
 aria:'3D-zoomreis door de onderrug: van tillen bij de zaalopbouw via twee wervels tot in de tussenwervelschijf',
 loader:['De wervelkolom wordt opgebouwd…','Van tillen tot tussenwervelschijf'],
 seed:6,
 shadow:{left:-11,right:11,top:12,bottom:-5},
 levels:[
  {name:'Rug',scale:'40 cm',sc:'ONDERRUG · TILLEN',title:'De onderrug',sub:'<i>Columna vertebralis, pars lumbalis</i> · tillen bij de zaalopbouw',
   view:NARROW?[[1.4,4.6,13.5],[-1.8,1.9,-.2]]:[[6.4,5.9,19.6],[-.8,2.25,-.6]],zoomTo:[SX+.15,Y0+1.0,SZ+.25],s1:'Rust',s2:'Tillen',s3:'Hernia',
   bg:['#34403e','#1a2322','#0b1010'],fog:0x1a2322,hemi:.62,shadows:true},
  {name:'Segment',scale:'5 cm',sc:'BEWEGINGSSEGMENT',title:'Twee wervels en een schijf',sub:'<i>Vertebrae L4 en L5 · discus intervertebralis</i> · facetgewrichten, banden en zenuwwortel',
   view:NARROW?[[8.5,1.4,11.5],[-.6,-1.7,0]]:[[11.2,4.8,15.2],[-.7,.25,0]],zoomTo:[-.95,.05,1.05],s1:'Rust',s2:'Buigen',s3:'Hernia',
   bg:['#2b3447','#141a26','#07090e'],fog:0x141a26,hemi:.55,drone:true},
  {name:'Schijf',scale:'5 mm',sc:'TUSSENWERVELSCHIJF',title:'In de tussenwervelschijf',sub:'<i>Anulus fibrosus · nucleus pulposus</i> · lamellen, kern en eindplaat',
   view:NARROW?[[5.5,7,17],[0,-2.6,0]]:[[6.4,8.2,18.5],[.2,-.7,0]],s1:'Rust',s2:'Druk',s3:'Scheurtjes',
   bg:['#1f3a41','#0f1d22','#050b0d'],fog:0x0f1d22,hemi:.8,drone:true}],
 help:{title:'Zo werkt de zoomreis',
  html:'<p>Je reist in twee stappen de onderrug in: van een <b>leerling die tilt</b> bij de zaalopbouw (40 cm), via <b>twee wervels met hun schijf</b> (5 cm), tot <b>in de tussenwervelschijf</b> (5 mm). Zoom in met <b>+</b> en uit met <b>−</b>, of klik op de ladder links.</p><ul><li>Klik op een genummerd punt of direct op het model voor uitleg in vier tabjes.</li><li>In stand 2 van de rug kies je hoe ver de leerling voorover buigt, hoe ver de last van het lichaam is en hoe zwaar de last is. De HUD rekent het moment, de kracht van de rugstrekkers en de druk op de onderste schijf uit.</li><li>Kleuren van de hefboom: <b style="color:#ffd36a">geel</b> is het draaipunt en de momentarm, <b style="color:#9cc8ff">blauw</b> de last, <b style="color:#ffb36b">oranje</b> de rugstrekkers. Banden zijn grijs als ze slap zijn, wit als ze gespannen zijn en rood als ze sterk gerekt zijn.</li><li>Met de laag <b>Schijven open</b> snijd je de tussenwervelschijven open, zodat je de kern ziet.</li></ul><h3>Drie standen</h3><p><b>1 Rust</b>: vrij verkennen. <b>2 Belasting</b>: tillen, buigen en strekken, of druk op de schijf. <b>3 Blessure</b>: een hernia na heel veel herhalingen, of scheurtjes in de vezelring. Bij de hernia kies je de ernst met Graad 1–3: uitpuiling, hernia en een losgeraakt stukje.</p>',
  states:'Rust · belasting · hernia of scheurtjes',
  note:'Vereenvoudigd didactisch model: verhoudingen en vervormingen zijn vergroot om ze zichtbaar te maken. De krachten in de HUD zijn modelwaarden voor een leerling van 60 kg, met een momentarm van de rugstrekkers van 5 cm. Echte waarden verschillen per persoon en per houding; lees ze als ‘ongeveer’.'},
 film:{brand:'WERVELKOLOM',blurb:'Hoe je rug tillen opvangt · ca. 3,5 minuut · met stem en ondertitels',file:'wervelkolom-uitleg'},
 quizEnd:'<p>Bespreek de slotvraag met je groep. Bouw daarna in de gymzaal samen een toestel op. Wie tilt, houdt de last dicht bij het lichaam en draait niet onder de last. Laat een medestudent filmen en vergelijk de houding met de hefboom uit stand 2.</p>',
 build(K){
const {THREE,V,AX,AY,AZ,R,clamp,lerp,smooth,ease,bump,D2R,TAU,mesh,std,glass,glow,add,BAND,UCYL,orient,segMatrix,placeMatrix,ZERO,inst,tube,lathe,CART,MUSC,TEND,ENV,canvasTex,groups,W,S}=K;
const SND=K.SND;
const G0=groups[0],G1=groups[1],G2=groups[2];
const _a=V(),_b=V(),_c=V(),_d=V(),_e=V(),_t=V(),_n=V(),_x=V(),_col=new THREE.Color(),_m4=new THREE.Matrix4(),_o=new THREE.Object3D(),_q=new THREE.Quaternion();
const fmt=(v,d)=>(+v).toFixed(d===undefined?1:d).replace('.',',');
const nf=v=>(Math.round(v/10)*10).toLocaleString('nl-NL');
const angD=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
const SPH=new THREE.SphereGeometry(1,18,12);
const ovm=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o===undefined?.95:o,depthTest:false,depthWrite:false,toneMapped:false});
const noShadow=m=>{m.castShadow=false;m.receiveShadow=false;return m;};

/* ================= gedeelde materialen ================= */
const boneTex=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#ece0c4';x.fillRect(0,0,w,h);for(let i=0;i<2600;i++){x.fillStyle=`rgba(${140+R()*60|0},${110+R()*50|0},${70+R()*40|0},${R()*.16})`;x.beginPath();x.arc(R()*w,R()*h,R()*2.4,0,TAU);x.fill();}for(let i=0;i<50;i++){x.strokeStyle=`rgba(150,120,80,${R()*.12})`;x.beginPath();const y=R()*h;x.moveTo(0,y);x.bezierCurveTo(w*.3,y+R()*20-10,w*.6,y+R()*20-10,w,y+R()*10-5);x.stroke();}},[2,2]);
const boneM=std(0xffffff,{map:boneTex,roughness:.55});
const rimM=std(0xf7efde,{roughness:.38});
const cartM=std(0x9fd0e6,{roughness:.2,transparent:true,opacity:.75,emissive:0x0a2a3a,emissiveIntensity:.4});
const annTex=canvasTex(512,128,(x,w,h)=>{x.fillStyle='#e8e1cf';x.fillRect(0,0,w,h);x.lineWidth=2;for(let i=-24;i<40;i++){x.strokeStyle='rgba(150,138,110,.38)';x.beginPath();x.moveTo(i*14,0);x.lineTo(i*14+h*1.7,h);x.stroke();x.strokeStyle='rgba(120,135,150,.28)';x.beginPath();x.moveTo(i*14+7,h);x.lineTo(i*14+7+h*1.7,0);x.stroke();}});
const cutTex=canvasTex(512,64,(x,w,h)=>{x.fillStyle='#86c2da';x.fillRect(0,0,w*.44,h);for(let i=0;i<260;i++){x.fillStyle=`rgba(255,255,255,${R()*.35})`;x.fillRect(R()*w*.44,R()*h,2,2);}
  const n=9;for(let k=0;k<n;k++){const a=w*.44+k*(w*.56/n);x.fillStyle=k%2?'#d6ccb3':'#ece4d0';x.fillRect(a,0,w*.56/n,h);x.fillStyle='rgba(90,80,60,.35)';x.fillRect(a,0,2,h);for(let i=0;i<30;i++){x.fillStyle=k%2?'rgba(120,110,90,.35)':'rgba(140,150,160,.3)';x.fillRect(a+R()*w*.56/n,R()*h,2,2);}}});
cutTex.wrapS=cutTex.wrapT=THREE.ClampToEdgeWrapping;
const annM=std(0xffffff,{map:annTex,roughness:.45,side:THREE.DoubleSide});
const cutM=std(0xffffff,{map:cutTex,roughness:.4,side:THREE.DoubleSide});
const nucM=std(0x86c4de,{roughness:.18,emissive:0x1a5a78,emissiveIntensity:.5});
const nerveM=std(0xe9c84a,{roughness:.4,emissive:0x3a2a00,emissiveIntensity:.3});
const duraM=glass(0xf1e8cc,.28);
const ligTex=canvasTex(64,128,(x,w,h)=>{x.fillStyle='#ffffff';x.fillRect(0,0,w,h);for(let i=0;i<w;i+=4){x.fillStyle=`rgba(150,140,120,${.15+R()*.25})`;x.fillRect(i,0,1.5,h);}});
const ligM=()=>std(0xf1ece0,{map:ligTex,roughness:.35});
const fibTex=(ang,col)=>canvasTex(128,128,(x,w,h)=>{x.fillStyle=col;x.fillRect(0,0,w,h);x.strokeStyle='rgba(90,30,20,.35)';x.lineWidth=2;for(let i=-10;i<20;i++){x.beginPath();x.moveTo(i*12,0);x.lineTo(i*12+Math.tan(ang)*h,h);x.stroke();}},[2,2]);

/* ================= een lendenwervel (eenheid: straal van het wervellichaam) ================= */
const H=1.15,D=.42;
const BODYGEO=new THREE.LatheGeometry([[.001,0],[.86,0],[.97,.04],[1,.12],[.93,.36],[.9,.575],[.93,.8],[1,1.03],[.97,1.11],[.86,1.15],[.001,1.15]].map(p=>new THREE.Vector2(p[0],p[1])),40);
const RIMGEO=new THREE.TorusGeometry(.93,.05,8,40);
const ARCHGEO=new THREE.TorusGeometry(.58,.15,10,28,Math.PI);
const FACGEO=new THREE.CylinderGeometry(.16,.16,.035,16);
// een plat botstuk: een vorm in het sagittale vlak (X = afstand naar achteren, Y = hoogte), uitgetrokken in de breedte
function sagGeo(pts,th,bev){const sh=new THREE.Shape();sh.moveTo(pts[0][0],pts[0][1]);sh.splineThru(pts.slice(1).concat([pts[0]]).map(p=>new THREE.Vector2(p[0],p[1])));
  const g=new THREE.ExtrudeGeometry(sh,{depth:th,bevelEnabled:true,bevelThickness:bev,bevelSize:bev*.8,bevelSegments:5,curveSegments:40,steps:1});g.translate(0,0,-th/2);g.rotateY(Math.PI/2);
  // ExtrudeGeometry geeft uv in wereldmaat; schaal ze voor de bottextuur
  const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*.5,uv.getY(i)*.5);g.computeVertexNormals();return g;}
// doornuitsteeksel: een bijlvormig blad naar achteren
const SPINGEO=sagGeo([[1.3,.98],[1.9,1.0],[2.45,.95],[2.66,.74],[2.64,.42],[2.45,.27],[1.95,.26],[1.5,.4],[1.28,.62]],.1,.1);
// gewrichtsuitsteeksels: omhoog (processus articularis superior, met vlak gewrichtsvlak naar binnen) en omlaag
const SUPGEO=sagGeo([[1.06,.8],[1.04,1.32],[1.16,1.6],[1.42,1.66],[1.66,1.46],[1.7,1.0],[1.45,.8]],.08,.07);
const INFGEO=sagGeo([[1.14,.55],[1.1,.05],[1.2,-.28],[1.44,-.34],[1.66,-.12],[1.68,.3],[1.55,.56]],.07,.07);
// kraakbeen van een facetgewricht: een licht gebogen schaaltje
const FCGEO=(()=>{const g=new THREE.CylinderGeometry(.3,.3,.04,28,1);g.rotateX(Math.PI/2);const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i)/.3,y=p.getY(i)/.3;p.setZ(i,p.getZ(i)+.035*(1-x*x-y*y));}g.computeVertexNormals();return g;})();
// dwarsuitsteeksel: taps, iets afgeplat, met een afgeronde punt
const PRONG=new THREE.LatheGeometry([[1,0],[.97,.3],[.85,.65],[.72,.88],[.5,.97],[.001,1]].map(p=>new THREE.Vector2(p[0],p[1])),12);
const facM=std(0x2f8fd6,{roughness:.22,emissive:0x1a60c0,emissiveIntensity:.45,side:THREE.DoubleSide});
function rod(a,b,r,mat,p){const m=mesh(BAND,mat,0,0,0,p);orient(m,V(...a),V(...b),r);const t=mesh(SPH,mat,b,0,[r*1.25,r*1.25,r*1.25],p);return [m,t];}
function prong(a,b,w,d,mat,p){const m=mesh(PRONG,mat,0,0,0,p);orient(m,V(...a),V(...b),w,d);return m;}
function vertebra(parent){const g=new THREE.Group();parent.add(g);
  const body=mesh(BODYGEO,boneM,[0,0,0],0,[1,1,.74],g);
  const rims=[mesh(RIMGEO,rimM,[0,H-.035,0],[Math.PI/2,0,0],[1,.74,1],g),mesh(RIMGEO,rimM,[0,.035,0],[Math.PI/2,0,0],[1,.74,1],g)];
  const ped=[-1,1].map(s=>rod([s*.48,.72,-.5],[s*.56,.72,-1.12],.19,boneM,g)).flat();
  const arch=mesh(ARCHGEO,boneM,[0,.62,-1.15],[-Math.PI/2,0,0],[1,1,2.3],g);
  const spin=mesh(SPINGEO,boneM,[0,0,0],0,0,g);
  const tr=[-1,1].map(s=>prong([s*.55,.74,-1.0],[s*1.66,.82,-1.3],.15,.1,boneM,g));
  const sup=[-1,1].map(s=>mesh(SUPGEO,boneM,[s*.71,0,0],0,0,g));
  const inf=[-1,1].map(s=>mesh(INFGEO,boneM,[s*.37,0,0],0,0,g));
  // gewrichtsvlakken met kraakbeen: bovenste naar binnen, onderste naar buiten gericht; de spleet ertussen is het facetgewricht
  const supF=[-1,1].map(s=>mesh(FCGEO,facM,[s*.585,1.3,-1.38],[0,-s*Math.PI/2,0],[1.05,1.15,1],g));
  const infF=[-1,1].map(s=>mesh(FCGEO,facM,[s*.495,.08,-1.4],[0,s*Math.PI/2,0],[1,1.1,1],g));
  return {g,body,rims,ped,arch,spin,tr,sup,inf,supF,infF,bodyParts:[body,...rims],archParts:[arch,spin,...ped,...tr],facParts:[...sup,...inf,...supF,...infF]};}
// keten van wervels: elke wervel hangt aan een gewricht midden in de schijf eronder
function chain(parent,n){const base=new THREE.Group();parent.add(base);const J=[],Vt=[];let prev=base,top=0;
  for(let i=0;i<n;i++){const j=new THREE.Group();j.position.set(0,top+D/2,-.15);prev.add(j);const vt=vertebra(j);vt.g.position.set(0,D/2,.15);J.push(j);Vt.push(vt);prev=vt.g;top=H;}
  return {base,J,V:Vt};}

/* ---------- een vervormbare tussenwervelschijf tussen twee eindplaten ---------- */
function discPart(parent,mat,o){const uv=[],idx=[],par=[];
  const grid=(nu,nv,f)=>{const b=par.length/3;for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const q=f(i/nu,j/nv);par.push(q[0],q[1],q[2]);uv.push(q[3],q[4]);}for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=b+j*(nu+1)+i,c=a+nu+1;idx.push(a,c,a+1,a+1,c,c+1);}};
  if(o.side)grid(o.NS,o.NH,(u,v)=>[lerp(o.a0,o.a1,u),1,v,u*(o.a1-o.a0)/TAU*5,v]);
  else{grid(o.NR,o.NH,(u,v)=>[o.a0,1-u,v,1-u,v]);grid(o.NR,o.NH,(u,v)=>[o.a1,u,v,u,v]);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(par.length),3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);
  const m=mesh(g,mat,0,0,0,parent);m.frustumCulled=false;return {m,g,par:new Float32Array(par)};}
function discUpd(p,M,yA,Rx,Rz,bul){const P=p.g.attributes.position.array,q=p.par;
  for(let k=0,n=q.length/3;k<n;k++){const th=q[3*k],rho=q[3*k+1],h=q[3*k+2];const sx=Math.sin(th),cz=Math.cos(th);const lx=rho*Rx*sx,lz=rho*Rz*cz;
    _a.set(lx,yA,lz);_b.set(lx,0,lz).applyMatrix4(M);const gap=_a.distanceTo(_b);_c.lerpVectors(_a,_b,h);
    const b=bul(th,gap)*rho*Math.sin(Math.PI*h);P[3*k]=_c.x+sx*Rx*b;P[3*k+1]=_c.y;P[3*k+2]=_c.z+cz*Rz*b;}
  p.g.attributes.position.needsUpdate=true;p.g.computeVertexNormals();}
// de wig die je wegsnijdt kijkt naar de camera (lokaal −x en voorkant +z)
const CUT0=-1.75,CUT1=.2,THH=-2.45;
function makeDisc(parent){const d={parent,Rx:1,Rz:.74,open:false,hern:0,TH:THH,mid:V(),rim:V(),dir:V()};
  d.full=discPart(parent,annM,{side:true,a0:0,a1:TAU,NS:48,NH:6});
  d.cs=discPart(parent,annM,{side:true,a0:CUT1,a1:CUT0+TAU,NS:40,NH:6});
  d.cf=discPart(parent,cutM,{side:false,a0:CUT1,a1:CUT0+TAU,NR:6,NH:6});
  d.nuc=noShadow(mesh(SPH,nucM,0,0,0,parent));
  d.setOpen=v=>{d.open=v;d.full.m.visible=!v;d.cs.m.visible=d.cf.m.visible=v;};d.setOpen(false);
  d.parts=()=>[d.full.m,d.cs.m,d.cf.m,d.nuc];
  return d;}
function discStep(d,M,yA,rotX,comp,tot){const bul=(th,gap)=>.05+1.3*Math.max(0,(D-gap)/D)+.3*comp+d.hern*Math.exp(-Math.pow(angD(th,d.TH)/.34,2));
  if(d.open){discUpd(d.cs,M,yA,d.Rx,d.Rz,bul);discUpd(d.cf,M,yA,d.Rx,d.Rz,bul);}else discUpd(d.full,M,yA,d.Rx,d.Rz,bul);
  _b.set(0,0,0).applyMatrix4(M);const gap=Math.hypot(_b.x,_b.y-yA,_b.z);
  // de kern schuift bij buigen naar achteren (−z) en bij strekken naar voren
  d.shift=-rotX*.95;d.nuc.position.set(_b.x*.5,(yA+_b.y)/2,_b.z*.5+d.shift);d.nuc.rotation.set((tot===undefined?rotX:tot)*.5,0,0);d.nuc.scale.set(.44*(1+.12*comp),gap*.4,.31*(1+.12*comp));
  d.mid.copy(d.nuc.position);
  // rand van de schijf achter-opzij, waar een hernia uitpuilt
  const sx=Math.sin(d.TH),cz=Math.cos(d.TH);_a.set(sx,yA,cz*.74);_c.set(sx,0,cz*.74).applyMatrix4(M);d.rim.lerpVectors(_a,_c,.5);d.dir.set(sx,0,cz).normalize();}

/* ================================================================
   NIVEAU 0 · de onderrug op een standaard, en tillen bij de zaalopbouw
   ================================================================ */

 reset(){L2.t=0;L2.cracked=0;L2.ext=0;L2.out=0;L2.step=-1;},
 hud(){const st=S.state;return (st===2?K.stepsHTML(['1 Belasten','2 Water eruit','3 Ontlasten','4 Water erin']):'')+K.bars(st===3?['Gescheurde lagen','Kern lekt','Druk in de kern']:['Druk in de kern','Water in de kern','Schijfhoogte']);},
 ctl(){if(S.state!==2)return '';return `<label>Tempo</label><input type="range" id="sSp2" min=".3" max="2.5" step=".05" value="${L2.sp}" aria-label="Tempo">`;},
 bind(){const s=K.$('#sSp2');if(s)s.addEventListener('input',e=>L2.sp=+e.target.value);},
 sound(api){if(L2.sndC){L2.sndC=0;api.noise(1.4,'lowpass',260,.8,.18,.25);}if(L2.sndCr){L2.sndCr=0;api.noise(.06,'highpass',3500,.7,.12,.002);api.thump(140,.08,.08);}
  if(S.state===2&&L2.step===1&&R()<.03)api.tone(420+R()*300,.06,.018,'sine');if(S.state===2&&L2.step===3&&R()<.03)api.tone(700+R()*300,.05,.015,'sine');}
};

const P=[
 {lv:0,name:'Lendenwervelkolom',lat:'Vertebrae lumbales L1–L5 · lordosis lumbalis',at:()=>W.l3,view:[[SX+8.8,Y0+3.6,SZ+12.8],[SX+.2,Y0+1.6,SZ]],focus:()=>[lum.base],pick:()=>lum.V.map(v=>v.body),tabs:[
  `<p>De onderrug heeft vijf <b>lendenwervels</b>, L1 tot en met L5. Ze zijn de grootste wervels van de wervelkolom, want ze dragen het gewicht van alles erboven. Daaronder ligt het <b>heiligbeen</b>.</p><p>Van opzij zie je een holle boog naar voren: de <b>lordose</b>. Met de borstkyfose en de halslordose maakt die van de wervelkolom een veer die schokken opvangt.</p>`,
  `<p>Kijk in stand 2 naar het model: buigt de leerling voorover, dan wordt de lordose platter, en bij diep bukken bijna recht. Maar het meeste buigen komt uit de <b>heupen</b>. Het model laat alleen het deel van de lendenwervels zien, ongeveer 40% van de rompbuiging.</p>`,
  `<p>De lendenwervelkolom van een volwassene is ongeveer 18 cm lang, en ongeveer een derde daarvan is tussenwervelschijf. Over de hele wervelkolom word je tussen ochtend en avond ongeveer 1 tot 2 cm korter, vooral doordat de schijven water verliezen.</p>`,
  `<p class="think">Waarom zijn de wervellichamen onderin de rug groter dan bovenin de nek?</p>`]},
 {lv:0,name:'Rugstrekkers',lat:'M. erector spinae',at:()=>W.erect,view:[[SX+.8,Y0+4.0,SZ+15.5],[SX-.5,Y0+1.1,SZ]],layer:'Spieren',focus:()=>[ER,ERsh],tabs:[
  `<p>De <b>rugstrekkers</b> zijn twee dikke spierstrengen links en rechts van de doornuitsteeksels. Ze lopen van het heiligbeen en de bekkenkam tot aan de nek. Ze strekken de rug en houden hem tegen als je voorover buigt.</p><p>Ze zitten maar ongeveer <b>5 cm</b> achter het draaipunt in de schijf. Daardoor moeten ze heel hard trekken om een last voor je lichaam in evenwicht te houden.</p>`,
  `<p>Zet stand 2 aan en schuif de last ver van het lichaam. Kijk naar het balkje <b>Rugstrekkers</b>: bij een last van 15 kg op een halve meter trekken ze al gauw met meer dan 2.000 N. Dichtbij en rechtop is het minder dan de helft. Op de rug van de leerling zie je de spieren mee oplichten.</p>`,
  `<p>Bij krachtsporters zijn drukkrachten op L4–L5 berekend van meer dan 17.000 N (Cholewicki e.a., 1991). Hun wervels en schijven zijn door jaren training ook sterker geworden: je rug past zich aan belasting aan.</p>`,
  `<p class="think">Waarom moeten de rugstrekkers bij tillen veel harder trekken dan de last zwaar is? Gebruik het woord momentarm.</p>`]},
 {lv:0,name:'Diepe rompspieren',lat:'M. multifidus · m. transversus abdominis',at:()=>W.multi,view:[[SX+7,Y0+3,SZ+13],[SX+.6,Y0+1.2,SZ]],layer:'Spieren',focus:()=>[MF,...taMeshes,...rect,...rectLow],tabs:[
  `<p>Dicht tegen de wervels liggen korte spiertjes die van wervel naar wervel lopen: de <b>m. multifidus</b>. Ze sturen elk segment apart. Rondom de buik ligt de <b>dwarse buikspier</b> (m. transversus abdominis) als een korset, met voorin de rechte buikspier (m. rectus abdominis).</p><p>Spannen ze samen aan, dan wordt de romp een stevige koker. Dat verdeelt de last en maakt de wervelkolom stabieler.</p>`,
  `<p>In de warming-up train je dit met planken, zijwaartse planken en ‘bird dogs’. Leerlingen voelen het bij het optillen van een bank: eerst de buik aanspannen, dan pas tillen. Je hoeft niet bang te zijn voor je rug. Maak hem vooral sterk.</p>`,
  `<p>Bij mensen met langdurige lage rugpijn is de multifidus op MRI-beelden vaak kleiner en vetter. Of dat oorzaak of gevolg is, weten onderzoekers nog niet zeker.</p>`,
  `<p class="think">Waarom helpt het om je buikspieren aan te spannen voordat je een zware mat optilt?</p>`]},
 {lv:0,name:'Heiligbeen en SI-gewricht',lat:'Os sacrum · articulatio sacroiliaca',at:()=>W.si,view:[[SX+6.5,Y0+1.2,SZ+11],[SX+.2,Y0-.6,SZ]],focus:()=>[sacG,PV],pick:()=>[sacG,...pelvParts],tabs:[
  `<p>Het <b>heiligbeen</b> bestaat uit vijf vergroeide wervels (S1–S5). Het zit als een wig tussen de twee bekkenhelften. De verbindingen heten de <b>SI-gewrichten</b> (sacro-iliacaal). Via die gewrichten gaat het gewicht van de romp naar de benen.</p><p>Het SI-gewricht beweegt maar een paar graden en wordt bijeengehouden door zeer sterke banden.</p>`,
  `<p>Bij tillen werken de <b>bilspieren</b> (grote bilspier, m. gluteus maximus) mee: zij strekken de heup en brengen de romp omhoog. Een goede tiller gebruikt zijn benen en billen, niet alleen zijn rug. Zie ook <a href="heup.html">halte 7 Heup en bekken</a>.</p>`,
  `<p>De bovenkant van het heiligbeen staat ongeveer 30 tot 40 graden schuin naar voren. Daarom ligt L5 op een helling en houden banden en de facetgewrichten hem tegen.</p>`,
  `<p class="think">Waarom is het handig dat het SI-gewricht bijna niet beweegt, terwijl de heup juist heel beweeglijk is?</p>`]},
 {lv:0,name:'Tillen als hefboom',lat:'M = F · d · rond L5–S1',at:()=>W.fig,view:[[MX-2.4,2.7,FZ+6.6],[MX+1.3,.95,FZ]],state:2,focus:fig1,pick:()=>[F1.root,bench],tabs:[
  `<p>Een tillende romp is een <b>hefboom</b>. Het draaipunt (geel) ligt in de onderrug, ongeveer bij de schijf tussen L5 en het heiligbeen. De last (blauw) hangt op afstand <b>d</b> voor dat draaipunt. Het moment is <b>M = F · d</b>.</p><p>De rugstrekkers (oranje) maken het tegenmoment, maar met een arm van maar 5 cm. Daarom geldt ongeveer: spierkracht = M ÷ 0,05 m.</p><div class="calc">15 kg ≈ 150 N op 0,50 m → 75 Nm<br>75 Nm ÷ 0,05 m = 1.500 N extra spierkracht<br>op 0,25 m: maar 750 N</div>`,
  `<p>Bij de zaalopbouw: <b>houd de last dicht bij je lichaam</b>, sta stevig en draai niet met een zware last in je handen; verplaats je voeten. Zware of lange spullen (banken, kasten, matten) til je met z’n tweeën. Probeer het in stand 2 met de schuif <b>Afstand</b>.</p><p>Door de knieën gaan helpt alleen als de last daardoor dichterbij komt. Past een bank of kastdeel niet tussen je knieën, dan levert diep hurken weinig op (van Dieën e.a., 1999).</p>`,
  `<p>Het Amerikaanse NIOSH gebruikt sinds 1981 een richtwaarde van 3.400 N drukkracht op de schijf L5–S1 en een grens van 6.400 N. De HUD kleurt de balk met dezelfde grenzen: groen, oranje en rood. Het zijn modelwaarden: echte waarden hangen af van lichaamsbouw en houding.</p>`,
  `<p class="think">Zet beide schuiven eens op hun uiterste. Welke verlaagt de drukkracht het meest? Kijk in de rekenstrook welke afstanden veranderen: die van de last en die van je romp. Zie ook het lab <a href="evenwicht.html">Evenwicht</a>.</p>`]},
 {lv:1,name:'Wervellichaam',lat:'Corpus vertebrae',at:()=>W.body,view:[[9,3,11],[0,0,0]],focus:()=>[V5.g,V4.g].map(g=>g.children[0]).concat(V5.rims,V4.rims),pick:()=>[V5.body,V4.body],tabs:[
  `<p>Het <b>wervellichaam</b> is het dikke, ronde voorste deel van de wervel. Het draagt in een neutrale houding ongeveer 80% van de druk. Van binnen is het sponsachtig bot (trabeculair), met een stevig randje bovenaan en onderaan.</p>`,
  `<p>Sponsbot is licht én sterk: de balkjes lopen in de richting waarin de kracht loopt. Door te springen, landen en tillen wordt het steviger. Daarom is bewegen in de jeugd belangrijk voor sterke botten later.</p>`,
  `<p>Een lendenwervel kan in het lab een drukkracht van ongeveer 5.000 tot 10.000 N verdragen voordat de eindplaat breekt (jonge volwassenen). Bij jonge, getrainde mensen is dat meer dan bij ouderen met botontkalking.</p>`,
  `<p class="think">Waarom is het wervellichaam van binnen sponsachtig en niet massief?</p>`]},
 {lv:1,name:'Wervelboog en uitsteeksels',lat:'Arcus vertebrae · processus spinosus · processus costiformis',at:()=>W.spin,view:[[1.5,4.5,13],[-2,.4,0]],focus:()=>[...V5.archParts,...V4.archParts],tabs:[
  `<p>Achter het wervellichaam zit de <b>wervelboog</b>. Samen omsluiten ze het <b>wervelkanaal</b>, waarin de zenuwen liggen. Aan de boog zitten uitsteeksels: het <b>doornuitsteeksel</b> naar achteren (dat voel je op je rug) en de <b>dwarsuitsteeksels</b> opzij. Bij lendenwervels heten die processus costiformis: ze zijn een overblijfsel van ribben.</p><p>Aan de uitsteeksels hechten spieren en banden. Ze werken als hefboompjes.</p>`,
  `<p>Turners die vaak overstrekken (brug achterover, flikflak, overslag) krijgen soms een vermoeiingsbreukje in de boog van L5, in het smalle deel tussen de gewrichtsuitsteeksels: <b>spondylolyse</b>. Dat komt vaker voor bij turnen, ballet en werpsporten dan bij andere jongeren. Leer overstrekking daarom geleidelijk op te bouwen.</p>`,
  `<p>Spondylolyse komt bij ongeveer 6% van alle volwassenen voor, vaak zonder klachten. Bij sommige groepen topturnsters is het percentage meer dan twee keer zo hoog.</p>`,
  `<p class="think">Waarom zou overstrekken (zoals bij een brug achterover) juist de wervelboog belasten en niet het wervellichaam?</p>`]},
 {lv:1,name:'Facetgewrichten',lat:'Articulationes zygapophysiales',at:()=>W.facet,view:[[-9.5,3.4,8.8],[-1.5,.8,.4]],focus:()=>[...V5.supF,...V4.infF,...V4.inf,...V5.infF,...V4.supF,...facCap],pick:()=>[...V5.facParts,...V4.facParts],state:2,tabs:[
  `<p>Elke wervel heeft achterin vier kleine gewrichtsuitsteeksels: twee omhoog en twee omlaag. Die van de wervel erboven en eronder vormen samen de <b>facetgewrichten</b>, met kraakbeen (blauw) en een gewrichtskapsel. In de onderrug staan ze bijna verticaal, als een rails van voor naar achter.</p><p>Daardoor kun je de onderrug goed buigen en strekken, maar nauwelijks draaien.</p>`,
  `<p>Kijk in stand 2. Bij <b>strekken</b> worden de facetten op elkaar gedrukt en lichten ze op: ze dragen dan een flink deel van de last. Bij <b>buigen</b> glijden ze open. Draaien gebeurt vooral in de borstwervelkolom en de heupen, niet in de onderrug.</p>`,
  `<p>Per lendensegment kun je maar ongeveer 1 à 2 graden draaien, de hele onderrug samen ongeveer 10 graden. Bij draaien botsen de facetten aan één kant tegen elkaar en remmen ze de beweging. Ben je ook voorover gebogen, dan staan de facetten meer open en komt het draaien meer op de vezelring terecht.</p>`,
  `<p class="think">Een leerling draait met een kastdeel in zijn handen. Waarom is het beter dat hij zijn voeten verplaatst?</p>`]},
 {lv:1,name:'Banden',lat:'Lig. longitudinale anterius et posterius · lig. flavum · lig. interspinale',at:()=>W.flav,view:[[3,4,13],[-1.2,.3,0]],layer:'Banden',state:2,focus:()=>LIG.map(l=>l.m),tabs:[
  `<p>Banden houden de wervels bij elkaar. Voor op de wervellichamen loopt de brede <b>voorste lengteband</b>, achterop in het kanaal de smallere <b>achterste lengteband</b>. Tussen de bogen ligt de elastische <b>gele band</b> (lig. flavum), en tussen en over de doornuitsteeksels lopen nog twee banden.</p><p>Kleur: grijs is slap, wit is gespannen, rood is sterk gerekt.</p>`,
  `<p>Buig je voorover, dan komen de banden achterin op spanning: ze vangen een deel van het moment op. Bij een volledig gebogen rug, zoals bij je tenen aanraken met gestrekte benen, nemen banden en fascie het over en ontspannen de rugstrekkers zelfs even. Dat heet het flexie-relaxatiefenomeen.</p>`,
  `<p>De gele band bestaat voor ongeveer twee derde uit elastine. Dat maakt hem rekbaar en zorgt dat hij bij strekken niet in het wervelkanaal plooit.</p>`,
  `<p class="think">De achterste lengteband is in de onderrug smal en dekt alleen het midden van de schijf. Wat betekent dat voor de plek waar een hernia meestal naar buiten komt?</p>`]},
 {lv:1,name:'Zenuwwortel en cauda equina',lat:'Radix nervi spinalis · cauda equina · ganglion sensorium',at:()=>W.root,view:[[-6,3,12],[-1.5,-.6,.6]],layer:'Zenuwen',focus:()=>nerve1,tabs:[
  `<p>Het <b>ruggenmerg</b> stopt bij volwassenen ter hoogte van L1–L2. Daaronder loopt een bundel zenuwwortels door het wervelkanaal: de <b>cauda equina</b> (paardenstaart), in een vlies (dura). Op elk niveau verlaat links en rechts een wortel het kanaal door een gat tussen de wervels. Het knobbeltje is het spinale ganglion met de gevoelscellen.</p><p>De wortel van L5 loopt achter de schijf tussen L4 en L5 langs naar beneden. Precies daar drukt een hernia meestal op.</p>`,
  `<p>De wortels van L4 tot S3 vormen samen de <b>heupzenuw</b> (n. ischiadicus) naar het been. Bij een geprikkelde wortel voelen sporters de pijn in het been: dat heet <b>ischias</b>. Lees ook halte 1 <a href="zenuw.html">Zenuwstelsel</a> over hoe een zenuw prikkels geleidt.</p>`,
  `<p>Bij ongeveer 9 van de 10 mensen met lage rugpijn is er geen duidelijke oorzaak aan te wijzen. Dat heet aspecifieke lage rugpijn (Maher e.a., 2017). Een uitpuilende schijf zie je op een MRI ook bij ongeveer 30% van de twintigers zonder klachten (Brinjikji e.a., 2015).</p>`,
  `<p class="think">Waarom voel je de pijn van een beknelde zenuwwortel in je been, terwijl het probleem in je rug zit?</p>`]},
 {lv:2,name:'Vezelring',lat:'Anulus fibrosus',at:()=>W.lam,view:[[-5.5,5.2,15.5],[-2.6,-.2,2.8]],focus:()=>[...LAM.map(l=>l.m),FIB2],tabs:[
  `<p>De <b>vezelring</b> bestaat uit 15 tot 25 concentrische lagen (lamellen) van collageen. Het model toont er negen. In elke laag lopen de vezels schuin, ongeveer 30 graden ten opzichte van de horizontaal, en in elke volgende laag de andere kant op. Aan de trap links zie je die wisselende richting.</p><p>Door die kruislingse bouw kan de ring druk, buigen en een beetje draaien weerstaan, zoals de lagen van een autoband.</p>`,
  `<p>Bij een discusworp, of als je wegdraait met een kastdeel in je handen, draait je romp onder last. Bij draaien wordt telkens maar de helft van de lagen gerekt: die met de vezels in de draairichting. Draaien onder een zware last en tegelijk buigen belast de ring daarom het meest. Zie stand 3.</p>`,
  `<p>De buitenste lagen van de vezelring hebben zenuwuiteinden; de binnenste niet. Een scheurtje van binnen voel je daardoor vaak niet, tot het de buitenkant bereikt.</p>`,
  `<p class="think">Waarom lopen de vezels in de lagen niet allemaal dezelfde kant op?</p>`]},
 {lv:2,name:'Kern',lat:'Nucleus pulposus',at:()=>W.nuc,view:[[4.5,7,13],[.3,-.2,1]],layer:'Water',state:2,focus:()=>[NUC2,WAT,PGc,PGb],tabs:[
  `<p>De <b>kern</b> is een gel van ongeveer 80% water. Het water wordt vastgehouden door <b>proteoglycanen</b> (paars): grote moleculen die als een flessenborstel water aantrekken. Daardoor staat de kern onder druk, ook in rust.</p><p>Druk je op de schijf, dan duwt de kern naar alle kanten. De vezelring vangt die druk op als een hoepel die gespannen wordt.</p>`,
  `<p>Vlak na het opstaan zijn je schijven vol water en stijver. Diep bukken en zwaar tillen belasten ze dan meer. Begin een vroege training of een ochtend op schoolkamp daarom met rustig bewegen.</p>`,
  `<p>Een bekende meting (Wilke e.a., 1999) in de schijf L4–L5: liggen ongeveer 0,1 MPa, staan 0,5 MPa, voorover gebogen staan 1,1 MPa, en 20 kg tillen met een ronde rug 2,3 MPa. Met de knieën gebogen en de last dichtbij was het 1,7 MPa.</p><p>Druk is kracht per oppervlak: 2 MPa is 2 N per mm². Op een schijf van ongeveer 15 cm² (1.500 mm²) hoort daar een drukkracht van ongeveer 3.000 N bij: dezelfde orde als de HUD op het niveau Rug.</p>`,
  `<p class="think">Waarom meet je de lengte van een leerling voor een groeicurve het beste steeds op hetzelfde moment van de dag?</p>`]},
 {lv:2,name:'Eindplaat',lat:'Lamina cartilaginea · facies intervertebralis',at:()=>W.ep,view:[[10,5,10.5],[2.4,0,.8]],focus:()=>[EPu,EPl,BNl,BNu,...capi],tabs:[
  `<p>Boven en onder de schijf ligt een dunne laag kraakbeen: de <b>eindplaat</b>. Daarachter ligt het sponsachtige bot van het wervellichaam, met haarvaten (rood). De volwassen schijf heeft zelf <b>geen bloedvaten</b>: het is het grootste orgaan zonder eigen bloedvoorziening.</p><p>Voedingsstoffen (geel) sijpelen vanuit de haarvaten door de eindplaat de schijf in. Afvalstoffen gaan de andere kant op.</p>`,
  `<p>Afwisselend belasten en ontlasten pompt vocht in en uit de schijf. Bewegen is dus goed voor de schijf: lang stilzitten of stilstaan is dat minder. Wissel daarom houdingen af, ook in een lange theorieles.</p>`,
  `<p>Omdat de voedingsstoffen ver moeten diffunderen, zit midden in de schijf heel weinig zuurstof. De cellen van de kern leven grotendeels zonder zuurstof.</p>`,
  `<p class="think">Waarom zou een schijf slecht herstellen na een scheurtje, terwijl een spier dat wel goed doet?</p>`]},
];

// Op een smal scherm (tot 820 px) ligt het infopaneel over de onderste helft van het beeld. Schuif camera en doel dan zo ver omlaag
// dat het ankerpunt van het geopende punt midden in de vrije strook tussen de kop en het paneel staat.
// De motor zet de camera op een staand scherm verder weg (tot 1,9×) en kijkt dan met 48° in plaats van 36°: daar rekent dit mee.
const _pc=new THREE.PerspectiveCamera(48,1,.05,300),_pv=V();
// k: camera zoveel keer verder weg (voor een punt dat na het openen veel beweegt)
function liftView(v,anchor,k){const w=innerWidth,h=innerHeight,asp=w/h;if(w>820)return v;
  const T=V(...v[1]),P0=V(...v[0]).sub(T).multiplyScalar(k||1).add(T),P1=P0.clone().sub(T).multiplyScalar(asp<1?Math.min(1.9,1/Math.pow(asp,.85)):1).add(T);
  // vrije strook: onder de kop, boven het paneel (paneel: 46% van de hoogte, boven de ingeklapte HUD van ongeveer 93 px)
  const tb=K.$('#top'),top=tb?tb.getBoundingClientRect().bottom:.19*h,pTop=h-117-Math.min(.46*h,h-93-170),f=clamp((top+pTop)/2/h,.15,.5);
  const A=anchor&&anchor.isVector3?anchor:T,want=1-2*f;_pc.fov=asp<1?48:36;_pc.aspect=asp;_pc.updateProjectionMatrix();
  const yAt=d=>{_pc.position.set(P1.x,P1.y-d,P1.z);_pc.lookAt(T.x,T.y-d,T.z);_pc.updateMatrixWorld(true);return _pv.copy(A).project(_pc).y;};
  let lo=-30,hi=30;for(let i=0;i<26;i++){const m=(lo+hi)/2;if(yAt(m)<want)lo=m;else hi=m;}
  const L=P1.distanceTo(T),d=clamp((lo+hi)/2,-.6*L,.6*L);return [[P0.x,P0.y-d,P0.z],[T.x,T.y-d,T.z]];}
// De tiller gaat na het openen op en neer: richt bij hem op het midden van die beweging (borst tussen rechtop en gebukt),
// en kijk iets verder weg, zodat het punt in de strook blijft.
P[4].mobAt=V(MX-.14,1.9,FZ+.3);P[4].mobK=1.5;
P.forEach(p=>{if(!p.view)return;const v0=p.view;Object.defineProperty(p,'view',{configurable:true,enumerable:true,get(){let a=p.mobAt||null;if(!a){try{a=p.at();}catch(e){}}return liftView(v0,a,p.mobK);}});});
