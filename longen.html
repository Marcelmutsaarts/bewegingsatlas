   view:(innerWidth<innerHeight?[[-1.6,3.6,16.5],[.8,-.1,-.3]]:[[-2.4,3.2,13.8],[1.0,-.2,-.3]]),zoomTo:[7.1,2.75,-.35],s1:'Rust',s2:'Inspanning',s3:'Astma-aanval',
   bg:['#3a2a2e','#1e1517','#0c0809'],fog:0x1e1517,hemi:.8,drone:true},

   view:(innerWidth<innerHeight?[[4,2.8,18.5],[.3,0,0]]:[[5.4,3.8,16.5],[.3,0,0]]),zoomTo:[.35,2.6,2.2],s1:'Rust',s2:'Inspanning',s3:'Astma',

   view:(innerWidth<innerHeight?[[.4,1.4,17.5],[0,-.8,0]]:[[1.0,2.2,15.5],[0,-.4,0]]),s1:'Rust',s2:'Inspanning',s3:'Astma',
   bg:['#1e2c44','#101827','#060910'],fog:0x121a28,hemi:.9,drone:true}],
 help:{title:'Zo werkt de zoomreis',
  html:'<p>Je begint bij een <b>borstkas</b> op een standaard in het inspanningslab, vergroot. Ernaast fietst een sporter met een ademmasker. Model en sporter ademen precies gelijk. Met <b>+</b> zoom je in: eerst op de <b>luchtwegen</b> (één centimeter), dan op een <b>longblaasje</b> (0,3 mm) en ten slotte op de <b>gaswisseling</b> (1 µm).</p><ul><li>Het <b>spirogram</b> onderin tekent het longvolume boven de rustpositie: blauw is inademen, oranje is uitademen, rood is uitademen door vernauwde luchtwegen. Zakt de lijn niet meer terug naar de nullijn, dan blijft er lucht achter in de longen. Ernaast zie je ademfrequentie (AF), teugvolume (VT), ademminuutvolume (V̇E) en hartfrequentie (HF).</li><li>Spieren gloeien op als ze werken: middenrif en tussenribspieren bij inademen, buikspieren bij actief uitademen, hulpademhalingsspieren bij zware ademarbeid.</li><li>Kleurcode: <b style="color:#ff9d8c">O₂</b> is rood-oranje, <b style="color:#9cc8ff">CO₂</b> is blauw. Zuurstofarm bloed is donker paarsrood, zuurstofrijk bloed helderrood.</li><li>Klik op een genummerd punt of op het model voor uitleg in vier tabjes.</li></ul><h3>Drie standen</h3><p><b>1 Rust</b>: rustig ademen, uitademen gaat vanzelf. <b>2 Inspanning</b>: kies het vermogen met de schuif (25 tot 350 watt). <b>3 Inspanningsastma</b>: hard fietsen in koude, droge lucht. Na een paar seconden vernauwen de luchtwegen. In het echt duurt dat minuten, en vaak komt het pas na het stoppen. Met de knop <b>Puffer</b> gaan ze weer open. Druk je vóór de aanval op Puffer, dan zie je wat preventief gebruik doet.</p>',
  states:'Rust · inspanning · inspanningsastma',keys:[['<kbd>M</kbd>','Slow motion']],
  note:'Vereenvoudigd didactisch model: aantallen, kleuren, verhoudingen en de bewegingen van de ribben zijn aangepast om ze zichtbaar te maken. Waarden zijn ordegroottes voor een getrainde jongvolwassene. Deze halte geeft geen medisch advies: volg bij astma altijd het astmaplan van de leerling en de ouders.'},
 film:{brand:'LONGEN EN ADEMHALING',blurb:'Hoe je longen inspanning bijhouden · ca. 4 minuten · met stem en ondertitels',file:'longen-uitleg'},
 quizEnd:'<p>Bespreek de slotvraag met je groep. Probeer daarna in de gymzaal de <b>praattest</b>: laat een tweetal tijdens een duurloop om de beurt een zin hardop zeggen. Lukt dat niet meer, dan zit je boven de ventilatoire drempel. Kijk in <a href="hart.html">het hart</a> waar het bloed uit de longen naartoe gaat, en in <a href="spier.html">de spier</a> waarvoor de zuurstof nodig is.</p>',
 build(K){
const {THREE,V,AX,AY,AZ,clamp,lerp,smooth,ease,bump,D2R,TAU,mesh,std,glass,glow,add,orient,segMatrix,placeMatrix,ZERO,inst,tube,lathe,groups,W,S,R,BAND,UCYL,sunflower}=K;
const _c=new THREE.Color(),_c2=new THREE.Color(),_v=V(0,0,0),_w=V(0,0,0),_a=V(0,0,0),_b=V(0,0,0),_q=new THREE.Quaternion(),_m=new THREE.Matrix4();
const G0=groups[0],G1=groups[1],G2=groups[2],G3=groups[3];
const nd=m=>{m.castShadow=false;return m;};
const fmt=(v,d)=>v.toFixed(d===undefined?1:d).replace('.',',');
/* ---------- geometrie samenvoegen (voor haarvatnetten) ---------- */
function merge(geos){let nv=0,ni=0;geos.forEach(g=>{nv+=g.attributes.position.count;ni+=g.index?g.index.count:g.attributes.position.count;});
  const pos=new Float32Array(nv*3),nor=new Float32Array(nv*3),col=new Float32Array(nv*3),idx=new Uint32Array(ni);let o=0,oi=0;
  geos.forEach(g=>{const p=g.attributes.position,n=g.attributes.normal,c=g.attributes.color;pos.set(p.array,o*3);nor.set(n.array,o*3);if(c)col.set(c.array,o*3);else col.fill(1,o*3,(o+p.count)*3);
    if(g.index){for(let i=0;i<g.index.count;i++)idx[oi++]=g.index.array[i]+o;}else{for(let i=0;i<p.count;i++)idx[oi++]=i+o;}o+=p.count;g.dispose();});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setIndex(new THREE.BufferAttribute(idx,1));return g;}
function tubeColored(pts,r,seg,rs,colFn){const cv=new THREE.CatmullRomCurve3(pts);const g=new THREE.TubeGeometry(cv,seg,r,rs);const n=g.attributes.position.count,col=new Float32Array(n*3);
  for(let i=0;i<=seg;i++){const c=colFn(i/seg);for(let j=0;j<=rs;j++){const k=(i*(rs+1)+j)*3;col[k]=c.r;col[k+1]=c.g;col[k+2]=c.b;}}g.setAttribute('color',new THREE.BufferAttribute(col,3));return {g,cv};}
const UB=V(0,1,.25).normalize();
// een doorgesneden buis waarvan de straal per frame kan veranderen (luchtwegwand)
function pipe(curve,nS,nT,th0,th1,mat,parent){const fr=[];for(let i=0;i<=nS;i++){const s=i/nS;const P=curve.getPointAt(s),T=curve.getTangentAt(s);const u1=UB.clone().addScaledVector(T,-T.dot(UB)).normalize();const u2=V(0,0,0).crossVectors(T,u1);fr.push({P,T,u1,u2,s});}
  const pos=new Float32Array((nS+1)*(nT+1)*3),uv=new Float32Array((nS+1)*(nT+1)*2),idx=[];
  const col=new Float32Array((nS+1)*(nT+1)*3);for(let i=0;i<=nS;i++)for(let j=0;j<=nT;j++){const k=i*(nT+1)+j;uv[k*2]=i/nS;uv[k*2+1]=j/nT;const th=th0+(th1-th0)*j/nT;const sh=.42+.58*Math.pow(Math.abs(Math.cos((th-Math.PI)/2)),.0)*smooth(Math.abs(th-Math.PI)/(Math.PI*.62));col[k*3]=col[k*3+1]=col[k*3+2]=sh;}
  for(let i=0;i<nS;i++)for(let j=0;j<nT;j++){const a=i*(nT+1)+j,b=a+nT+1;idx.push(a,b,a+1,b,b+1,a+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setIndex(idx);
  const m=mesh(g,mat,0,0,0,parent);m.castShadow=false;m.frustumCulled=false;
  function upd(rf){let k=0;for(let i=0;i<=nS;i++){const F=fr[i];for(let j=0;j<=nT;j++){const th=th0+(th1-th0)*j/nT;const r=rf(F.s,th);const c=Math.cos(th),sn=Math.sin(th);
      pos[k++]=F.P.x+r*(c*F.u1.x+sn*F.u2.x);pos[k++]=F.P.y+r*(c*F.u1.y+sn*F.u2.y);pos[k++]=F.P.z+r*(c*F.u1.z+sn*F.u2.z);}}
    g.attributes.position.needsUpdate=true;g.computeVertexNormals();}
  return {m,upd,fr,curve};}
function frameAt(curve,s){const P=curve.getPointAt(clamp(s,0,1)),T=curve.getTangentAt(clamp(s,0,1));const u1=UB.clone().addScaledVector(T,-T.dot(UB)).normalize();const u2=V(0,0,0).crossVectors(T,u1);return {P,T,u1,u2};}
function onRing(F,th,r,out){const c=Math.cos(th),s=Math.sin(th);return out.copy(F.P).addScaledVector(F.u1,r*c).addScaledVector(F.u2,r*s);}

/* ================= het ademmodel (gedeeld door alle niveaus) =================
   B.vol is het longvolume boven de rustpositie (FRC) in liters. Inademen is een halve cosinus,
   uitademen een exponentiële terugveer met tijdconstante. Bij vernauwde luchtwegen (B.c) wordt
   die tijdconstante groot: de uitademing is niet af als de volgende teug begint (air trapping). */
const NH=420;
const B={watt:200,f:0,ft:0,rr:12,vt:.5,ve:6,ti:.4,k:4,ph:0,v0:0,v1:0,vol:0,flow:0,insp:true,c:0,cMax:1,attack:false,attT:-1,puffT:-1,prevent:false,hr:65,vo2:.3,cad:0,crank:0,
  hist:new Float32Array(NH),histIn:new Uint8Array(NH),histC:new Float32Array(NH),hi:0,hAcc:0,ev:{}, hbT:0,tAtt:7,pef:0,pefNow:0,vePeak:6,ext:0,act:{dia:0,ext:0,int:0,abs:0,acc:0}};
const watt3=260;
function resetB(n){B.attack=false;B.attT=-1;B.puffT=-1;B.prevent=false;B.cMax=1;if(n!==3)B.c=0;}
function puffer(){if(S.state!==3||B.puffT>=0)return;B.puffT=S.stT;if(!B.attack)B.prevent=true;SND_puff=true;K.capSet(K.stateText(),B.attack?'<b>Puffer</b>: de luchtwegverwijder wordt ingeademd. Hij ontspant de gladde spiertjes rond de luchtwegen.':'<b>Puffer vooraf</b>: zo gebruiken veel leerlingen hun luchtwegverwijder volgens hun astmaplan, vóór de inspanning.');const b=K.$('#bPuff');if(b)b.classList.add('on');}
let SND_puff=false;
function breath(dt){
  B.ev={};
  const st=S.state,t=S.stT;
  // doel-intensiteit
  if(st===1)B.ft=0;else if(st===2)B.ft=B.watt/350;
  else{B.ft=watt3/350;
    if(!B.attack&&t>=B.tAtt){B.attack=true;B.attT=t;B.cMax=B.prevent?.22:1;B.ev.attack=true;K.flash({sound:false,a:.45,shake:.14});}
    if(B.attack){const u=t-B.attT;let c=B.cMax*smooth(u/5);let p=0;if(B.puffT>=0)p=smooth((t-Math.max(B.puffT,B.attT)-1.2)/5.5);c*=1-.88*p;B.c=c;
      B.ft=lerp(watt3/350,.5,smooth(u/4)*(B.prevent?.25:1));if(p>0)B.ft=lerp(B.ft,.28,p);}
    else B.c=0;}
  if(dt<=0)return;
  B.f+=(B.ft-B.f)*Math.min(1,dt/2.4);
  const f=B.f,c=B.c;
  const vtN=.5+2.3*(1-Math.exp(-2.6*f)),rrN=12+8*f+26*Math.pow(f,2.2);

  B.ti=(.4+.1*f)*(1-.3*c);B.k=(4+2*f)*(1-c)+1.1*c;
  const prev=B.vol;B.ph+=dt*B.rr/60;
  if(B.ph>=1){B.ph-=1;B.v0=B.vol;B.insp=true;B.ev.in=true;B.pef=B.pefNow;B.pefNow=0;}
  if(B.ph<B.ti){if(!B.insp){B.insp=true;B.ev.in=true;}B.vol=B.v0+B.vt*(1-Math.cos(Math.PI*B.ph/B.ti))/2;B.v1=B.vol;}
  else{if(B.insp){B.insp=false;B.ev.out=true;B.v1=B.vol;}B.vol=B.v1*Math.exp(-B.k*(B.ph-B.ti)/(1-B.ti));}
  B.flow=(B.vol-prev)/dt;if(-B.flow>B.pefNow)B.pefNow=-B.flow;

  B.hr=65+125*f+12*c;B.vo2=.3+3.65*f*(1-.15*c);

  const ins=B.insp?Math.sin(Math.PI*clamp(B.ph/B.ti,0,1)):0,ex=B.insp?0:Math.exp(-3*(B.ph-B.ti)/(1-B.ti));
  B.act.dia=B.insp?(.3+.7*f)*(.35+.65*ins):.04;B.act.ext=B.insp?(.12+.88*f)*(.3+.7*ins):0;
  const actEx=clamp((f-.35)/.65,0,1)+.75*c;B.act.int=B.insp?0:clamp(actEx,0,1)*(.3+.7*ex);B.act.abs=B.act.int;

}
// geluid van de adem: gedeeld door de niveaus
function breathSound(api,vol){const f=B.f;if(B.ev.in){const Ti=B.ti*60/B.rr;api.noise(Math.max(.2,Ti*.75),'bandpass',700+500*f,.8,vol*(.05+.12*f),Math.max(.08,Ti*.3),0,1300+500*f);}
  if(B.ev.out){const Te=(1-B.ti)*60/B.rr;api.noise(Math.max(.25,Te*(.45+.4*B.c)),'bandpass',520+300*f,.7,vol*(.045+.1*f),.06,0,260);}
  if(B.c>.25&&!B.insp){B._wz=(B._wz||0)+1;if(B._wz%5===0)api.tone(560+90*Math.sin(S.clock*7)+120*B.c,.16,.012+.03*B.c*vol,'triangle');}
  if(B.ev.attack)api.noise(.5,'highpass',2200,.6,.08,.01);
  if(SND_puff){SND_puff=false;api.noise(.45,'highpass',3500,.5,.22,.005,0,6000);api.noise(.3,'bandpass',1800,1,.08,.02);}}
/* ================= NIVEAU 0 · borstkas in het inspanningslab ================= */
K.base({parent:G0,floor:'lab',plaque:['PULMONES ET THORAX','ademhaling bij inspanning'],plaqueX:-1.2});
const SX=-3.6;
const _sd=V(0,0,0),_so=new THREE.Object3D();
function segM(a,b,w,d){_sd.subVectors(b,a);const L=_sd.length()||1e-5;_sd.divideScalar(L);_so.quaternion.setFromUnitVectors(AY,_sd);_so.position.copy(a);_so.scale.set(w,L,d===undefined?w:d);_so.updateMatrix();return _so.matrix;}
function bez(a,c,b,t,o){const u=1-t;return o.set(u*u*a.x+2*u*t*c.x+t*t*b.x,u*u*a.y+2*u*t*c.y+t*t*b.y,u*u*a.z+2*u*t*c.z+t*t*b.z);}
const BM=K.BONE(),CM=std(0xc9e2ea,{roughness:.3}),GHOST=glass(0xefe3c8,.22,{roughness:.5});
const st0=K.stand({parent:G0,x:SX,z:-.6,h:1.5});
// bekken als ondergrens van het model: heiligbeen, twee darmbeenschoepen, de bekkenring en de schaambeenderen
const pelM=std(0xeadcc0,{roughness:.55,side:THREE.DoubleSide});
{const sh=new THREE.Shape();sh.moveTo(-.38,0);sh.quadraticCurveTo(0,.06,.38,0);sh.quadraticCurveTo(.3,-.45,.1,-.86);sh.quadraticCurveTo(0,-.93,-.1,-.86);sh.quadraticCurveTo(-.3,-.45,-.38,0);
  const g=new THREE.ExtrudeGeometry(sh,{depth:.26,bevelEnabled:true,bevelThickness:.04,bevelSize:.04,bevelSegments:2,curveSegments:10});g.translate(0,0,-.13);
  const sac=mesh(g,BM,[SX,2.62,-1.02],[.42,0,0],0,G0);
  // sacrale foramina als donkere puntjes
  for(let i=0;i<4;i++)for(const s of [-1,1])mesh(new THREE.SphereGeometry(.035,8,6),std(0x6b5a48,{roughness:.8}),[SX+s*(.15-.02*i),2.5-.17*i,-.83+.075*i],0,[1,1,.4],G0);}
// darmbeenschoepen: een uitwaaierende schelp per kant, hoog achter en lager voor
[-1,1].forEach(s=>{const g=new THREE.LatheGeometry([[.5,2.05],[.6,2.2],[.82,2.45],[1.08,2.72],[1.26,2.94],[1.3,3.02]].map(p=>new THREE.Vector2(p[0],p[1])),12,s>0?.12*Math.PI:1.1*Math.PI,.78*Math.PI);
  const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);const fr=clamp(z/1.2,-1,1);// voorkant lager

   K.bar(1,Math.abs(fl)/5,fmt(Math.abs(fl))+' L/s '+(fl>=0?'in':'uit'),fl>=0?'ok':'ecc');K.bar(2,d,Math.round(d*100)+'%',d<.75?'bad':'ok',d<.75?'var(--bad)':'var(--ok)');K.bar(3,clamp(Math.log(res)/Math.log(20),0,1),'× '+fmt(res),res>3?'bad':'',res>3?'var(--bad)':'#e6d27a');
   const st=S.state;if(st===1)K.capSoft(K.stateText(),'Een kleine bronchus splitst in twee <b>bronchioli</b>. Kraakbeenplaten (blauw) houden de bronchus open. De bronchioli hebben geen kraakbeen meer, wel <b>gladde spier</b> (rood).',2.6);
   else if(st===2)K.capSoft(K.stateText(),'Bij inspanning stroomt er veel meer lucht door: in (blauw) en uit (oranje). De trilhaartjes vegen het slijm intussen naar de keel.',2.6);
   else K.capSoft(K.stateText(),phase3()===0?'Koude, droge lucht trekt diep de luchtwegen in. Het slijmvlies koelt af en droogt uit…':phase3()===1?'De gladde spier trekt samen en het slijmvlies zwelt op. De straal zakt hier tot ongeveer 60%: de weerstand wordt dan al ruim <b>zeven keer</b> zo groot (straal tot de vierde macht). Bij de halve straal is het zestien keer.':phase3()===2?'De pufferdeeltjes (lila) slaan neer op de wand. De gladde spier ontspant en de bronchioli gaan weer open.':caps3[3],2.6);},
  reset(){aerS.on=false;l1.c=-1;},onShow(){l1.c=-1;},hud:()=>K.bars(['Luchtstroom','Diameter','Weerstand']),ctl:ctlW,bind:bindW,

 {step(dt){breath(dt);updL2(dt);const sat=98-1.2*B.f-7*B.c;K.bar(1,B.vo2/4,fmt(B.vo2)+' L/min','ok');K.bar(2,l2ct/.8,fmt(l2ct,2)+' s',l2ct<.4?'ecc':'');K.bar(3,(sat-85)/15,Math.round(sat)+'%',sat<94?'bad':'ok',sat<94?'var(--bad)':'var(--ok)');
   const st=S.state;if(st===1)K.capSoft(K.stateText(),'Een longblaasje is een blaasje van 0,2 à 0,3 mm met een net van haarvaten. Het bloed komt <b>zuurstofarm</b> binnen (paars) en vertrekt <b>helderrood</b>.',2.6);
   else if(st===2)K.capSoft(K.stateText(),'Bij inspanning stroomt het bloed sneller: de contacttijd daalt van 0,75 naar ongeveer 0,3 s. Er gaan veel meer O₂-bolletjes (oranje) het bloed in en CO₂-bolletjes (blauw) naar buiten.',2.6);

   const st=S.state;if(st===1)K.capSoft(K.stateText(),'Zuurstof <b>diffundeert</b> van hoge naar lage druk: van de lucht (100 mmHg) naar het bloed (40 mmHg), door een wand van maar 0,5 µm. In de rode bloedcel bindt hemoglobine de O₂.',2.6);

   else K.capSoft(K.stateText(),phase3()===1?'Minder verse lucht: de PO₂ in het longblaasje daalt. Het drukverschil wordt kleiner, er bindt minder O₂ en de verzadiging zakt.':phase3()===0?'Hard werken in koude lucht. Kijk naar de PO₂ in het longblaasje…':caps3[phase3()],2.6);},

const ALVsp=ALV.map(A=>A.sp),ALVcap=ALV.map(A=>A.cap);
const POINTS=[
 {lv:0,name:'Luchtpijp',lat:'Trachea · cartilagines tracheales',at:()=>W.trach,view:[[-.6,8.9,7.2],[SX,7.5,-.4]],focus:()=>[trachea,TRR,treeM],pick:()=>[trachea,TRR],layer:'Longen',tabs:[
  `<p>De <b>luchtpijp</b> loopt van het strottenhoofd naar de borstkas en splitst zich daar in de linker- en rechterhoofdbronchus. Hoefijzervormige ringen van kraakbeen (blauw) houden hem open. Aan de achterkant zit geen kraakbeen maar gladde spier: daar ligt de slokdarm tegenaan.</p><p>De rechterhoofdbronchus loopt steiler naar beneden dan de linker. Een verslikt pinda komt daarom vaker rechts terecht.</p>`,
  `<p>Bij borstcrawl adem je in een paar tienden van een seconde in, door je mond. Dan moet er in korte tijd veel lucht door de luchtpijp. Een snorkel maakt die buis langer: je moet dieper ademen om evenveel verse lucht in je longen te krijgen.</p>`,
  `<p>De luchtpijp van een volwassene is ongeveer 10 à 12 cm lang en zo'n 2 cm breed, met 16 tot 20 kraakbeenringen.</p>`,
  `<p class="think">Waarom is het handig dat de luchtpijp stevige ringen heeft, maar aan de achterkant soepel is? Denk aan inademen én aan slikken.</p>`]},
 {lv:0,name:'Middenrif',lat:'Diaphragma · centrum tendineum',at:()=>W.dia,view:[[-1.5,6.3,9.8],[SX,4.6,0]],focus:()=>[diaM].concat(crura),layer:'Ademspieren',tabs:[
  `<p>Het <b>middenrif</b> is een koepel van spierweefsel met in het midden een peesplaat (wit). Het scheidt de borstholte van de buikholte. Trekt het samen, dan wordt de koepel platter en zakt hij. De borstkas wordt daardoor hoger en dus groter.</p><p>Een groter volume geeft een lagere druk in de longen (de wet van Boyle). De buitenlucht heeft dan een hogere druk en stroomt vanzelf naar binnen.</p>`,
  `<p>Zingen, blazen op een fluitje, een lange uitademing bij yoga: het middenrif regelt het ritme. Bij <b>buikademhaling</b> zie je de buik naar voren komen, omdat het zakkende middenrif de buikorganen opzij duwt. Kijk naar de buikwand van het model in stand 1.</p>`,
  `<p>In rust zakt het middenrif maar 1 à 2 cm en doet het zo'n driekwart van het inademingswerk. Bij een diepe teug kan het tot ongeveer 10 cm zakken.</p>`,
  `<p class="think">De hik is een plotselinge samentrekking van het middenrif terwijl de stembanden dichtklappen. Wat hoor en voel je daardoor precies?</p>`]},
 {lv:0,name:'Tussenribspieren',lat:'Mm. intercostales externi et interni',at:()=>W.ic,view:[[-11.2,7.4,9.2],[SX-.6,5.8,.3]],focus:()=>[IEXT,IINT,ribGrp],pick:()=>[IEXT,IINT],layer:'Ademspieren',tabs:[
  `<p>Tussen de ribben liggen twee lagen spieren. De <b>uitwendige</b> tussenribspieren lopen schuin naar voren en naar beneden, als handen in je broekzakken. Ze tillen de ribben op bij het inademen. De <b>inwendige</b> lopen haaks daarop en trekken de ribben omlaag bij krachtig uitademen.</p><p>De bovenste ribben bewegen als een <b>pompzwengel</b>: het borstbeen gaat naar voren en omhoog. De onderste bewegen als een <b>emmerhengsel</b>: de zijkant gaat naar buiten en omhoog. Vergelijk stand 1 en stand 2.</p>`,
  `<p>Na een sprint of een 400 meter zie je sporters met de handen op de knieën staan. Dan zetten ze de schoudergordel vast, zodat borst- en rugspieren ook kunnen helpen om de ribben op te tillen.</p>`,
  `<p>Een mens heeft twaalf paar ribben. De onderste twee hangen los aan de voorkant: de <b>zwevende ribben</b>.</p>`,
  `<p class="think">Leg je handen plat op je onderste ribben en adem diep in. Welke beweging voel je: de pompzwengel of het emmerhengsel?</p>`]},
 {lv:0,name:'Long- en borstvlies',lat:'Pleura visceralis et parietalis',at:()=>W.pleura,view:[[2.6,6.4,8.4],[SX+1.3,5.6,0]],focus:()=>LUNG.map(L=>L.pl).concat(LUNG.map(L=>L.m)),pick:()=>LUNG.map(L=>L.pl),layer:'Long- en borstvlies',tabs:[
  `<p>Elke long zit in een dubbel vlies, de <b>pleura</b>. Het binnenste blad, het <b>longvlies</b> (<i>pleura visceralis</i>), ligt op de long. Het buitenste blad, het <b>borstvlies</b> (<i>pleura parietalis</i>), bekleedt de binnenkant van de borstwand en het middenrif. Daartussen zit een dun laagje vocht. Daardoor kunnen de bladen langs elkaar glijden, maar ze laten elkaar niet los.</p><p>Zo volgt de long elke beweging van de borstkas. In de ruimte tussen de bladen is de druk iets lager dan de buitenlucht. Dat houdt de long uitgerekt.</p>`,
  `<p>Komt er lucht tussen de bladen, dan klapt de long (deels) in: een <b>klaplong</b>. Dat kan door een harde klap op de borst, maar soms ook spontaan, vooral bij lange, slanke jongens. Plotselinge pijn op de borst en benauwdheid in de les: stop de les voor die leerling en schakel volgens het protocol van de school hulp in.</p>`,
  `<p>Tussen de twee bladen zit per kant maar een paar milliliter vocht.</p>`,
  `<p class="think">Twee natte glasplaatjes kun je makkelijk langs elkaar schuiven, maar moeilijk uit elkaar trekken. Wat zegt dat over het borstvlies?</p>`]},
 {lv:0,name:'Hulpademhalingsspieren',lat:'M. sternocleidomastoideus · mm. scaleni',at:()=>W.acc,view:[[-.4,9.6,7.4],[SX,8.4,-.4]],focus:()=>SCM.concat(SCAL),layer:'Ademspieren',state:2,tabs:[
  `<p>De <b>scaleni</b> lopen van de halswervels naar de eerste twee ribben. De <b>sternocleidomastoideus</b> loopt van achter het oor naar het borstbeen en het sleutelbeen. Bij zware ademarbeid tillen ze de bovenste ribben en het borstbeen extra op. Zo wordt de borstkas bovenin groter.</p><p>In het model lichten ze op bij een hoog vermogen (stand 2, schuif naar rechts) en bij astma (stand 3).</p>`,
  `<p>Kijk naar een leerling aan het eind van de bleeptest: de schouders gaan op en neer en de halsspieren staan strak. Dat is een teken dat de ademhaling op haar maximum werkt.</p><p>Soms ademt een leerling snel en hoog in de borst zonder dat hij hard werkt, bijvoorbeeld door spanning voor een toets of wedstrijd: <b>hyperventilatie</b>. Hij blaast dan te veel CO₂ uit. Dat geeft tintelingen in de handen en rond de mond, duizeligheid en een benauwd gevoel, terwijl er genoeg zuurstof is. Laat de leerling rustig zitten en praat rustig mee. Twijfel je of het astma is of iets anders, volg dan het protocol van de school.</p>`,
  `<p>De scaleni doen al een beetje mee bij rustig ademen. De sternocleidomastoideus schakelt pas in als je hard moet ademen.</p>`,
  `<p class="think">Waarom is ademen met opgetrokken schouders op den duur vermoeiend, ook als je stilzit?</p>`]},
 {lv:0,name:'Buikspieren bij uitademen',lat:'M. transversus abdominis · mm. obliqui externus et internus abdominis · m. rectus abdominis',at:()=>W.abs,view:[[-.4,3.9,9.6],[SX,3.4,.8]],focus:()=>[RECT,TAB],layer:'Ademspieren',state:2,tabs:[
  `<p>In rust is uitademen <b>passief</b>: de longen veren terug als elastiek. Bij inspanning moet het sneller. Dan trekken de buikspieren samen. Ze duwen de buikorganen en het middenrif omhoog en trekken de onderste ribben omlaag. Dat is <b>actief uitademen</b>.</p><p>Vooral de dwarse buikspier (<i>transversus abdominis</i>) en de schuine buikspieren (<i>obliquus externus</i> en <i>internus</i>) doen dit werk. In het model zijn ze samen de doorzichtige buikwand. De rechte buikspier (<i>rectus abdominis</i>, met de peesopschriften van de 'six-pack') helpt minder mee. Bij matige inspanning lichten ze op tijdens elke uitademing.</p>`,
  `<p>Een <b>steek in de zij</b> komt veel voor bij lopen en zwemmen, vooral vlak na het eten. De oorzaak is niet helemaal bekend. Een veelgenoemde verklaring is irritatie van het buikvlies. Rustiger aan doen en diep uitademen helpt vaak; het gaat vanzelf over.</p>`,
  `<p>Bij een krachtige hoest of een harde schreeuw stijgt de druk in de buik in een fractie van een seconde. Dezelfde buikspieren zorgen ook voor stevigheid van de romp bij tillen.</p>`,
  `<p class="think">Waarom helpt het bij een zware squat om even je adem in te houden en de buik aan te spannen? En waarom moet je daar voorzichtig mee zijn?</p>`]},
 {lv:0,name:'Ademminuutvolume',lat:'Ventilatio · spirometrie en ademgasanalyse',at:()=>W.sport,view:[[8.6,3.4,6.0],[3.8,1.4,-1.4]],focus:()=>[F.root,ERG,CART0,HOSE],pick:()=>[F.root,ERG,CART0],layer:'Sporter',state:2,tabs:[
  `<p>Het <b>ademminuutvolume</b> (V̇E) is de hoeveelheid lucht die je per minuut in- en uitademt: ademfrequentie × teugvolume. In rust is dat ongeveer 12 × 0,5 = 6 liter per minuut. Bij zwaar werk kan het boven de 100 L/min komen. Schuif in stand 2 het vermogen omhoog en kijk naar het spirogram.</p><p>Eerst stijgt vooral het <b>teugvolume</b>. Boven ongeveer de helft van je vitale capaciteit gaat de <b>frequentie</b> verder omhoog. Het masker meet hoeveel O₂ je opneemt en hoeveel CO₂ je uitademt.</p>`,
  `<p>De <b>praattest</b>: kun je tijdens een duurloop nog in zinnen praten, dan zit je onder je <b>ventilatoire drempel</b>. Boven die drempel stijgt de ademhaling sterker dan het vermogen, omdat je extra CO₂ moet uitademen. Bruikbaar om leerlingen hun tempo te laten kiezen.</p>`,
  `<p>Getrainde duursporters halen ademminuutvolumes van 150 tot meer dan 200 liter per minuut. Dat is een badkuip lucht in minder dan een minuut.</p>`,
  `<p class="think">Zuurstof is zelden de beperkende factor voor gezonde longen bij inspanning. Waar ligt de grens dan wel? Kijk ook in <a href="hart.html">het hart</a>.</p>`]},
 {lv:1,name:'Bronchiën en bronchioli',lat:'Bronchi · bronchioli',at:()=>W.l1Cart,view:[[-2.2,2.8,9.4],[-2.2,.1,0]],focus:()=>[CP].concat(AW.map(a=>a.muc.m)),pick:()=>[CP,AW[0].muc.m],tabs:[
  `<p>De luchtwegen vertakken zich als een boom: van de luchtpijp via de <b>bronchiën</b> naar steeds kleinere <b>bronchioli</b>. Er zijn ongeveer 23 generaties van vertakkingen. Pas de laatste generaties hebben longblaasjes; daarvoor geleiden de buisjes alleen lucht.</p><p>In de bronchiën houden platen van <b>kraakbeen</b> (blauw) de buis open. De bronchioli hebben geen kraakbeen. Hun wijdte hangt af van de gladde spier en van de trek van het omliggende longweefsel.</p>`,
  `<p>De lucht in de geleidende luchtwegen doet niet mee aan de gaswisseling: dat is de <b>dode ruimte</b> van ongeveer 150 mL. Bij rustige, oppervlakkige ademhaling is dat een groot deel van elke teug. Dieper ademen is dus efficiënter dan sneller ademen.</p>`,
  `<p>Doordat de buisjes zich zo vaak splitsen, is de totale doorsnede diep in de long honderden keren groter dan die van de luchtpijp. Daar stroomt de lucht dus heel langzaam.</p>`,
  `<p class="think">Een leerling snorkelt met een extra lange snorkel. Waarom wordt ademen dan zwaarder, ook als hij precies even diep ademt?</p>`]},
 {lv:1,name:'Gladde spier van de luchtweg',lat:'Textus muscularis levis · bronchoconstrictio',at:()=>W.l1Musc,view:[[4.8,3.2,7.6],[3.1,1.3,0]],focus:()=>[SMI].concat(AW.map(a=>a.muc.m)),pick:()=>[SMI],layer:'Gladde spier',tabs:[
  `<p>Rond de bronchioli lopen spiraalbanden van <b>glad spierweefsel</b>. Je stuurt ze niet bewust aan. Trekken ze samen, dan wordt de buis nauwer: <b>bronchoconstrictie</b>. Bij astma reageren ze te sterk, bijvoorbeeld op koude en droge lucht, stof of pollen. Het slijmvlies zwelt dan ook op en er komt meer slijm.</p><p>De weerstand van een buis hangt af van de straal tot de <b>vierde macht</b>. Halveert de straal, dan wordt de weerstand 2⁴ = 16 keer zo groot. Zet stand 3 aan: de straal zakt tot ongeveer 60% en de balk Weerstand loopt op tot ongeveer × 7.</p>`,
  `<p>Bij <b>inspanningsastma</b> (inspanningsgebonden bronchoconstrictie) komen de klachten meestal na 5 à 8 minuten hard werken. Vaak zijn ze het ergst 5 à 10 minuten ná het stoppen, en binnen ongeveer een uur zijn ze weer weg (ATS, 2013). Je hoort een piepende, lange uitademing, of de leerling hoest en is benauwd. Een warming-up in korte blokjes kan de reactie verminderen. Volg voor de puffer altijd het astmaplan van de leerling en de ouders.</p>`,
  `<p>Volgens de richtlijn van de American Thoracic Society (2013) treedt inspanningsgebonden bronchoconstrictie op bij een groot deel van de mensen met astma, en ook bij ongeveer 5 à 20% van de mensen zonder astmadiagnose.</p>`,
  `<p class="think">Waarom geeft astma vooral problemen bij het <b>uitademen</b>? Denk aan wat het longweefsel bij inademen met de luchtwegen doet, en wat de druk in je borstkas met de luchtwegen doet als je krachtig uitademt.</p>`]},
 {lv:1,name:'Trilhaartjes en slijm',lat:'Epithelium respiratorium · cilia · mucus',at:()=>W.l1Cil,view:[[2.8,1.6,6.2],[2.6,-1.5,0]],focus:()=>[CII,MUI].concat(AW.map(a=>a.mu.m)),pick:()=>[CII,MUI],layer:'Slijm en trilhaar',tabs:[
  `<p>De binnenkant van de luchtwegen is bekleed met cellen met <b>trilhaartjes</b>. Daarop ligt een laagje <b>slijm</b> dat stof, roet en bacteriën vangt. De trilhaartjes slaan in een golf en schuiven het slijm omhoog naar de keel, waar je het doorslikt of ophoest: de <b>mucociliaire roltrap</b>.</p><p>Bij astma maakt het slijmvlies meer en taaier slijm. Dat maakt de luchtweg nog nauwer.</p>`,
  `<p>Je neus verwarmt en bevochtigt de lucht. Bij inspanning ga je door je mond ademen; dan komt koude, droge lucht dieper in de luchtwegen. Daarom geeft hardlopen in de winterkou vaker klachten. Een buff of sjaal voor de mond helpt sommige leerlingen.</p>`,
  `<p>Een trilhaartje slaat ongeveer 10 tot 20 keer per seconde. In de luchtpijp schuift het slijm zo een paar millimeter per minuut omhoog.</p>`,
  `<p class="think">Roken legt de trilhaartjes stil. Waarom hoesten rokers dan juist 's ochtends zoveel?</p>`]},
 {lv:2,name:'Longblaasjes',lat:'Alveoli pulmonis · sacculus alveolaris',at:()=>W.l2Alv,view:[[front.c.x+3.6,front.c.y+3.2,front.c.z+9.5],[front.c.x*.6,front.c.y*.6,front.c.z*.5]],focus:()=>ALVsp.concat([duct]),pick:()=>ALVsp,layer:'Longblaasjes',tabs:[
  `<p>Aan het einde van de kleinste luchtwegen zitten trossen <b>longblaasjes</b> (alveoli), elk zo'n 0,2 à 0,3 mm groot. Hier vindt de gaswisseling plaats. De wand is extreem dun, zodat zuurstof en koolzuurgas er makkelijk doorheen gaan.</p><p>In de wand zitten <b>elastische vezels</b> (geel). Die rekken uit bij inademen en veren terug bij uitademen. Een vettig laagje, <b>surfactant</b>, voorkomt dat de blaasjes dichtklappen. Een <b>longmacrofaag</b> (afweercel, beige) kruipt over de wand en ruimt ingeademde deeltjes op.</p>`,
  `<p>Bij inspanning pompt het hart veel meer bloed door de longen. Dan gaan haarvaten open die in rust weinig bloed krijgen, vooral bovenin de long. Zo doen meer longblaasjes volop mee en wordt het oppervlak voor gaswisseling groter. Daardoor kun je bij een duurloop vele malen meer zuurstof opnemen dan in rust.</p>`,
  `<p>Een volwassene heeft zo'n 300 tot 500 miljoen longblaasjes (Ochs e.a., 2004: gemiddeld 480 miljoen). Samen hebben ze een oppervlak van ongeveer 70 tot 100 m²: zo groot als een badmintonveld (13,40 × 6,10 m).</p>`,
  `<p class="think">Waarom is een groot oppervlak zo belangrijk voor de gaswisseling? En hoe past een badmintonveld in je borstkas?</p>`]},
 {lv:2,name:'Haarvaten van de long',lat:'Capillaria pulmonalia · circulatio pulmonalis',at:()=>W.l2Cap,view:[[CAP1.A.c.x+2.6,CAP1.A.c.y+1.2,CAP1.A.c.z+7.6],[CAP1.A.c.x*.8,CAP1.A.c.y*.8,CAP1.A.c.z*.8]],focus:()=>ALVcap.concat([RBC2,artCv,venCv]),pick:()=>ALVcap,layer:'Haarvaten',tabs:[
  `<p>Om elk longblaasje ligt een dicht net van <b>haarvaten</b>. Het bloed komt uit de rechterkamer van het hart via de longslagader. Het is zuurstofarm (paars in het model). In het haarvat neemt het zuurstof op en geeft het koolzuurgas af. Via de longaders gaat het helderrood terug naar de linkerharthelft: de <b>kleine bloedsomloop</b>.</p><p>Rode bloedcellen schuiven één voor één door de haarvaten, zo nauw zijn die.</p>`,
  `<p>In rust is een rode bloedcel ongeveer 0,75 seconde in contact met het longblaasje. Bij zware inspanning daalt dat tot zo'n 0,3 seconde. Omdat het bloed al na ongeveer 0,25 seconde verzadigd is, gaat dat bij gezonde longen goed. Zie ook <a href="hart.html">het hart</a>, dat dit bloed rondpompt.</p>`,
  `<p>Bij inspanning gaat het hele hartminuutvolume door de longen: tot 20 à 30 liter bloed per minuut bij getrainde sporters.</p>`,
  `<p class="think">De longslagader vervoert zuurstofarm bloed en de longader zuurstofrijk bloed. Waarom heten ze dan toch slagader en ader?</p>`]},
 {lv:3,name:'Bloed-luchtbarrière',lat:'Membrana alveolocapillaris',at:()=>W.l3Mem,view:[[-2.2,1.7,7.4],[-1.8,.25,0]],focus:()=>L3S.concat([O3,C3c,C3o]),pick:()=>L3S,tabs:[
  `<p>Tussen de lucht en het bloed liggen drie dunne lagen: een platte cel van het longblaasje (<b>type I-cel</b>), een gedeelde basaalmembraan en de wandcel van het haarvat (<b>endotheel</b>). Samen zijn ze maar zo'n 0,5 µm dik. Bovenop ligt surfactant (geel), gemaakt door de <b>type II-cellen</b>.</p><p>Gassen gaan hier door <b>diffusie</b>: van hoge naar lage partiële druk. Hoe groter het drukverschil en het oppervlak, en hoe dunner de wand, hoe sneller het gaat (de wet van Fick).</p>`,
  `<p>Op grote hoogte is de luchtdruk lager. Dan is ook de PO₂ in het longblaasje lager, het drukverschil kleiner en de opname trager. Daarom presteer je op een berg slechter op een duurloop, en daarom trainen sommige sporters op hoogte.</p>`,
  `<p>In het longblaasje is de PO₂ ongeveer 100 mmHg (13,3 kPa), in het zuurstofarme bloed ongeveer 40 mmHg (5,3 kPa). Voor CO₂ is het verschil klein (46 tegen 40 mmHg), maar CO₂ gaat ongeveer twintig keer zo makkelijk door de wand.</p>`,
  `<p class="think">Bij longoedeem zit er vocht tussen de lagen. Welke factor uit de wet van Fick verandert daardoor, en wat merk je ervan bij inspanning?</p>`]},
 {lv:3,name:'Rode bloedcel en hemoglobine',lat:'Erythrocytus · haemoglobinum',at:()=>Math.abs(R3.x)>8?null:W.l3Rbc,view:[[.4,-.9,9.5],[0,-2.4,0]],focus:()=>[rbcShell,GLO,HEMI,O3],pick:()=>[rbcShell,GLO],layer:'Hemoglobine',tabs:[
  `<p>Een rode bloedcel is een dubbel hol schijfje vol <b>hemoglobine</b>. Elk hemoglobinemolecuul heeft vier eiwitketens met elk een <b>hemgroep</b> met ijzer, waar één O₂ aan bindt. Donkerpaars is zonder zuurstof, helderrood is met zuurstof.</p><p>Elke binding maakt de volgende makkelijker. Daardoor is de verzadigingscurve S-vormig: in de long laadt hemoglobine snel vol, in de werkende spier laat het de zuurstof makkelijk los.</p>`,
  `<p>Bloed dat uit een hard werkende spier terugkomt, is veel zuurstofarmer dan in rust. In stand 2 komt de rode bloedcel daarom veel 'leger' binnen en laadt hij meer zuurstof op. Warmte en verzuring in de spier helpen hemoglobine de zuurstof los te laten (het Bohr-effect). Zie ook <a href="spier.html">de spier</a>, die de zuurstof gebruikt om ATP te maken.</p>`,
  `<p>Eén rode bloedcel bevat ongeveer 270 miljoen hemoglobinemoleculen. Eén liter bloed vervoert zo ongeveer 200 mL zuurstof; zonder hemoglobine zou dat maar 3 mL zijn.</p>`,
  `<p class="think">Bij hoogtetraining maakt het lichaam meer rode bloedcellen aan. Waarom helpt dat bij een duurprestatie, en waarom is meer niet altijd beter?</p>`]},
];
