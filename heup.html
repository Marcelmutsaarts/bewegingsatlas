const CUPN=[];

[-1,1].forEach(s=>{

const sG=new THREE.ExtrudeGeometry(sS,{depth:.55,bevelEnabled:true,bevelThickness:.12,bevelSize:.1,bevelSegments:2,curveSegments:10});sG.translate(0,0,-.3);

[[-.3,-7.22,-.12],[-.92,-7.22,-.12]].forEach(p=>mesh(new THREE.SphereGeometry(.42,18,14),BM,p,0,[1,1.05,1.35],FB));

/* ---------- spieren en banden als vezelbundels (instancing) ---------- */

const _I=V(0,0,0),_C=V(0,0,0),_Vw=V(0,0,0),_m=V(0,0,0);

  {const nv=N*(KS+1),pos=new Float32Array(nv*3),col=new Float32Array(nv*3),idx=[];

    const sh=new THREE.Mesh(g,sm);sh.frustumCulled=false;sh.castShadow=!isLig;sh.receiveShadow=true;PG.add(sh);M.sheath=sh;M.smat=sm;M.shPos=pos;m.userData.sheath=sh;}
  (isLig?LIGS:MUS).push(M);MK[o.k]=M;return M;}

  W.l2arc=V(ARCS[22].x0+.55,ymap(YS-.08,c),ARCS[22].z);W.l2cell=V(CEL[CEL.length-30].x,ymap(CEL[CEL.length-30].y,c),CEL[CEL.length-30].z);const A9=AGG[9];W.l2pg=V(A9.x,ymap(A9.y,c),A9.z);
  W.l2wat=V(1.2,ys+.15,1.2);W.l2tide=V(-3.6,YT,ZB);W.l2bone=V(-3.2,YT-.8,ZB);W.l2surf=V(-3.4,ys-.15,ZB);W.l2mid=V(-3.4,ymap(YT+HC*.62,c),ZB);W.l2deep=V(-3.4,ymap(YT+HC*.2,c),ZB);W.l2fis=V(FISX[1],ys-.3,1.6);W.l2opp=V(-2.6,ys+.42,ZB);}
const H2={
  hud(){return K.bars(S.state===3?['Proteoglycanen','Water draagt','Oppervlak']:['Druk','Dikte','Water in matrix']);},
  ctl(){return S.state===2?`<label>Tempo</label><input type="range" id="kT" min=".25" max="1.5" step=".05" value="${W2.tempo}" aria-label="Tempo">`:'';},
  bind(){const t=K.$('#kT');if(t)t.addEventListener('input',e=>{W2.tempo=+e.target.value;});},
  grades:true,
  reset(n){W2.flashT=-1;W2.fis=0;W2.pg=1;W2.fib=0;W2.clus=0;W2.carry=90;if(n!==2){W2.c=0;}},
  step(dt){const st=S.state,g=S.grade;let c=0;
    if(st===2){W2.ph=(W2.ph+dt*W2.tempo/1.8)%1;c=Math.pow(Math.max(0,Math.sin(TAU*W2.ph)),1.3);}
    else if(st===3){const t=S.stT;W2.ph=(W2.ph+dt/1.25)%1;c=1.25*Math.pow(Math.max(0,Math.sin(TAU*W2.ph)),1.2);W2.fis=smooth((t-1.4)/2.6);
      if(!S.tearFired&&t>1.7&&c>.9){S.tearFired=true;W2.flashT=t;K.flash({big:false,shake:.15});}
      W2.pg=1-[0,.25,.5,.75][g]*smooth((t-1)/4);W2.fib=[0,.35,.6,.9][g]*W2.fis;W2.clus=smooth((t-3)/2)*(g>=2?1:.45);}
    W2.c=c;if(dt>0)W2.cw+=(c-W2.cw)*clamp(dt/.45,0,1);if(st===1)W2.cw=lerp(W2.cw,0,clamp(dt*3,0,1));
    upd2();const ys=ymap(YS,W2.cw),th=(ys-YT)/HC;
    if(st===3){K.bar(1,W2.pg,Math.round(W2.pg*100)+'% over',W2.pg<.6?'bad':W2.pg<.85?'ecc':'ok');K.bar(2,W2.carry/100,Math.round(W2.carry)+'% van de klap',W2.carry<65?'bad':W2.carry<82?'ecc':'ok',W2.carry<65?'var(--bad)':'#6fc6ff');
      K.bar(3,W2.fis*(g/3),W2.fis<.2?'glad':['','gerafeld (fibrillatie)','diepe fissuren','tot op het bot'][g],W2.fis<.2?'ok':g>1?'bad':'ecc');
      K.capSoft(K.stateText(),W2.fis<.15?'Te zwaar, te vaak en te weinig herstel: de matrix wordt telkens hard ingedrukt…':['','<b>Graad 1</b>: het oppervlak rafelt (fibrillatie). De bovenste collageenvezels breken.','<b>Graad 2</b>: diepe fissuren. De cellen vormen groepjes (clusters) en er gaan proteoglycanen verloren. Bij belasting stroomt het water nu sneller weg, dus collageen en cellen vangen meer van de klap op.','<b>Graad 3</b>: de scheuren lopen tot op het bot. Kraakbeen groeit nauwelijks terug: er lopen geen bloedvaten in.'][g],2);}
    else{K.bar(1,W2.c*9/11,nl(W2.c*9)+' MPa',W2.c>.7?'ecc':'');K.bar(2,th,Math.round(th*100)+'% van rust','',th<.9?'#e6b65e':'');K.bar(3,(W2.water-60)/20,nl(W2.water,0)+'%','','#6fc6ff');
      if(st===1)K.capSet(K.stateText(),'Twee millimeter kraakbeen. <b>Collageen</b> (crème) vormt bogen, de arcades. Daartussen zitten <b>kraakbeencellen</b> (roze) en <b>proteoglycanen</b> (paars) die water vasthouden (blauw). Er lopen geen bloedvaten of zenuwen in.');
      else K.capSoft(K.stateText(),W2.c>W2.cw+.05||W2.c>.6?'Belasting: de matrix wordt ingedrukt en het water stroomt <b>langzaam</b> weg naar de synovia. Het water draagt de eerste klap.':'Ontlasting: de proteoglycanen trekken het water terug, als een spons. Zo krijgen de cellen ook voeding uit de synovia.',.8);}},
  sound(api){const c=W2.c,p=W2.prevC;W2.prevC=c;if(p<.3&&c>=.3)api.noise(.4,'lowpass',420,1,.07,.12);if(p>.4&&c<=.4)api.noise(.5,'bandpass',900,2,.03,.2);}
};

let showRunner=true;
const POINTS=[
 {lv:0,name:'Bekken',lat:'Os coxae (os ilium, os ischii, os pubis) · os sacrum · symphysis pubica',at:()=>W.pelvis,view:[[3.15,11,12.6],[-3.2,7,-1.2]],focus:()=>[BONES,FB],pick:()=>[BONES],tabs:[
  `<p>Het bekken is een ring van botten. Links en rechts ligt een <b>heupbeen</b> (os coxae), achter zit het <b>heiligbeen</b> (os sacrum). Voor zijn de schaambeenderen met kraakbeen verbonden: de <b>symphysis pubica</b>.</p><p>Elk heupbeen is gegroeid uit drie botten: het <b>darmbeen</b> (de vleugel), het <b>zitbeen</b> (onder en achter) en het <b>schaambeen</b> (voor). Ze komen samen in de heupkom en groeien rond je 15e tot 17e jaar aan elkaar vast.</p>`,
  `<p>Het bekken is het knooppunt tussen romp en benen. Bij elke afzet gaat de kracht via het bekken naar de romp. Een stabiele romp en een stabiel bekken zorgen dat die kracht niet ‘weglekt’. Daarom zie je oefeningen voor romp en bilspieren vaak terug in de training van sprinters.</p>`,
  `<p>Het bekken van mannen en vrouwen verschilt. De schaamboog (angulus subpubicus) is bij vrouwen ongeveer 80–90°, bij mannen ongeveer 50–60°. Het vrouwelijke bekken is breder en ondieper, wat ruimte geeft bij een bevalling.</p>`,
  `<p class="think">Het heiligbeen zit met twee gewrichten aan de heupbeenderen vast die bijna niet bewegen: de SI-gewrichten. Waarom is de bekkenring zo stevig? Wat doen de sterke banden aan de achterkant?</p>`]},
 {lv:0,name:'Kapselbanden',lat:'Lig. iliofemorale (Y-band) · lig. pubofemorale · lig. ischiofemorale',layer:'Banden',at:()=>W.ylig,view:[[-7.6,7,7],[-4.5,6.3,-.7]],state:2,focus:()=>[...LIGO(),FB],pick:()=>LIGO(),tabs:[
  `<p>Om het gewricht zit een stevig kapsel met drie banden die als een spiraal van bekken naar dijbeen lopen. De sterkste is de <b>Y-band</b> (lig. iliofemorale) aan de voorkant: een omgekeerde Y van de spina iliaca anterior inferior naar de linea intertrochanterica.</p><p>Kijk in stand 2: de banden kleuren wit als de heup <b>strekt</b>. Ze draaien zich dan strak om de hals en trekken de kop in de kom.</p>`,
  `<p>Daardoor kun je rechtop staan zonder veel spierkracht: je ‘hangt’ in je Y-banden. Bij de afzet in de sprint, met ongeveer 15° strekking, staan ze strak. Verder strekken lukt alleen door het bekken te kantelen, met een holle rug.</p>`,
  `<p>De Y-band wordt vaak de sterkste band van het lichaam genoemd. Op zijn dikste punt is hij ongeveer een centimeter dik.</p>`,
  `<p class="think">Met gebogen knie kun je je heup zo’n 120° buigen, maar strekken lukt hooguit ongeveer 15°. Leg uit wat de banden daarmee te maken hebben.</p>`]},
 {lv:0,name:'Grote bilspier',lat:'M. gluteus maximus',layer:'Spieren',at:()=>W.gmax,view:[[-10.2,8.1,-10.2],[-4.2,6,-2.4]],state:2,focus:()=>MUSO('gmax'),tabs:[
  `<p>De grote bilspier is de grootste spier van het lichaam. Hij ontspringt aan de achterkant van het darmbeen, het heiligbeen en het stuitje, en hecht aan op het dijbeen en de tractus iliotibialis.</p><p>Hij <b>strekt</b> de heup en draait het been naar buiten. In stand 2 remt hij eerst de zwaai af (<b>excentrisch</b>). Van de late zwaaifase tot halverwege de steunfase strekt hij de heup (<b>concentrisch</b>).</p>`,
  `<p>‘Duw de grond weg’: bij de sprintstart en de versnelling levert de grote bilspier een groot deel van de afzetkracht. Oefeningen voor de les: hip thrust, step-up, sprinten tegen een helling en skippings met een actieve voetplaatsing.</p>`,
  `<p>Bij rustig wandelen doet de grote bilspier weinig, bij sprinten en springen werkt hij veel harder. Meetprothesen in de heup tonen bij joggen al ongeveer 5 keer het lichaamsgewicht op de heupkop (Bergmann e.a., 1993). Bij sprinten is het waarschijnlijk meer.</p>`,
  `<p class="think">Waarom werkt de grote bilspier harder als je tegen een helling op sprint dan op een vlakke baan?</p>`]},
 {lv:0,name:'Middelste en kleine bilspier',lat:'M. gluteus medius · m. gluteus minimus',layer:'Spieren',at:()=>W.gmed,view:[[-12.5,8.2,3.5],[-4.8,7.2,-1.3]],state:1,focus:()=>MUSO('gmed'),tabs:[
  `<p>De middelste bilspier ligt als een waaier op de buitenkant van de darmbeenvleugel en hecht aan op de grote rolheuvel (trochanter major). De kleine bilspier ligt eronder. Samen <b>abduceren</b> ze de heup: het been zijwaarts heffen.</p><p>Hun belangrijkste taak is stabiliseren. Op één been houden ze het bekken horizontaal. Ze werken dan <b>isometrisch</b>. Probeer <b>Op één been</b> in stand 1.</p>`,
  `<p>In de steunfase van de sprint draagt één been het hele lichaam. Schiet de middelste bilspier tekort, dan zakt het bekken aan de kant van het zwaaibeen (stand 3). Oefeningen: zijwaartse plank, lopen met een miniband en een squat op één been met het bekken horizontaal. Zie ook <a href="evenwicht.html">Evenwicht</a>.</p>`,
  `<p>Op één been heeft het lichaamsgewicht een arm van ongeveer 10 cm tot de heup, en de middelste bilspier maar ongeveer 5 cm. De spier levert dus zo’n twee keer het lichaamsgewicht, en de heupkop draagt bijna drie keer het lichaamsgewicht. Dit model is van Pauwels (1935).</p>`,
  `<p class="think">Iemand met pijn in de rechterheup loopt met een wandelstok. In welke hand hoort de stok, en waarom ontlast dat de heup?</p>`]},
 {lv:0,name:'Heupbuiger',lat:'M. iliopsoas (m. iliacus · m. psoas major)',layer:'Spieren',at:()=>W.ilio,view:[[-2.7,8.1,10.5],[-4,6.7,-.5]],state:2,focus:()=>MUSO('ilio'),tabs:[
  `<p>De iliopsoas heeft twee delen. De <b>m. psoas major</b> ontspringt aan de lendenwervels, de <b>m. iliacus</b> aan de binnenkant van de darmbeenvleugel. Samen lopen ze voor de heup langs naar de kleine rolheuvel (trochanter minor).</p><p>Het is de sterkste <b>heupbuiger</b>. In stand 2 trekt hij het been na de afzet naar voren (concentrisch). Vlak daarvoor remt hij de strekking af (excentrisch).</p>`,
  `<p>Een snelle zwaai en een hoge knie maken een sprinter snel. Loopscholing traint dit: knieheffen, skippings en A-skips. Bij een uitvalspas wordt de iliopsoas van het achterste been ver gerekt.</p>`,
  `<p>De psoas hecht aan de lendenwervels. Een stijve, korte heupbuiger trekt de onderrug naar voren, in een holle rug. Zie ook <a href="wervel.html">de wervelkolom</a>.</p>`,
  `<p class="think">Waarom kan een te korte heupbuiger je pas bij het sprinten korter maken?</p>`]},
 {lv:0,name:'Adductoren',lat:'M. adductor longus · m. adductor magnus',layer:'Spieren',at:()=>W.add,view:[[3.2,5,9.8],[-3.9,5.2,-.9]],state:2,focus:()=>MUSO('add'),tabs:[
  `<p>De adductoren lopen van het schaambeen en het zitbeen naar de achterkant van het dijbeen (linea aspera). Ze trekken het been naar het midden: <b>adductie</b>.</p><p>Bij de sprint werken ze vooral bij de wissel van steun naar zwaai en terug. Ze helpen de heup te buigen als hij gestrekt is, en te strekken als hij gebogen is.</p>`,
  `<p>Een <b>liesblessure</b> is vaak een verrekking van de adductor longus, vlak bij het schaambeen. Die komt veel voor bij voetbal, hockey en schaatsen: snelle richtingsveranderingen en harde trappen.</p>`,
  `<p>Bij Noorse voetballers gaf een programma met de Copenhagen-adductoroefening ongeveer 40% minder lies- en adductorklachten (Harøy e.a., 2019).</p>`,
  `<p class="think">Waarom raakt juist de adductor longus geblesseerd bij een sliding of een harde wreeftrap?</p>`]},
 {lv:0,name:'Rechte dijbeenspier en spina',lat:'M. rectus femoris · spina iliaca anterior inferior',layer:'Spieren',at:()=>W.rect,view:[[-7,5.7,10.8],[-4.6,4.8,-.6]],state:2,focus:()=>MUSO('rect'),tabs:[
  `<p>De rechte dijbeenspier is het enige deel van de quadriceps dat over twee gewrichten loopt. Hij ontspringt aan de <b>spina iliaca anterior inferior</b> (SIAI), vlak boven de kom, en loopt via de knieschijf naar het scheenbeen.</p><p>Hij <b>buigt de heup</b> en <b>strekt de knie</b>. In de sprint werkt hij vooral in de vroege zwaaifase.</p>`,
  `<p>Bij een harde trap of een sprintstart kan de rectus femoris bij jeugdsporters de SIAI lostrekken (avulsie). De groeikern (apofyse) is dan nog zwakker dan de pees. Bij volwassenen scheurt eerder de spier zelf.</p>`,
  `<p>Avulsies van het bekken komen vooral voor tussen ongeveer 14 en 17 jaar, vaker bij jongens. De zitbeenknobbel (hamstrings) is de meest voorkomende plek, daarna de SIAI (rechte dijbeenspier) en de spina iliaca anterior superior (SIAS, kleermakersspier) (Rossi en Dragoni, 2001).</p>`,
  `<p class="think">Waarom is een maximale sprintstart riskanter voor een 15-jarige dan voor een 25-jarige?</p>`]},
 {lv:0,name:'Zitbeenknobbel en hamstrings',lat:'Tuber ischiadicum · m. biceps femoris (caput longum), m. semitendinosus, m. semimembranosus',layer:'Spieren',at:()=>W.it,view:[[-1.4,5.5,-10.5],[-4.1,5.4,-1.9]],state:2,focus:()=>[...MUSO('ham'),BONES],pick:()=>MUSO('ham'),tabs:[
  `<p>De <b>zitbeenknobbel</b> is het bot waar je op zit. Hier ontspringen de hamstrings: de lange kop van de biceps femoris, de semitendinosus en de semimembranosus.</p><p>Omdat ze aan het bekken beginnen en onder de knie aanhechten, <b>strekken</b> ze de heup én <b>buigen</b> ze de knie.</p>`,
  `<p>Het is dezelfde sprinter als in <a href="spier.html#1">de spier</a>. Daar zie je hoe een hamstring in de late zwaaifase scheurt. Een bekken dat ver naar voren kantelt, rekt de hamstrings extra op.</p>`,
  `<p>Bij sprinters zit een verrekking meestal in de lange kop van de biceps femoris, bij de bovenste spier-peesovergang (Askling e.a., 2007). Een volledige afscheuring van de pees van de zitbeenknobbel is zeldzaam.</p>`,
  `<p class="think">Waarom rekt een voorwaartse buiging met gestrekte knieën de hamstrings zo sterk? Kijk naar de plek van de zitbeenknobbel.</p>`]},
 {lv:1,name:'Heupkop en dijbeenhals',lat:'Caput et collum femoris · substantia spongiosa (trabeculae)',at:()=>W.l1head,view:[[-1.6,.2,8.6],[-1.1,-.9,0]],focus:()=>[L1F],tabs:[
  `<p>De heupkop is ongeveer twee derde van een bol, bedekt met kraakbeen (blauw). De <b>dijbeenhals</b> staat in een hoek van ongeveer 125° op de schacht. Zo zit het been verder van het bekken af, en hebben de bilspieren een langere hefboom.</p><p>Binnenin liggen <b>botbalkjes</b> (trabekels) langs de krachtlijnen: een drukbundel (oranje) van het dak van de kop naar de binnenkant van de schacht, en een trekbundel (blauw) in een boog. In stand 2 lichten ze op.</p>`,
  `<p>Bot past zich aan de belasting aan (de wet van Wolff). Springen en sprinten maken het bot in de hals dichter, vooral in de groeiperiode. Bij oudere mensen breekt juist de dijbeenhals bij een val.</p>`,
  `<p>Bij een pasgeborene is de hoek tussen hals en schacht ongeveer 150°. Bij een volwassene is dat ongeveer 125°, doordat de belasting de hals tijdens het opgroeien vormt.</p>`,
  `<p class="think">Waarom is een schuine hals handiger voor lopen en sprinten dan een kop die recht op de schacht zit?</p>`]},
 {lv:1,name:'Heupkom en labrum',lat:'Acetabulum · facies lunata · labrum acetabuli',at:()=>W.l1lab,view:[[-2.4,2.6,7.6],[-1.0,1.2,0]],focus:()=>[pSlab,pCut,LABG,...CA],pick:()=>[LAB,pSlab,pCut],tabs:[
  `<p>De <b>heupkom</b> is diep: hij omvat ongeveer de helft van de kop. Alleen de hoefijzervormige rand is met kraakbeen bekleed (facies lunata). In de bodem ligt een vetkussen (geel).</p><p>Het <b>labrum</b> is een ring van vezelkraakbeen op de rand. Het maakt de kom dieper en sluit hem af als een rubber ring. Zo blijft er een dun laagje synovia onder druk en zuigt de kop zich als het ware vast.</p>`,
  `<p>Stabiliteit door vorm: een heup schiet veel minder snel uit de kom dan een schouder. Een heupluxatie gebeurt vooral bij grote krachten, zoals een verkeersongeval of een val bij het skiën. Vergelijk met <a href="schouder.html">de schouder</a>.</p>`,
  `<p>Bij een <b>cam-vorm</b> zit er een bult op de overgang van kop naar hals. Bij diep buigen met binnendraaien, zoals bij een diepe squat, een sliding of in de schaatshouding, kan die het labrum klemmen (stand 3). Een cam-vorm komt vaker voor bij sporters die als tiener veel en zwaar trainden, zoals voetballers.</p>`,
  `<p class="think">Een kogelgewricht is meestal beweeglijk maar instabiel. Leg uit hoe de heup toch allebei voor elkaar krijgt.</p>`]},
 {lv:1,name:'Kopband en synovia',lat:'Lig. capitis femoris · synovia',at:()=>W.l1lig,view:[[3.6,-.4,7.6],[1.1,-.6,0]],state:2,focus:()=>[LIGT,LIGA,pulv,SYN,SP],pick:()=>[LIGT,pulv],tabs:[
  `<p>De <b>kopband</b> (lig. capitis femoris) loopt van een putje in de kop (fovea) naar de bodem van de kom. Hij draagt weinig bij aan de stevigheid, maar er loopt een klein bloedvat in naar de kop (rood).</p><p>De <b>synovia</b> (blauw) is gewrichtsvloeistof. Ze smeert de kraakbeenlagen en voedt het kraakbeen. In stand 2 zie je haar bij elke landing wegstromen en terugkomen.</p>`,
  `<p>Een warming-up maakt het gewricht warmer en de synovia minder stroperig. Door afwisselend te belasten en te ontlasten stroomt er vocht met voeding door het kraakbeen. Bewegen is voor een gewricht dus smeren én voeden.</p>`,
  `<p>Kraakbeen met synovia glijdt soepeler dan ijs op ijs. De wrijvingscoëfficiënt is ongeveer 0,01 of lager.</p>`,
  `<p class="think">Kraakbeen heeft beweging nodig om voeding te krijgen. Wat betekent dat voor een gewricht dat weken in het gips zit?</p>`]},
 {lv:2,name:'Collageenarcades',lat:'Fibrae collagenosae (typus II) · arcaden van Benninghoff',at:()=>W.l2arc,view:[[4.2,3.6,9.6],[0,.8,0]],state:2,focus:()=>[ARC],tabs:[
  `<p>Collageen type II vormt het skelet van het kraakbeen. De vezels zijn verankerd in de verkalkte laag, lopen in de <b>diepe zone</b> recht omhoog, buigen om in de <b>middenzone</b> en liggen plat in de <b>oppervlaktezone</b>. Samen vormen ze bogen: de arcaden van Benninghoff.</p><p>Bij compressie (stand 2) buigen de bogen door en spannen de platte vezels aan het oppervlak, zoals het vel van een trommel.</p>`,
  `<p>Wisselend belasten en ontlasten, zoals bij hardlopen, is goed voor kraakbeen. Heel zwaar belasten zonder herstel is slecht, en helemaal niet bewegen ook.</p>`,
  `<p>De blauwe lijn is de <b>tidemark</b>, de grens tussen gewoon en verkalkt kraakbeen. Daaronder ligt het bot. Het kraakbeen van de heup is maar 1 tot 3 millimeter dik.</p>`,
  `<p class="think">Waarom liggen de vezels aan het oppervlak plat en diep in het kraakbeen rechtop? Denk aan de krachten op elke laag.</p>`]},
 {lv:2,name:'Kraakbeencellen',lat:'Chondrocyti',at:()=>W.l2cell,view:[[5,1,9.8],[0,-.7,0]],focus:()=>[CELL,NUC,LAC],tabs:[
  `<p><b>Kraakbeencellen</b> (chondrocyten, roze met een paarse kern) maken de matrix: collageen en proteoglycanen. Ze zijn plat aan het oppervlak, rond in het midden en liggen in kolommetjes in de diepe zone.</p><p>De cellen vormen maar een paar procent van het volume. De rest is matrix, en die bestaat voor 70 tot 80% uit water.</p>`,
  `<p>Kraakbeen heeft geen bloedvaten. De cellen krijgen voeding uit de synovia, doordat water bij elke belasting in en uit stroomt. Daarom hebben gewrichten beweging nodig.</p>`,
  `<p>Bij overbelasting (stand 3) vormen de cellen groepjes (<b>clusters</b>) en proberen ze de schade te herstellen. Echt nieuw hyalien kraakbeen maken ze bij een volwassene nauwelijks.</p>`,
  `<p class="think">Waarom herstelt een beschadiging van kraakbeen zo veel slechter dan een spierscheur of een botbreuk?</p>`]},
 {lv:2,name:'Proteoglycanen en water',lat:'Proteoglycana (aggrecan) · aqua',at:()=>W.l2pg,view:[[3.6,2.2,8.8],[0,.4,0]],state:2,focus:()=>[PGI,WAT],tabs:[
