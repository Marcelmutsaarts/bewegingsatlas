<script>
const NARROW=innerWidth<700;
// camerastanden van niveau 0: het overzicht en stand 3 (de landing bij de enkel)
const VIEW0=NARROW?[[.4,6.2,12.5],[-2.4,4.4,.2]]:[[5.4,6.3,18.6],[-1.3,4.55,.6]];
const V3=NARROW?[[4.6,2.8,8.0],[2.0,.15,.7]]:[[6.8,3.5,11.6],[1.8,1.3,.5]];
const VIEW1=NARROW?[[5.8,10.5,12.5],[1.6,-.2,0]]:[[7.2,8.6,9.6],[1.6,-.2,0]];
const V13=NARROW?[[12.6,5.6,-3.8],[5.0,-1.4,.4]]:[[12.4,4.6,-3.4],[5.3,-.75,.45]];
Atlas3D({
 id:'zenuw',halte:1,name:'Zenuwstelsel',docTitle:'Zenuwstelsel · Bewegingsatlas',
 aria:'3D-zoomreis door de reflexboog: van de kniepeesreflex op de kast via het ruggenmerg en één zenuwvezel tot in de synaps',
 loader:['De reflexboog wordt opgebouwd…','Van prikkel tot beweging'],
 seed:1,
 shadow:{left:-12,right:12,top:13,bottom:-6},
 levels:[
  {name:'Reflex',scale:'1 m',sc:'REFLEXBOOG',title:'Van prikkel tot beweging',sub:'<i>Arcus reflexus</i> · de kniepeesreflex op de kast',
   view:VIEW0,zoomTo:[-5.9,7.3,-.7],s1:'Rust',s2:'Kniepeesreflex',s3:'Te laat',
   bg:['#2b3844','#151e27','#0a0f14'],fog:0x151e27,hemi:.62,shadows:true},
  {name:'Ruggenmerg',scale:'1 cm',sc:'RUGGENMERG',title:'Het ruggenmerg',sub:'<i>Medulla spinalis</i> · grijze en witte stof, wortels en ganglion',
   view:VIEW1,zoomTo:[7.6,-.5,.3],s1:'Rust',s2:'Reflex',s3:'Bekneld',
   bg:['#342a3d','#1a1421','#0b080f'],fog:0x1a1421,hemi:.7,drone:true},
  {name:'Zenuwvezel',scale:'0,1 mm',sc:'ZENUWVEZEL',title:'Eén zenuwvezel',sub:'<i>Neurofibra myelinata</i> · myelineschede en knopen van Ranvier',
   view:NARROW?[[-.4,4.0,9.4],[.6,-.9,0]]:[[-1.6,5.6,15.8],[1.1,-.5,0]],zoomTo:[9.5,.9,0],s1:'Rust',s2:'Geleiding',s3:'Klap',
   bg:['#1c3442','#0e1b25','#05090e'],fog:0x0e1b25,hemi:.72,drone:true},
  {name:'Synaps',scale:'1 µm',sc:'SYNAPS',title:'De synaps',sub:'<i>Synapsis</i> · van elektrisch naar chemisch en weer terug',
   view:NARROW?[[0,6.2,13.5],[0,-.3,0]]:[[.8,6.2,12.6],[0,.8,0]],s1:'Rust',s2:'Prikkel en rem',s3:'Kramp',
   bg:['#3b2731','#1e1218','#0c0609'],fog:0x1e1218,hemi:.75,drone:true}],
 help:{title:'Zo werkt de zoomreis',
  html:'<p>Je volgt één signaal door het zenuwstelsel, in drie stappen dieper: van een <b>sporter op de kast</b> bij wie de docent de kniepeesreflex test (1 m), via het <b>ruggenmerg</b> (1 cm) en <b>één zenuwvezel</b> (0,1 mm) tot in de <b>synaps</b> (1 µm). Zoom in met <b>+</b> en uit met <b>−</b>, of klik op de ladder links.</p><ul><li>Klik op een genummerd punt of direct op het model voor uitleg in vier tabjes.</li><li>Kleuren van de banen: <b style="color:#7cc6ff">blauw</b> is sensorisch (naar het ruggenmerg), <b style="color:#ff7a5c">rood</b> is motorisch (naar de spier), <b style="color:#7fe8a2">groen</b> is remmend en <b style="color:#d3a8ff">paars</b> is de piramidebaan uit de hersenen. Een lichtpuls is één actiepotentiaal.</li><li>Alles wat in milliseconden gebeurt, zie je in <b>tijdlupe</b>. De tijdlijn in de HUD loopt mee in echte milliseconden. Met <b>Slow motion</b> gaat het nog vier keer langzamer.</li></ul><h3>Drie standen</h3><p><b>1 Rust</b>: verkennen, met af en toe een signaal voor de spierspanning. <b>2 Belasting</b>: de kniepeesreflex, het signaal in ruggenmerg en vezel, of prikkelen en remmen in de synaps. <b>3 Extreem</b>: een enkel die kantelt voordat de reflex er is, een beknelde zenuwwortel, een klap op de zenuw en kramp. Bij de enkel en de wortel kies je de ernst met Graad 1–3.</p>',
  states:'Rust · reflex of signaal · te laat, bekneld, klap of kramp',
  keys:[['<kbd>S</kbd>','In stand 2: één tik, impuls of prikkel']],
  note:'Vereenvoudigd didactisch model: banen, cellen en verhoudingen zijn vergroot en ingekort om ze zichtbaar te maken. Tijden zijn afgeronde waarden; in de literatuur verschillen ze per persoon, spier en meetmethode. Lees ze als ‘ongeveer’.'},
 film:{brand:'ZENUWSTELSEL',blurb:'Van prikkel tot beweging · ca. 4,5 minuut · met stem en ondertitels',file:'zenuwstelsel-uitleg'},
 quizEnd:'<p>Bespreek de slotvraag met je groep. Test daarna in de gymzaal in tweetallen de kniepeesreflex (zittend op de kast, ontspannen onderbeen). Doe een reactiespel met een start op geluid en op beeld, en land daarna op één been op een balanskussen. Wat merk je van vooraf aanspannen?</p>',
 build(K){
const {THREE,V,AX,AY,AZ,R,clamp,lerp,smooth,ease,bump,D2R,TAU,sunflower,mesh,std,glass,glow,add,BAND,UCYL,orient,segMatrix,placeMatrix,ZERO,inst,tube,lathe,boneGeo,BONE,ENV,canvasTex,groups,W,S,$}=K;
const G0=groups[0],G1=groups[1],G2=groups[2],G3=groups[3];
const SY=-.65,Vs=(x,y,z)=>V(x,y+SY,z);  // het schema op het bord ligt iets lager
const COL={sens:0x58b8ff,mot:0xff5a3c,inh:0x5fe08a,pyr:0xc38cff,asc:0x8fd0ff};
const _a=V(0,0,0),_b=V(0,0,0),_p=V(0,0,0),_q=V(0,0,0),_r=V(0,0,0),_c=new THREE.Color(),_c2=new THREE.Color(),_o2=new THREE.Object3D();
const SQ=[];const sq=f=>{if(SQ.length<30)SQ.push(f);};
function playSQ(api){while(SQ.length){const f=SQ.shift();try{f(api);}catch(e){}}}
const ns=m=>{m.castShadow=false;m.receiveShadow=false;return m;};
const prof=(t,up,down)=>t<0?0:t<up?t/up:Math.max(0,1-(t-up)/down);
const cross=(a,b,T)=>a<T&&b>=T;
// op een smal scherm bedekt het paneel de onderste helft: schuif het onderwerp naar het bovenste deel en kom iets dichterbij
function PV(v,k){if(!NARROW)return v;k=k||.62;const p=V(...v[0]),t=V(...v[1]);const d=p.clone().sub(t);const D=d.length();d.normalize();
  const up=V(0,1,0).addScaledVector(d,-d.y).normalize();const Deff=1.9*k*D;t.addScaledVector(up,-.143*Deff);return [t.clone().addScaledVector(d,D*k).toArray(),t.toArray()];}

/* ================= gedeeld: banen en lichtpulsen ================= */
// een baan is een reeks stukken, elk in een eigen groep (zodat hij meebeweegt met dijbeen, onderbeen of voet)
function mkRoute(G,segs,col,rad,o){o=o||{};const b0=o.base===undefined?.24:o.base*.6;const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(col).multiplyScalar(o.cm||.72),emissive:col,emissiveIntensity:b0,roughness:.6});
  const r={segs:[],L:0,mat,act:0,base:b0,meshes:[]};
  segs.forEach(sg=>{const par=sg[0],pts=sg[1].map(q=>q.isVector3?q.clone():V(q[0],q[1],q[2]));const c=new THREE.CatmullRomCurve3(pts,false,'centripetal');const L=c.getLength();r.segs.push({p:par,c,L,a:r.L});r.L+=L;
    if(!o.noTube){const m=ns(new THREE.Mesh(new THREE.TubeGeometry(c,Math.max(18,Math.round(L*22)),sg[2]||rad,8),mat));(par||G).add(m);r.meshes.push(m);}});
  return r;}
function rpos(r,u,out){const d=clamp(u,0,1)*r.L;let s=r.segs[r.segs.length-1];for(let i=0;i<r.segs.length;i++){const q=r.segs[i];if(d<=q.a+q.L){s=q;break;}}
  s.c.getPointAt(clamp((d-s.a)/(s.L||1),0,1),out);if(s.p)out.applyMatrix4(s.p.matrixWorld);return out;}
function uNear(r,pt){let best=0,bd=1e9;for(let i=0;i<=300;i++){rpos(r,i/300,_p);const d=_p.distanceToSquared(pt);if(d<bd){bd=d;best=i/300;}}return best;}
function Pulser(G,max,rad,opt){opt=opt||{};const TL=7,geo=new THREE.SphereGeometry(1,12,8);const NB=!!opt.normal;const WH=opt.white===undefined?.2:opt.white,HS=opt.haloSize||2.4,LIN=opt.linger||.32;
  const core=new THREE.InstancedMesh(geo,NB?new THREE.MeshBasicMaterial({color:0xffffff}):add(0xffffff,1),max*TL),halo=new THREE.InstancedMesh(geo,add(0xffffff,opt.halo!==undefined?opt.halo:NB?.1:.15),max);
  [core,halo].forEach(m=>{m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);m.frustumCulled=false;m.renderOrder=5;G.add(m);});
  const blk=new THREE.Color(0,0,0);for(let i=0;i<max*TL;i++){core.setMatrixAt(i,ZERO);core.setColorAt(i,blk);}for(let i=0;i<max;i++){halo.setMatrixAt(i,ZERO);halo.setColorAt(i,blk);}
  const list=[],p=V(0,0,0),h=V(0,0,0),col=new THREE.Color();
  return {list,core,halo,
    add(o){if(list.length>=max)list.shift();o.c=new THREE.Color(o.col);o.sz=o.sz||1;list.push(o);return o;},
    clear(){list.length=0;},
    count(){return list.length;},
    update(clk){let k=0,hk=0;
      for(let i=list.length-1;i>=0;i--){const o=list[i];const now=clk(o);const u=(now-o.t0)/o.dur;
        const end=o.stop===undefined?1:o.stop;const LG=o.stop===undefined?LIN:.32;
        if(u>end+LG){if(!o.done){o.done=true;if(o.cb&&o.stop===undefined)o.cb(o);if(o.cbStop&&o.stop!==undefined)o.cbStop(o);}list.splice(i,1);continue;}
        if(!o.done&&u>=1&&o.stop===undefined){o.done=true;if(o.cb)o.cb(o);}
        if(u<0)continue;
        const uh=Math.min(u,end),f=u>end?Math.max(0,1-(u-end)/LG):1;const du=rad*o.sz*1.6/o.r.L;
        o.r.act=Math.max(o.r.act,f*.9);
        for(let j=0;j<TL&&k<max*TL;j++){const uj=uh-j*du;if(uj<0)break;rpos(o.r,uj,p);if(j===0)h.copy(p);const s=rad*o.sz*(1-j*.1)*(NB?Math.max(.15,f*Math.pow(1-j/TL,.8)):1);core.setMatrixAt(k,placeMatrix(p,null,s));
          const it=f*Math.pow(1-j/TL,1.6)*(j===0?.95:.45)*(o.blk&&u>end-.02?1.4:1);col.copy(o.blk&&u>end-.05?_c2.setRGB(1,.3,.2):o.c);if(j===0&&WH>0)col.lerp(_c2.setRGB(1,1,1),WH);if(!NB)col.multiplyScalar(it);core.setColorAt(k,col);k++;}
        if(hk<max){halo.setMatrixAt(hk,placeMatrix(h,null,rad*o.sz*HS));col.copy(o.c).multiplyScalar(.8*f);halo.setColorAt(hk,col);hk++;}}
      for(;k<max*TL;k++){core.setMatrixAt(k,ZERO);}for(;hk<max;hk++)halo.setMatrixAt(hk,ZERO);
      core.instanceMatrix.needsUpdate=true;core.instanceColor.needsUpdate=true;halo.instanceMatrix.needsUpdate=true;halo.instanceColor.needsUpdate=true;}};}
function decayRoutes(list,dt,k){k=k===undefined?1.1:k;list.forEach(r=>{r.act=Math.max(0,r.act-dt*1.6);r.mat.emissiveIntensity=r.base+r.act*k;});}
const cellMat=c=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.3,roughness:.4});

/* ================= vlinder en omtrek van het ruggenmerg ================= */
const BF=[[0,.12],[.12,.16],[.22,.3],[.31,.52],[.38,.72],[.45,.8],[.52,.76],[.45,.52],[.37,.31],[.42,.16],[.52,.09],[.58,.02],[.53,-.06],[.61,-.2],[.67,-.38],[.62,-.56],[.47,-.65],[.3,-.61],[.18,-.43],[.1,-.23],[0,-.17]];
const BFP=BF.concat(BF.slice(1,-1).reverse().map(p=>[-p[0],p[1]]));
function inBF(x,y){let c=false;for(let i=0,j=BFP.length-1;i<BFP.length;j=i++){const a=BFP[i],b=BFP[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function bfShape(s,hole){const sh=new THREE.Shape();BFP.forEach((p,i)=>i?sh.lineTo(p[0]*s,p[1]*s):sh.moveTo(p[0]*s,p[1]*s));sh.closePath();if(hole){const h=new THREE.Path();h.absarc(0,-.02*s,hole*s,0,TAU,true);sh.holes.push(h);}return sh;}
function outlinePts(){const p=[];const N=88;let notch=false;for(let i=0;i<N;i++){const a=Math.PI/2-i/N*TAU;const x=Math.cos(a),y=Math.sin(a)*.8;
  if(y<-.5&&Math.abs(x)<.08){if(!notch){notch=true;p.push([.06,-.795],[.025,-.52],[-.025,-.52],[-.06,-.795]);}continue;}if(y>0&&Math.abs(x)<.03){p.push([x,.765]);continue;}p.push([x,y]);}return p;}
function cordShape(s,hole){const sh=new THREE.Shape();outlinePts().forEach((q,i)=>i?sh.lineTo(q[0]*s,q[1]*s):sh.moveTo(q[0]*s,q[1]*s));sh.closePath();
  if(hole){const h=new THREE.Path();BFP.slice().reverse().forEach((q,i)=>i?h.lineTo(q[0]*s,q[1]*s):h.moveTo(q[0]*s,q[1]*s));h.closePath();sh.holes.push(h);}return sh;}
function extr(shape,D){const g=new THREE.ExtrudeGeometry(shape,{depth:D,bevelEnabled:false,curveSegments:6});g.rotateX(-Math.PI/2);return g;}
const greyTex=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#93606f';x.fillRect(0,0,w,h);for(let i=0;i<1100;i++){x.fillStyle=`rgba(${85+R()*40|0},${38+R()*30|0},${72+R()*40|0},${.22+R()*.4})`;x.beginPath();x.arc(R()*w,R()*h,.6+R()*1.9,0,TAU);x.fill();}});greyTex.repeat.set(.55,.55);

/* =====================================================================
   NIVEAU 0 · de kniepeesreflex op de kast, met het schema op een bord
   ===================================================================== */
K.base({parent:G0,floor:'gym',plaque:['ARCUS REFLEXUS','de kniepeesreflex · van prikkel tot beweging'],plaqueX:-2.4,plaqueW:6});
// schemabord achter het model
const BX0=-8.4,BX1=2.3,BY0=.5,BY1=10.95,BZ=-2.75;
const boardTex=canvasTex(1024,1060,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1a2834');g.addColorStop(1,'#0e161d');x.fillStyle=g;x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(130,180,210,.07)';x.lineWidth=1;for(let i=0;i<w;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke();}for(let j=0;j<h;j+=32){x.beginPath();x.moveTo(0,j);x.lineTo(w,j);x.stroke();}
  x.strokeStyle='rgba(230,182,94,.5)';x.lineWidth=3;x.strokeRect(14,14,w-28,h-28);
  x.fillStyle='#e6b65e';x.font='700 50px Georgia,serif';x.textAlign='right';x.fillText('DE REFLEXBOOG',w-44,86);x.fillStyle='rgba(241,233,218,.6)';x.font='italic 26px Georgia,serif';x.fillText('schema · vergroot, niet op schaal',w-44,124);
  const L=[['#58b8ff','sensorisch: van spier naar ruggenmerg'],['#ff5a3c','motorisch: van ruggenmerg naar spier'],['#5fe08a','remmend: schakelneuron'],['#c38cff','piramidebaan: uit de hersenen']];
  x.textAlign='left';x.font='600 21px "Courier New",monospace';L.forEach((l,i)=>{const y=560+i*36;x.fillStyle=l[0];x.fillRect(46,y-9,50,7);x.fillStyle='rgba(241,233,218,.78)';x.fillText(l[1],108,y);});
  x.fillStyle='rgba(241,233,218,.45)';x.font='600 22px "Courier New",monospace';x.fillText('HERSENEN',60,64);x.fillText('RUGGENMERG',60,470);x.fillText('SPIER EN ZENUW',640,430);});
const board=mesh(new THREE.BoxGeometry(BX1-BX0,BY1-BY0,.16),[ENV.dark,ENV.dark,ENV.dark,ENV.dark,std(0xffffff,{map:boardTex,roughness:.85}),ENV.dark],[(BX0+BX1)/2,(BY0+BY1)/2,BZ],0,0,G0);board.userData.noDim=true;board.receiveShadow=false;

  `<p>Je lichaam heeft naar schatting enkele tienduizenden spierspoelen. In kleine spieren voor fijne bewegingen, zoals in de hand en de nek, liggen ze het dichtst bij elkaar.</p>`,
  `<p class="think">Waarom zou de spierspoel juist reageren op snelle rek, en minder op langzaam rekken zoals bij statisch stretchen?</p>`]},
 {lv:0,name:'Golgi-peeslichaampje',lat:'Organum tendineum (Golgi)',at:()=>W.gto,state:1,view:[[2.6,6.75,4.6],[.9,5.55,-.5]],focus:()=>[gtoG,QFM],pick:()=>[gtoG],tabs:[
  `<p>Waar spier overgaat in pees, liggen de <b>Golgi-peeslichaampjes</b>. Ze meten geen lengte maar <b>spanning</b>: hoe hard de spier aan de pees trekt.</p><p>Hun vezels (Ib) prikkelen in het ruggenmerg een schakelneuron dat de eigen spier <b>remt</b>. Dat is een polysynaptische reflex.</p>`,
  `<p>Bij een rekoefening voelt het alsof de spier na een tijdje ‘loslaat’. Lang dacht men dat dit door deze remming kwam. Onderzoek laat zien dat vooral je <b>rektolerantie</b> toeneemt: je verdraagt de rek beter. Bij kramp helpt rekken vaak wel: zie stand 3 op het niveau synaps.</p>`,
  `<p>Een Golgi-peeslichaampje is ongeveer 1 mm lang en zit tussen zo’n tien tot twintig spiervezels en hun pees.</p>`,
  `<p class="think">De spierspoel zegt ‘aanspannen’, het Golgi-peeslichaampje zegt ‘ontspannen’. Waarom heeft een spier allebei nodig?</p>`]},
 {lv:0,name:'Motorische eindplaat',lat:'Junctio neuromuscularis',at:()=>W.ep,state:2,view:[[1.8,6.95,4.6],[-.2,5.85,-.4]],focus:()=>[QFM,...MQ.map(r=>r.meshes[1])],pick:()=>[QFM],tabs:[
  `<p>De rode motorische vezel vertakt in de spier. Elke tak eindigt op één spiervezel in een <b>motorische eindplaat</b>. Daar geeft de zenuw het bevel door met de stof <b>acetylcholine</b>.</p><p>Eén motorische zenuwcel met al zijn spiervezels heet een <b>motorische eenheid</b>.</p>`,
  `<p>Hoe meer motorische eenheden je inschakelt, hoe meer kracht. Bij een maximale sprong doen vrijwel alle eenheden mee. Bij rustig staan werken er maar een paar, vooral in de kuit: genoeg om je houding vast te houden.</p><p>Hoe de spiervezel daarna samentrekt, zie je bij <a href="spier.html#niveau=3">halte 8, de spier</a>.</p>`,
  `<p>In grote beenspieren stuurt één motorische zenuwcel soms honderden tot meer dan duizend spiervezels aan. In de oogspieren zijn dat er maar een paar.</p>`,
  `<p class="think">Waarom heeft een oogspier kleine motorische eenheden en de quadriceps grote?</p>`]},
 {lv:0,name:'Motorische schors en piramidebaan',lat:'Gyrus precentralis · tractus corticospinalis',at:()=>W.ctx,state:1,view:[[-2.6,10.1,4.8],[-5.6,8.75,-1.2]],focus:()=>[brain,PYR.meshes[0]],pick:()=>[brain],tabs:[
  `<p>Een bewuste beweging begint in de hersenschors. De paarse strook is de <b>motorische schors</b>. Van daaruit loopt de <b>piramidebaan</b> door de hersenstam naar het ruggenmerg en schakelt daar op dezelfde voorhoorncel als de reflex.</p><p>De blauwe strook ernaast is de gevoelsschors: daar komt de melding van de tik binnen.</p>`,
  `<p>Op het startschot reageren kost ongeveer <b>150 ms</b>: horen, verwerken, beslissen en dan pas het bevel. Probeer in stand 2 de knop <b>Startschot</b>. Reageer je binnen 0,100 s, dan heb je niet gereageerd maar gegokt: een valse start.</p>`,
  `<p>Sinds 2010 betekent bij World Athletics één valse start direct diskwalificatie. De startblokken meten de druk op de voeten: wie binnen 0,100 s na het schot afzet, krijgt een valse start.</p>`,
  `<p class="think">Een reflex en een bewuste schop gebruiken dezelfde motorische vezel. Waar zit dan het verschil in tijd?</p>`]},
 {lv:0,name:'Kuitbeenspieren',lat:'M. fibularis longus et brevis',at:()=>W.per,state:3,view:[[0.0,2.5,5.6],[1.4,1.05,-.4]],focus:()=>[SH,FT,atfl,cfl,lan.root,opp.root],pick:()=>[peroneus,atfl,cfl],tabs:[
  `<p>De <b>kuitbeenspieren</b> lopen langs de buitenkant van het onderbeen en achter de buitenenkel langs naar de voet. Ze draaien de voetzool naar buiten (eversie) en beschermen zo de enkel tegen doorzwikken.</p><p>Kantelt de voet naar binnen, dan worden ze gerekt en volgt een reflex: de <b>peroneusreflex</b>. Die komt pas na ongeveer 60–80 ms op gang. Daarna heeft de spier nog tientallen milliseconden nodig om echt kracht te leveren.</p>`,
  `<p>Bij een landing op de voet van een tegenstander (basketbal, volleybal) kantelt de enkel volgens videoanalyses van echte verstuikingen binnen ongeveer 40–50 ms al tot de buitenband maximaal gespannen is. De reflex is dan te laat.</p><p>Wat wel helpt: sterke kuitbeenspieren, balanstraining en <b>vooraf aanspannen</b> voordat je landt. Zie <a href="landing.html">het lab Landing</a> en <a href="enkel.html">halte 10, de enkel</a>.</p>`,
  `<p>De enkelverstuiking hoort bij de meest voorkomende sportblessures. In een Nederlands onderzoek onder sporters met een eerdere verstuiking gaf een thuisprogramma met balansoefeningen ongeveer 35 % minder nieuwe verstuikingen (Hupperets e.a., 2009, BMJ).</p>`,
  `<p class="think">Balanstraining maakt de reflex nauwelijks sneller. Waarom helpt het dan toch tegen verstuikingen?</p>`]},
 {lv:1,name:'Grijze en witte stof',lat:'Substantia grisea et alba',at:()=>W.gm1,view:[[2.4,7.4,6.6],[-.6,.6,0]],focus:()=>[gm1,WFM,wm1],pick:()=>[gm1],tabs:[
  `<p>In doorsnede lijkt de <b>grijze stof</b> op een vlinder. Daar liggen de cellichamen van zenuwcellen en hun synapsen. Boven zijn de achterhoorns (gevoel), onder de voorhoorns (beweging).</p><p>De <b>witte stof</b> eromheen bestaat uit vezels met myeline. Die lopen in bundels op en neer: blauw naar de hersenen, paars van de hersenen af.</p>`,
  `<p>Bij een dwarslaesie zijn de vezels in de witte stof onderbroken. Bewuste bewegingen onder de laesie lukken dan niet meer, terwijl de kniepeesreflex vaak nog werkt of zelfs sterker is. De reflexboog heeft de hersenen niet nodig.</p>`,
  `<p>Het ruggenmerg is ongeveer 45 cm lang en ongeveer 1 cm dik. Het eindigt al ter hoogte van de eerste of tweede lendenwervel; daaronder lopen alleen nog zenuwwortels.</p>`,
  `<p class="think">Waarom kan iemand met een dwarslaesie wel een kniepeesreflex hebben, maar het been niet bewust strekken?</p>`]},
 {lv:1,name:'Spinaal ganglion en achterwortel',lat:'Ganglion spinale · radix posterior · neuron afferens Ia',at:()=>W.drg,view:[[6.6,4.4,1.6],[3.6,-.1,-1.5]],focus:()=>[RootR.g,R1.IA.meshes[0]],pick:()=>[RootR.drg],tabs:[
  `<p>De sensorische vezel komt binnen via de <b>achterwortel</b>. Halverwege zit een verdikking: het <b>spinaal ganglion</b>. Daar ligt het cellichaam van de sensorische zenuwcel, buiten het ruggenmerg.</p><p>Die cel heeft één lange uitloper die zich splitst: een tak naar de spier en een tak het ruggenmerg in.</p>`,
  `<p>De Ia-vezel uit de spierspoel is een van de dikste en snelste vezels die je hebt: tot ongeveer 100 m/s. In het been van een mens meet je vaak 60–80 m/s. Daardoor kan de reflex zo snel zijn: de hele route van ruim een meter heen en terug duurt maar ongeveer 25 ms.</p>`,
  `<p>Een sensorische zenuwcel voor de voet kan meer dan een meter lang zijn: van de voetzool tot in het ruggenmerg en dan nog verder omhoog.</p>`,
  `<p class="think">Waarom zou het cellichaam van een sensorische zenuwcel buiten het ruggenmerg liggen, in een ganglion?</p>`]},
 {lv:1,name:'Motorische voorhoorncel',lat:'Motoneuron α · cornu anterius · radix anterior',at:()=>W.mnq1,view:[[4.2,6.4,6.2],[1.2,.9,.6]],focus:()=>[nMNq,nMNh,R1.MQ.meshes[0]],pick:()=>[nMNq,nMNh],tabs:[
  `<p>In de voorhoorn ligt het grote <b>α-motoneuron</b>. Hier eindigt de Ia-vezel met één synaps: de reflex is <b>monosynaptisch</b>. Vuurt deze cel, dan gaat de impuls via de <b>voorwortel</b> en de <b>dijbeenzenuw</b> (<i>n. femoralis</i>) naar de quadriceps.</p><p>Op deze cellen komen ook signalen uit de hersenen binnen (paars). De cel van de hamstrings krijgt bij de reflex bovendien remmende signalen (groen). Elke cel telt alles bij elkaar op.</p>`,
  `<p>De voorhoorncel is het laatste station voor elke beweging, bewust of als reflex. Daarom heet hij de ‘laatste gemeenschappelijke weg’.</p>`,
  `<p>Bij ALS, een ziekte van de motorische zenuwcellen, gaan voorhoorncellen en cellen in de motorische schors verloren. De spieren worden zwakker, terwijl ze zelf in het begin gezond zijn.</p>`,
  `<p class="think">Vuurt de voorhoorncel bij elke impuls uit de Ia-vezel? Bekijk het niveau synaps en leg uit wat ervoor nodig is.</p>`]},
 {lv:1,name:'Schakelneuron',lat:'Interneuron inhibitorium Ia · reciproke remming',at:()=>W.in1,view:[[3.2,6.2,5.2],[.8,.9,0]],focus:()=>[nIN,nMNh,R1.INH.meshes[0],R1.IAc.meshes[0]],pick:()=>[nIN],tabs:[
  `<p>Een zijtak van de Ia-vezel prikkelt een klein <b>schakelneuron</b>. Dat remt de voorhoorncel van de tegenspeler, de hamstrings. Zo spannen de hamstrings niet aan terwijl de quadriceps schopt: <b>reciproke remming</b>.</p><p>Deze route heeft twee synapsen: hij is <b>polysynaptisch</b>.</p>`,
  `<p>Reciproke remming maakt snelle, soepele bewegingen mogelijk, zoals bij sprinten: de buigers geven mee als de strekkers werken. Bij vermoeidheid of een slechte coördinatie werken spieren meer tegen elkaar in.</p>`,
  `<p>Het grootste deel van alle zenuwcellen in het ruggenmerg is een schakelneuron. Ze maken van eenvoudige reflexen samenwerkende patronen, zoals de beenbewegingen bij lopen.</p>`,
  `<p class="think">Waarom is de route via het schakelneuron iets trager dan de directe route naar de quadriceps?</p>`]},
 {lv:2,name:'Myelineschede',lat:'Stratum myelini · neurolemmocytus',at:()=>W.cut2,view:[[-.2,2.6,5.6],[-1.4,.9,0]],focus:()=>MY.map(o=>o.g),pick:()=>MY.map(o=>o.m),tabs:[
  `<p>Om een dikke zenuwvezel wikkelt een <b>Schwann-cel</b> zich tientallen keren. Die lagen vet en eiwit vormen samen de <b>myelineschede</b>: een isolatielaag, zoals de mantel om een elektriciteitsdraad. In de snede zie je de lagen.</p><p>De paarse bobbel is de celkern van de Schwann-cel.</p>`,
  `<p>Hoe beter de isolatie, hoe sneller het signaal. Dat is belangrijk voor reflexen en voor snelle reacties in de sport. Myeline groeit nog tot in de jongvolwassenheid; ook daarom worden kinderen beter in coördinatie naarmate ze ouder worden.</p>`,
  `<p>In het echt is een stuk myeline ongeveer honderd keer zo lang als de vezel dik is, rond 1 mm. In dit model zijn de stukken ingekort.</p>`,
  `<p class="think">Waarom hebben de vezels voor pijn uit de huid vaak géén myeline, terwijl de vezels uit de spierspoel dat wel hebben?</p>`]},
 {lv:2,name:'Knoop van Ranvier',lat:'Nodus neurofibrae',at:()=>W.node2,view:[[1.2,2.6,4.2],[0,.9,0]],focus:()=>[NAC,NAM,KM,...MY.map(o=>o.g)],pick:()=>[NAC],tabs:[
  `<p>Tussen twee stukken myeline ligt een smalle onderbreking: de <b>knoop van Ranvier</b>. Alleen daar liggen veel natriumkanalen bloot. Komt de spanning boven de drempel, dan gaan ze open en stroomt <b>Na⁺</b> naar binnen. Daarna stroomt K⁺ naar buiten en herstelt de rustspanning.</p><p>De stroom springt onder de myeline door naar de volgende knoop: <b>saltatoire geleiding</b>.</p>`,
  `<p>Met myeline gaat het signaal tot ongeveer 100 m/s (in het been van een mens vaak 60–80 m/s), zonder myeline ongeveer 1 m/s. Bij kou geleiden zenuwen langzamer: ongeveer 3% per graad. Na een koude start reageren je spieren dus trager. Probeer de temperatuurschuif in stand 2.</p>`,
  `<p>De knoop is maar ongeveer 1 µm breed. Bij multiple sclerose (MS) raakt myeline in hersenen en ruggenmerg beschadigd, waardoor signalen vertragen of uitvallen.</p>`,
  `<p class="think">Waarom is springen van knoop naar knoop niet alleen sneller, maar ook zuiniger met energie?</p>`]},
 {lv:3,name:'Synaptische blaasjes en spleet',lat:'Vesiculae synapticae · fissura synaptica',at:()=>W.ves3,view:[[-4.4,3.6,6],[-2.6,1.1,0]],focus:()=>[BT[0].g,VS,VC,TRM,CAC,CAM3],pick:()=>[BT[0].shell],tabs:[
  `<p>Aan het eind van de vezel zit een <b>eindknopje</b> vol blaasjes met <b>neurotransmitter</b>. Komt er een impuls aan, dan gaan calciumkanalen open. <b>Ca²⁺</b> stroomt naar binnen en laat blaasjes versmelten met de membraan.</p><p>De stof stroomt de <b>synaptische spleet</b> in en bindt aan receptoren op de volgende cel. Zo wordt een elektrisch signaal chemisch, en daarna weer elektrisch.</p>`,
  `<p>Een synaps kost tijd: ongeveer 0,5–1 ms. Daarom is een reflex met één synaps sneller dan een route met veel synapsen. Een reactie via de hersenen gaat door tientallen synapsen achter elkaar, en tegelijk door heel veel cellen naast elkaar.</p>`,
  `<p>Een blaasje is ongeveer 40 nm groot en bevat duizenden moleculen neurotransmitter. De spleet is ongeveer 20 nm breed. In het model is alles sterk vergroot.</p>`,
  `<p class="think">Waarom zou er in het eindknopje zoveel mitochondriën liggen?</p>`]},
 {lv:3,name:'Receptoren: prikkelend en remmend',lat:'Receptor glutamati · receptor glycini',at:()=>W.rec3,state:2,view:[[2.6,3.4,6.4],[.6,.2,0]],focus:()=>[RECM,IONM,BT[0].psp,BT[1].psp,TRM],pick:()=>[RECM],tabs:[
  `<p>De Ia-vezel geeft <b>glutamaat</b> af. Dat opent kanalen voor <b>Na⁺</b>: de spanning in de motorische cel stijgt een beetje (prikkelend). Het schakelneuron geeft <b>glycine</b> af. Dat opent kanalen voor <b>Cl⁻</b>: de spanning daalt (remmend).</p><p>De cel telt alles bij elkaar op. Alleen boven de drempel van ongeveer −55 mV vuurt hij. Kijk naar de lijn in de HUD.</p>`,
  `<p>Je zenuwstelsel kiest zo welke spieren werken en welke stil blijven. Bij een sprong vuren de strekkers, terwijl de buigers geremd worden. Bij kramp raakt de balans zoek: zie stand 3.</p>`,
  `<p>Eén motorische zenuwcel in het ruggenmerg krijgt synapsen van duizenden andere cellen: uit spierspoelen, schakelneuronen en de hersenen.</p>`,
  `<p class="think">Wat gebeurt er met de reflex als de remmende synapsen niet meer zouden werken?</p>`]}];

 {t:'T1',type:'mc',lv:3,state:2,q:'Kijk op het niveau synaps in stand 2 naar de lijn in de HUD. Eerst komen drie prikkels kort na elkaar en vuurt de cel. Daarna komen prikkels samen met remming en vuurt de cel niet. Wat laat dat zien?',
  opts:['Dat de cel alleen vuurt als ook het schakelneuron vuurt','Dat één prikkelende impuls meestal genoeg is om de cel te laten vuren','Dat de cel prikkelende en remmende stapjes optelt en pas vuurt boven de drempel van ongeveer −55 mV','Dat glycine de blaasjes in het eindknopje leegmaakt'],ok:2,
  ex:'Elke prikkel geeft een klein stapje omhoog, elke remming een stapje omlaag. Komen de prikkels kort na elkaar, dan tellen ze op tot boven de drempel. Komt er tegelijk remming, dan blijft de som eronder.',
  why:['Het schakelneuron remt juist. Als het vuurt, blijft de cel stil.','Eén stapje is maar een paar millivolt. Pas meerdere stapjes kort na elkaar halen de drempel.',null,'Glycine wordt losgelaten door het schakelneuron en werkt op de receptoren van de volgende cel. Het maakt geen blaasjes leeg.']},
 {t:'T2',type:'mc',lv:1,state:2,q:'Bekijk stand 2 op het niveau ruggenmerg. De quadriceps schopt, maar de hamstrings spannen niet aan. Hoe komt dat?',
  opts:['De hamstrings krijgen tijdens de reflex geen bloed','Een schakelneuron remt de voorhoorncel van de hamstrings: reciproke remming, via een polysynaptische route','De hersenen zetten de hamstrings bewust uit','De Ia-vezel prikkelt de hamstrings ook, maar te zwak'],ok:1,
  ex:'Een zijtak van de Ia-vezel prikkelt een remmend schakelneuron. Dat remt de motorische cel van de hamstrings, zodat de tegenspeler meegeeft. Deze route heeft twee synapsen (polysynaptisch), de route naar de quadriceps maar één (monosynaptisch).',
  why:['De doorbloeding verandert in 25 ms niet. Het gaat om de zenuwsignalen.',null,'Daarvoor is de reflex te snel: de hersenen horen pas van de tik als de quadriceps al aanspant.','De Ia-vezel uit de quadriceps prikkelt de hamstrings niet. Via het schakelneuron worden ze juist geremd.']},
 {t:'T2',type:'mc',lv:0,state:2,q:'Kijk in stand 2 naar de tijdlijn en druk daarna op <b>Startschot</b>. De kniepeesreflex duurt ongeveer 25 ms, een reactie op het startschot ongeveer 150 ms. Waardoor komt dat verschil vooral?',
  opts:['De zenuwvezels naar het been zijn bij een start dunner','De spier is bij een start nog koud','Bij een reflex is er helemaal geen synaps nodig','Het signaal gaat via de hersenen: horen, verwerken en beslissen, en pas dan via de piramidebaan terug'],ok:3,
  ex:'De motorische vezel is dezelfde. Het verschil zit in de route: bij een reactie gaat het signaal door de hersenen, met veel synapsen en een beslissing. Dat kost de meeste tijd.',
  why:['Het bevel gaat in beide gevallen via dezelfde dikke motorische vezel naar de quadriceps.','Temperatuur maakt geleiding iets trager, maar verklaart nooit een verschil van zes keer.','Er is wel een synaps: precies één, in de voorhoorn. Daarom heet de reflex monosynaptisch.',null]},
 {t:'T2',type:'mc',lv:0,state:3,q:'Bekijk stand 3. Waarom voorkomt de reflex van de kuitbeenspieren de enkelverstuiking niet?',
  opts:['De reflex komt pas na ongeveer 60–80 ms, terwijl de buitenband binnen ongeveer 40–50 ms al zwaar belast is','De kuitbeenspieren liggen aan de binnenkant van de enkel','Een reflex werkt alleen als je stilstaat','De hersenen houden de reflex tegen om een val te voorkomen'],ok:0,
  ex:'De voet kantelt sneller dan de reflex kan reageren, en na het aangaan van de spier duurt het nog tientallen milliseconden voordat er echte kracht is. Bescherming moet er daarom al zijn vóór de landing: sterke spieren, balans en vooraf aanspannen.',
  why:[null,'De kuitbeenspieren lopen juist langs de buitenkant, achter de buitenenkel. Daarom kunnen ze inversie tegengaan.','Reflexen werken ook tijdens bewegen. Het probleem is dat deze reflex te laat komt.','De hersenen zijn niet nodig voor deze reflex en houden hem ook niet tegen. Hij is gewoon te traag voor deze snelle kanteling.']},
 {t:'I',type:'open',q:'Je geeft een les LO met springen en landen. Leg uit waarom een reflex een enkelverstuiking niet altijd kan voorkomen. Ontwerp daarna twee oefeningen die wel helpen. Gebruik de begrippen reflexboog, reactietijd en vooraf aanspannen.',
  model:'<p><b>Waarom niet</b>: bij een landing op een voet kantelt de enkel binnen ongeveer 40–50 ms. De reflexboog (sensoren in band en spier, sensorische vezel, ruggenmerg, motorische vezel, kuitbeenspieren) heeft ongeveer 60–80 ms nodig voordat de spieren actief worden, en daarna nog tientallen milliseconden voor echte kracht. Een bewuste reactie via de hersenen duurt nog langer, ongeveer 150 ms. Beide komen te laat.</p><p><b>Wat wel helpt</b>: bescherming die er al is vóór het contact. 1) <b>Landen op één been op een balanskussen</b>: de proprioceptie en de samenwerking van de spieren rond de enkel worden beter, zodat de enkel beter recht staat bij het neerkomen. 2) <b>Sprongen met een duidelijke landingsopdracht</b> (bijvoorbeeld een sprong over een lijn en landen ‘stil als een standbeeld’): de leerlingen leren de kuitbeenspieren <b>vooraf aan te spannen</b>, zodat de enkel al stevig staat. Een reactiespel (starten op geluid of beeld) laat het verschil tussen reflex en reactie zelf voelen.</p>'}];
