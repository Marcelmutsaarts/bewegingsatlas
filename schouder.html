<script>
// op een staand scherm bedekt de HUD de onderste helft: schuif het beeld dan omhoog door lager te mikken
const PORT=innerWidth<innerHeight*.85;

Atlas3D({
 id:'schouder',halte:2,name:'Schouder',

 levels:[
  {name:'Schouder',scale:'25 cm',sc:'GEWRICHT',title:'Het schoudergewricht',sub:'<i>Articulatio humeri</i> · de rotator cuff bij de worp',
   view:pv([[-4.4,7.5,17.6],[-1.9,4.75,.5]],-3.3,0),zoomTo:[-2.5,7.1,-.1],s1:'Rust',s2:'Arm heffen',s3:'Geblokte worp',
   bg:['#2c3a42','#18232a','#0d1316'],fog:0x17222a,hemi:.62,shadows:true},
  {name:'Onder het acromion',scale:'8 cm',sc:'PEES',title:'Onder het acromion',sub:'Ruimte onder het acromion (klinische term) · pees en slijmbeurs',
   view:pv([[-3,1.8,30],[.2,1.0,0]],-4.5,0),zoomTo:[2.5,-4,2],s1:'Rust',s2:'Arm heffen',s3:'Inklemming',
   bg:['#3a2f2a','#1d1715','#0c0908'],fog:0x1d1715,hemi:.78,shadows:false,drone:true},
  {name:'Labrum',scale:'5 cm',sc:'KOM',title:'De kom en het labrum',sub:'<i>Labrum glenoidale</i> · kapsel en banden',
   view:pv([[-5,31,40],[-2,-3,1.5]],0,6),s1:'Rust',s2:'Rollen en glijden',s3:'Luxatie',
   bg:['#1d3036','#0f1b1f','#060b0d'],fog:0x0f1b1f,hemi:.82,shadows:false,drone:true}],
 help:{title:'Zo werkt de zoomreis',
  html:`<p>Je begint bij een vergrote <b>rechterschouder</b> in de gymzaal: schouderblad, sleutelbeen en opperarm, met de vier spieren van de <b>rotator cuff</b> in kleur en de <b>deltaspier</b> als laag eroverheen. Een handballer naast het model beweegt synchroon mee. Daarna zoom je twee keer in:</p>
  <ul><li><b>Schouder</b> (≈ 25 cm): botten, cuff en deltaspier, met een meter voor het heffen en de ruimte onder het acromion.</li>
  <li><b>Onder het acromion</b> (≈ 8 cm): de supraspinatuspees en de slijmbeurs onder het schouderdak.</li>
  <li><b>Labrum</b> (≈ 5 cm): een doorsnede door de kom, met het labrum, het kapsel en de glenohumerale banden.</li></ul>
  <h3>Drie standen, op elk niveau</h3>
  <p><b>1 · Rust</b> om te verkennen. <b>2 · Belasting</b>: de arm heffen (met schuif of automatisch), en op het laatste niveau rollen en glijden van de kop. <b>3 · Blessure</b>: een geblokte worp met een voorste luxatie, inklemming van de pees in drie stadia, en het losscheuren van het labrum.</p>
  <h3>Kleuren</h3>
  <p>Supraspinatus <b style="color:#e3a53b">oker</b>, infraspinatus <b style="color:#3aa6c8">blauw</b>, teres minor <b style="color:#9a86e6">paars</b>, subscapularis <b style="color:#4fb46a">groen</b>. Spieren lichten op als ze werken. Banden en kapsel kleuren van grijs (slap) via wit (gespannen) naar rood (overrekt).</p>`,
  states:'Rust · belasting · blessure',
  keys:[['<kbd>M</kbd>','Slow motion']]},
 film:{brand:'SCHOUDER',blurb:'Waarom je schouder alles kan, en wat er misgaat · ca. 5 minuten · met stem en ondertitels',file:'schouder-uitleg'},
 quizEnd:'<p>Bespreek de slotvraag met je groep. Probeer het daarna in de gymzaal: leg in tweetallen een hand plat op het schouderblad van de ander en laat hem de arm langzaam zijwaarts heffen. Voel je wanneer het schouderblad begint mee te draaien?</p>',
 build(K){
const {THREE,V,mesh,std,glass,add,groups,W,S,clamp,lerp,smooth,ease,D2R,TAU,inst,segMatrix,ZERO,tube,boneGeo,canvasTex,orient,BAND,UCYL,AY}=K;
const R=K.R;
const _c=new THREE.Color(),_c2=new THREE.Color(),_a=V(0,0,0),_b=V(0,0,0),_d=V(0,0,0),_e=V(0,0,0),_f=V(0,0,0),ZV=V(0,0,0);
const I4=new THREE.Matrix4();
const ex=(dt,k)=>1-Math.exp(-dt*k);
const $=K.$;

/* ================= texturen ================= */
const trabTex=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#e8dbbd';x.fillRect(0,0,w,h);
  for(let i=0;i<620;i++){const px=R()*w,py=R()*h,r=2+R()*7;x.fillStyle=R()<.3?`rgba(178,102,78,${.3+R()*.35})`:`rgba(150,118,76,${.22+R()*.3})`;x.beginPath();x.ellipse(px,py,r,r*(.45+R()*.6),R()*3,0,TAU);x.fill();}
  x.strokeStyle='rgba(255,250,236,.55)';x.lineWidth=1.5;for(let i=0;i<170;i++){const px=R()*w,py=R()*h;x.beginPath();x.moveTo(px,py);x.lineTo(px+(R()-.5)*34,py+(R()-.5)*34);x.stroke();}});
const trabTexS=trabTex.clone();trabTexS.needsUpdate=true;trabTexS.repeat.set(.22,.22);
const fibTex=canvasTex(64,16,(x,w,h)=>{for(let i=0;i<w;i+=4){x.fillStyle=(i/4)%2?'#ffffff':'#c8bcb6';x.fillRect(i,0,4,h);}},[3,1]);
const labTex=canvasTex(128,128,(x,w,h)=>{x.fillStyle='#d6ecf0';x.fillRect(0,0,w,h);for(let i=0;i<260;i++){x.fillStyle=`rgba(90,140,160,${.15+R()*.25})`;x.beginPath();x.ellipse(R()*w,R()*h,1.5+R()*2.5,1+R()*1.5,R()*3,0,TAU);x.fill();}},[1,1]);
const headSecTex=canvasTex(512,512,(x,w,h)=>{const c=w/2;x.save();x.beginPath();x.arc(c,c,c-2,0,TAU);x.clip();x.fillStyle='#e6d4b0';x.fillRect(0,0,w,h);
  for(let i=0;i<1500;i++){const a=R()*TAU,rr=Math.sqrt(R())*c,px=c+Math.cos(a)*rr,py=c+Math.sin(a)*rr,r=2+R()*7;x.fillStyle=R()<.35?`rgba(180,96,74,${.3+R()*.35})`:`rgba(146,112,72,${.2+R()*.3})`;x.beginPath();x.ellipse(px,py,r,r*(.5+R()*.5),R()*3,0,TAU);x.fill();}
  x.strokeStyle='rgba(255,250,236,.5)';x.lineWidth=2;for(let i=0;i<300;i++){const a=R()*TAU,rr=Math.sqrt(R())*c*.95,px=c+Math.cos(a)*rr,py=c+Math.sin(a)*rr;x.beginPath();x.moveTo(px,py);x.lineTo(px+(R()-.5)*40,py+(R()-.5)*40);x.stroke();}
  x.strokeStyle='rgba(120,80,50,.45)';x.lineWidth=5;x.beginPath();x.moveTo(c+c*.42,c-c*.88);x.quadraticCurveTo(c+c*.32,c,c+c*.42,c+c*.88);x.stroke();
  x.strokeStyle='#f5eddb';x.lineWidth=16;x.beginPath();x.arc(c,c,c-8,0,TAU);x.stroke();
  x.strokeStyle='#9fcfe2';x.lineWidth=24;x.beginPath();x.arc(c,c,c-12,-1.25,1.25);x.stroke();x.restore();});
const ballTex=canvasTex(256,128,(x,w,h)=>{x.fillStyle='#f3f1ea';x.fillRect(0,0,w,h);x.lineWidth=14;x.strokeStyle='#2b62c4';x.beginPath();x.moveTo(0,40);x.bezierCurveTo(70,0,130,90,256,40);x.stroke();x.strokeStyle='#e8b52c';x.beginPath();x.moveTo(0,92);x.bezierCurveTo(80,128,150,50,256,92);x.stroke();x.strokeStyle='rgba(40,40,40,.35)';x.lineWidth=2;for(let i=0;i<w;i+=42){x.beginPath();x.moveTo(i,0);x.lineTo(i+20,h);x.stroke();}});
const netTex=canvasTex(128,128,(x,w,h)=>{x.clearRect(0,0,w,h);x.strokeStyle='rgba(240,240,240,.9)';x.lineWidth=3;for(let i=0;i<=w;i+=16){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(w,i);x.stroke();}},[6,4]);
const postTex=canvasTex(32,256,(x,w,h)=>{for(let j=0;j<h;j+=32){x.fillStyle=(j/32)%2?'#f1efe8':'#c8322a';x.fillRect(0,j,w,32);}});

/* ================= materialen ================= */
const BONEm=K.BONE(),BONE2=std(0xefe3c8,{roughness:.55,side:THREE.DoubleSide}),CARTm=std(0xa9d6e6,{roughness:.22}),CART2=std(0xa9d6e6,{roughness:.22,side:THREE.DoubleSide});
const ribM=std(0xe4d4b4,{roughness:.68}),costM=std(0xa8ccd6,{roughness:.32}),discM=std(0x9cc3cf,{roughness:.4}),vertM=std(0xe6d6b6,{roughness:.62});
const ligM=std(0xf3efe6,{roughness:.35}),labM=std(0xd5ecef,{roughness:.38,emissive:0xff3a2a,emissiveIntensity:0});
const brass=std(0xc79a4a,{metalness:.8,roughness:.32});
const COL={ssp:0xe3a53b,isp:0x3aa6c8,tm:0x9a86e6,ssc:0x4fb46a,del:0xb8473a};

/* ================= algemene spierbundels (strengen langs een Bézierbaan met omwikkeling) ================= */
// elke streng: oorsprong O, controlepunten C1 en C2, aanhechting I. Elk punt is [frame, V]. Daarna worden punten
// die in een omwikkelbol vallen naar het oppervlak geduwd: zo wikkelen pezen om de kop.
function mkMus(o){const mat=std(0xffffff,{map:o.nomap?null:fibTex,roughness:.5,emissive:new THREE.Color(o.col),emissiveIntensity:0});
  const im=inst(UCYL,mat,o.n*o.k);o.parent.add(im);
  const st=[];for(let i=0;i<o.n;i++){const u=o.n>1?i/(o.n-1):.5;st.push({O:o.O(u,i),I:o.I(u,i),C1:o.C1?o.C1(u,i):null,C2:o.C2?o.C2(u,i):null,sh:.86+R()*.28,rj:.88+R()*.26,w:[V(0,0,0),V(0,0,0),V(0,0,0),V(0,0,0)]});}
  const m={o,im,mat,st,act:0,col:new THREE.Color(o.col),tcol:new THREE.Color(o.tcol||0xefe7d7),mid:V(0,0,0),ins:V(0,0,0),org:V(0,0,0),len:0,len0:0,sw:1,pts:[],wc:(o.wrap||[]).map(()=>V(0,0,0)),strain:0,hide:null};
  for(let j=0;j<=o.k;j++)m.pts.push(V(0,0,0));return m;}
function upMus(m){const o=m.o,k=o.k,pts=m.pts,F=o.F;let n=0;const mid=o.n>>1;let len=0;const wr=o.wrap||[];
  for(let q=0;q<wr.length;q++)m.wc[q].copy(wr[q][1]).applyMatrix4(F[wr[q][0]]);
  for(let i=0;i<m.st.length;i++){const s=m.st[i];const O=s.w[0].copy(s.O[1]).applyMatrix4(F[s.O[0]]),I=s.w[3].copy(s.I[1]).applyMatrix4(F[s.I[0]]);const A=s.w[1],B=s.w[2];
    if(s.C1)A.copy(s.C1[1]).applyMatrix4(F[s.C1[0]]);else A.lerpVectors(O,I,1/3);if(s.C2)B.copy(s.C2[1]).applyMatrix4(F[s.C2[0]]);else B.lerpVectors(O,I,2/3);
    for(let j=0;j<=k;j++){const t=j/k,u=1-t,b0=u*u*u,b1=3*u*u*t,b2=3*u*t*t,b3=t*t*t;const p=pts[j];
      p.set(O.x*b0+A.x*b1+B.x*b2+I.x*b3,O.y*b0+A.y*b1+B.y*b2+I.y*b3,O.z*b0+A.z*b1+B.z*b2+I.z*b3);
      for(let q=0;q<wr.length;q++){const c=m.wc[q],r=wr[q][2];_d.subVectors(p,c);const L=_d.length();if(L<r&&L>1e-6)p.copy(c).addScaledVector(_d,r/L);}}
    for(let j=0;j<k;j++){const t=(j+.5)/k;if(m.hide&&m.hide(i,j)){m.im.setMatrixAt(n++,ZERO);continue;}const r=o.r(t,i)*(t<(o.tend||0)?m.sw*s.rj:1);_e.subVectors(pts[j+1],pts[j]);if(i===mid)len+=_e.length();_e.multiplyScalar(.07);
      _a.copy(pts[j]).sub(_e);_b.copy(pts[j+1]).add(_e);m.im.setMatrixAt(n++,segMatrix(_a,_b,r));}
    if(i===mid){m.mid.copy(pts[Math.round(k*(o.midT||.35))]);m.ins.copy(pts[k]);m.org.copy(pts[1]);}}
  m.im.instanceMatrix.needsUpdate=true;m.len=len;if(!m.len0)m.len0=len;
  // een spier die korter wordt, wordt dikker (volume blijft gelijk): straal ~ wortel(rustlengte / lengte)
  if(o.swell)m.sw=clamp(Math.sqrt(m.len0/Math.max(len,1e-4)),.85,o.swMax||1.35);}
function colMus(m,fn){let n=0;const o=m.o;for(let i=0;i<m.st.length;i++){const s=m.st[i];for(let j=0;j<o.k;j++){const t=(j+.5)/o.k;
    if(fn)fn(_c,t,i,s);else{const tw=smooth((t-o.tend)/.1);_c.copy(m.col).multiplyScalar((.58+.55*m.act)*s.sh);_c.lerp(m.tcol,tw);}m.im.setColorAt(n++,_c);}}
  m.im.instanceColor.needsUpdate=true;m.mat.emissiveIntensity=.32*m.act;}
// spierbuik: vlezig en breed aan de oorsprong, dikst op een derde, en dan aflopend naar de pees
const belly=(rb,rt,tend)=>(t)=>{if(t>=tend)return rt;const b=t/tend;const f=b<.35?.74+.26*Math.sin(Math.PI/2*b/.35):Math.pow(Math.cos(Math.PI/2*(b-.35)/.65),.75);return rt+(rb-rt)*f;};
function tensCol(c,s){if(s<.55)c.setHex(0xb9b0a3).lerp(_c2.setHex(0xf6f2ea),clamp(s/.55,0,1));else if(s<1)c.setHex(0xf6f2ea);else c.setHex(0xf6f2ea).lerp(_c2.setHex(0xff3a2a),clamp((s-1)/.35,0,1));return c;}

/* ======================================================================
   NIVEAU 0 · de schouder op de sokkel
   ====================================================================== */
const G0=groups[0];
K.base({parent:G0,floor:'gym',plaque:['ARTICULATIO HUMERI','schoudergewricht en rotator cuff · rechts'],plaqueX:-2.4});
const GY=6.0;
const M=new THREE.Group();M.position.set(-1.6,0,-.4);G0.add(M);
// handbaldoel achterin
(function(){const g=new THREE.Group();g.position.set(6.4,.08,-4.9);G0.add(g);const pm=std(0xffffff,{map:postTex,roughness:.5});
  [-2.25,2.25].forEach(x=>mesh(new THREE.BoxGeometry(.12,3.0,.12),pm,[x,1.5,0],0,0,g));mesh(new THREE.BoxGeometry(4.62,.12,.12),std(0xffffff,{map:postTex,roughness:.5}),[0,3.0,0],[0,0,Math.PI/2],[1,1,1],g);
  const nm=new THREE.MeshBasicMaterial({map:netTex,transparent:true,opacity:.55,side:THREE.DoubleSide,depthWrite:false});
  const back=mesh(new THREE.PlaneGeometry(4.5,2.9),nm,[0,1.45,-.9],0,0,g);back.castShadow=false;
  [-2.25,2.25].forEach(x=>{const s=mesh(new THREE.PlaneGeometry(.9,2.9),nm,[x,1.45,-.45],[0,Math.PI/2,0],0,g);s.castShadow=false;});
  const top=mesh(new THREE.PlaneGeometry(4.5,.9),nm,[0,2.95,-.45],[Math.PI/2,0,0],0,g);top.castShadow=false;})();

// borstkas (rechterhelft): ribben, kraakbeen, borstbeen en wervelkolom
const THX=new THREE.Group();M.add(THX);
const RCX=6.0,RCZ=.3;
// ribben 1–9: kop aan de wervel, knobbel aan het dwarsuitsteeksel, dan de hoek en een boog die naar voren flink daalt;
// rib 1–7 lopen via kraakbeen naar het borstbeen, rib 8–9 sluiten aan op het kraakbeen erboven
const tgeo=(pts,r,seg,rs)=>new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),seg||40,r,rs||8);
const ribEnds=[];
for(let i=0;i<9;i++){const tr=i<7,yh=GY+1.75-i*.62;
  const ys=tr?GY+.3-i*.6:ribEnds[6].y-.12-(i-7)*.32,zs=tr?lerp(2.45,2.95,i/6):2.5-(i-7)*.45,xs=tr?RCX-.42:RCX-1.55-(i-7)*.55;
  const a=[2.55,3.05,3.4,3.65,3.82,3.92,3.97,3.92,3.8][i],b=(lerp(2.45,2.95,Math.min(i,6)/6)+2.5)/1.92,cz=-2.5+.92*b;
  const ye=ys-(tr?.38*i/6:.25);const bone=[V(RCX-.4,yh,-2.36),V(RCX-.92,yh+.04,-2.78)];
  const TH0=24,TH1=tr?126:120;
  for(let k=0;k<=14;k++){const u=k/14,th=(TH0+u*(TH1-TH0))*D2R;bone.push(V(RCX-a*Math.sin(th)*(1-.05*u*u),yh+(ye-yh)*Math.pow(u,1.18),cz-b*Math.cos(th)));}
  const e=bone[bone.length-1];const thE=TH1*D2R;
  const cart=[e.clone(),V(RCX-a*Math.sin(thE+12*D2R)*.92,lerp(e.y,ys,.45),cz-b*Math.cos(thE+12*D2R)*.97),V(lerp(RCX-a*.35,xs,.5),lerp(e.y,ys,.85),lerp(cz+b*.93,zs,.5)),V(xs,ys,zs)];
  ribEnds.push(V(xs,ys,zs));
  const rb=mesh(tgeo(bone,.1-i*.002,64,9),ribM,0,0,[1,1,1],THX);rb.castShadow=false;
  const cm=mesh(tgeo(cart,.085,20,8),costM,0,0,0,THX);cm.castShadow=false;}
// borstbeen: handvat met halsinkeping, lichaam en zwaardvormig uitsteeksel
(function(){const sh=new THREE.Shape(),o=[[0,.02],[-.2,.08],[-.5,.02],[-.56,-.35],[-.4,-.88],[-.42,-1.0],[-.4,-2.2],[-.44,-3.3],[-.3,-3.95],[-.12,-4.15],[-.06,-4.65],[0,-4.75]];
  sh.moveTo(o[0][0],o[0][1]);o.slice(1).forEach(p=>sh.lineTo(p[0],p[1]));for(let i=o.length-2;i>=1;i--)sh.lineTo(-o[i][0],o[i][1]);sh.lineTo(0,.02);
  const g=new THREE.ExtrudeGeometry(sh,{depth:.2,bevelEnabled:true,bevelThickness:.05,bevelSize:.05,bevelSegments:2,curveSegments:2});g.translate(0,0,-.1);
  const st=mesh(g,ribM,[RCX,GY+.62,2.5],[-.11,0,0],0,THX);st.castShadow=false;})();
// wervelkolom: getailleerde wervellichamen, tussenwervelschijven, wervelboog met doorn- en dwarsuitsteeksels

  else{const tx=['De arm draait ver naar buiten. Het voorste kapsel en de onderste band (IGHL) spannen aan als een hangmat.','De kop wordt naar voren gedrukt en duwt tegen het labrum.','Het labrum scheurt aan de voorkant los van de rand: een <b>Bankart-letsel</b>. De kop slaat tegen de rand en krijgt een deuk (Hill-Sachs).','De kop ligt vóór de kom. Het kapsel is overrekt en het labrum hangt los: het vangnet is kapot.'];
    K.capSet(K.stateText(),tx[L2.lux<.05?0:L2.tear<.5?1:L2.lux<.95?2:3]);}},
 reset(n,isCur){L2.flashed=false;L2.tm=0;if(n!==3){L2.lux=0;}
  // in stand 3 schuift de kop naar voren: kijk er dan schuin van boven op, zodat hij in beeld blijft
  if(n===3&&isCur&&!K.FILM.on&&window.__atlas&&!S.zooming)window.__atlas.flyTo(...CAM.l2lux,1.2);},
 // kom je in stand 3 binnen via de zoomladder, dan pakt de motor eerst het standaardbeeld: kijk daarna ook schuin van boven
 onShow(){L2.luxView=S.state===3;},
 hud(){return S.state===3?`<div class="hudcol">${K.stepsHTML(['Uithaal','Naar voren','Labrum los','Uit de kom'])}${K.bars(['Spanning IGHL','Verschuiving'])}</div>`:K.bars(['Rotatie','Rollen','Glijden','Kop uit midden']);},
 ctl(){return S.state===2?`<button id="bCuff" class="${L2.cuff?'on':''}" aria-pressed="${L2.cuff}">Cuff: ${L2.cuff?'aan':'uit'}</button>`:'';},

  if(S.state===3&&L2.lux>.98&&!s.clunk){s.clunk=1;api.thump(60,.5,.5);}if(S.state!==3||L2.lux<.1)s.clunk=0;}
};

const HUB=[HB],SCB=[SB],CLV=[CLB];
const points=[
 {lv:0,state:1,name:'Opperarmkop',lat:'Caput humeri',at:()=>W.head,view:[[-6.6,8.6,6.1],[-2.4,6.0,-.5]],focus:()=>[HB,glenI],pick:()=>[HB],tabs:[
  `<p>De kop van je opperarm is bijna bolvormig en bedekt met glad kraakbeen (blauw). Hij past in de kom van het schouderblad, de <i>cavitas glenoidalis</i>.</p><p>De kop is veel groter dan de kom: maar een kwart tot een derde van de kop raakt de kom tegelijk. Daardoor kan de arm bijna alle kanten op.</p><p>Naast de kop liggen twee knobbels: de grote (<i>tuberculum majus</i>) en de kleine (<i>tuberculum minus</i>). Daar hechten de pezen van de cuff.</p>`,
  `<p>Bij de borstcrawl draait de kop duizenden keren per training in de kom. Zwemmers halen veel bewegingsuitslag uit hun schouder. Ze zijn ook gevoelig voor overbelasting, omdat de cuff de kop telkens opnieuw moet centreren.</p>`,
  `<p>Het kraakbeenoppervlak van de kop is ongeveer drie keer zo groot als dat van de kom. Bij de heup omsluit de kom ruim de helft van de kop. Vergelijk het in <a href="heup.html">halte 7, de heup</a>.</p>`,
  `<p class="think">Waarom is een ondiepe kom handig voor een werper, en waarom is hij lastig voor een turner die in de handstand op zijn handen steunt?</p>`]},
 {lv:0,name:'Schouderblad',lat:'Scapula · acromion · processus coracoideus',at:()=>W.scap,view:[[-.9,12,-9.4],[.1,5.2,-1.6]],focus:()=>[SB],state:2,tabs:[
  `<p>Het schouderblad is een plat, driehoekig bot op de achterkant van je ribben. Het zit alleen via het sleutelbeen aan de romp vast; verder hangt het in spieren.</p><p>Op de achterkant loopt de schouderbladkam (<i>spina scapulae</i>). Die gaat naar buiten over in het schouderdak, het <b>acromion</b>. Aan de voorkant steekt het ravenbekuitsteeksel uit, de <b>processus coracoideus</b>.</p><p>In stand 2 zie je het schouderblad meedraaien: de onderpunt zwaait naar buiten.</p>`,
  `<p>Bij steunen aan de brug of bij push-ups houden de voorste zaagspier (<i>m. serratus anterior</i>) en de monnikskapspier (<i>m. trapezius</i>) het schouderblad tegen de romp. Lukt dat slecht, dan komt de binnenrand los van de ribben: een ‘vleugelend’ schouderblad.</p>`,
  `<p>Bij 180° heffen komt ongeveer 120° uit het schoudergewricht en 60° uit het schouderblad: een verhouding van ongeveer 2 : 1. Inman en collega’s beschreven dit ritme in 1944.</p>`,
  `<p class="think">Wat gebeurt er met de ruimte onder het acromion als het schouderblad níet goed meedraait bij het heffen?</p>`]},
 {lv:0,state:1,name:'Sleutelbeen en AC-gewricht',lat:'Clavicula · articulatio acromioclavicularis',at:()=>W.clav,view:[[5.1,11.5,11.6],[1.6,6.8,.4]],focus:()=>[CLB,SB],pick:()=>[CLB],tabs:[
  `<p>Het sleutelbeen is de enige botverbinding tussen arm en romp. Binnen zit het aan het borstbeen (SC-gewricht), buiten aan het acromion (AC-gewricht).</p><p>Bij het heffen van de arm gaat het sleutelbeen iets omhoog en draait het mee. Zo kan het schouderblad over de borstkas glijden.</p>`,
  `<p>Een val op de punt van de schouder, bij judo, wielrennen of een tackle, kan de banden van het AC-gewricht laten scheuren of het sleutelbeen breken. Leer leerlingen een valbreek: afrollen over de schouderbladen en de klap spreiden, in plaats van recht op de punt van de schouder of op een gestrekte arm te landen.</p>`,
  `<p>Ongeveer drie kwart van alle sleutelbeenbreuken zit in het middelste deel van het bot, waar de S-vorm van richting verandert.</p>`,
  `<p class="think">Waarom breekt een sleutelbeen eerder in het midden dan aan de uiteinden? Kijk naar de vorm van het bot.</p>`]},
 {lv:0,state:1,name:'Bovendoornspier',lat:'M. supraspinatus',at:()=>W.ssp,view:[[-2.4,10.5,-7.5],[-.6,6.4,-1.2]],focus:()=>[SSP.im,HB,SB],pick:()=>[SSP.im],layer:'Rotator cuff',tabs:[
  `<p>De supraspinatus ligt boven de schouderbladkam en loopt onder het acromion door naar de bovenkant van de grote knobbel.</p><p>Hij werkt tijdens het hele heffen mee met de deltaspier. In het begin is zijn aandeel relatief groot. Tegelijk drukt hij de kop in de kom, zodat de deltaspier de kop niet omhoog tegen het dak trekt.</p>`,
  `<p>Bij volleybal, handbal en zwemmen werkt de supraspinatus bij elke bovenhandse beweging. Zijn pees komt het vaakst klem te zitten (zoom in naar <b>Onder het acromion</b>) en scheurt ook het vaakst.</p>`,
  `<p>Ongeveer een centimeter vóór de aanhechting ligt een zone met weinig bloedvaten: de kritieke zone (Codman, 1934). Daar beginnen de meeste peesscheuren. Hoe slecht die plek echt doorbloed is, staat nog ter discussie.</p>`,
  `<p class="think">In stand 2 licht de supraspinatus op als de arm omhoog gaat. Werkt hij ook als je de arm langzaam laat zakken? Op welke manier?</p>`]},
 {lv:0,state:1,name:'Onderdoornspier en kleine ronde spier',lat:'M. infraspinatus · m. teres minor',at:()=>W.isp,view:[[-4.4,7,-10.4],[-.4,4.6,-1.4]],focus:()=>[ISP.im,TM.im,HB,SB],pick:()=>[ISP.im,TM.im],layer:'Rotator cuff',tabs:[
  `<p>Aan de achterkant liggen de infraspinatus (onder de kam, blauw) en de teres minor (langs de buitenrand, paars). Ze hechten aan de achterkant van de grote knobbel.</p><p>Samen zijn ze de belangrijkste <b>exorotatoren</b>: ze draaien de arm naar buiten. Ze trekken de kop ook iets omlaag en naar achteren.</p>`,
  `<p>Na de worp remmen deze spieren de arm af terwijl hij razendsnel naar binnen draait. Dat is zwaar <b>excentrisch</b> werk. Een werper met zwakke exorotatoren voelt dat na een wedstrijd achter in de schouder.</p>`,
  `<p>Bij een honkbalworp draait de arm tot ongeveer 7000° per seconde naar binnen, een van de snelste bewegingen van het menselijk lichaam (Fleisig e.a., 1995).</p>`,
  `<p class="think">Waarom train je in een warming-up voor werpen vooral de exorotatie, terwijl de worp zelf een endorotatie is?</p>`]},
 {lv:0,state:1,name:'Onderschouderbladspier',lat:'M. subscapularis',at:()=>W.ssc,view:[[2.6,7.5,11.6],[-.6,4.8,0]],focus:()=>[SSC.im,HB,SB],pick:()=>[SSC.im],layer:'Rotator cuff',tabs:[
  `<p>De subscapularis (groen) ligt aan de voorkant van het schouderblad, tussen schouderblad en ribben. Hij hecht aan de kleine knobbel.</p><p>Hij draait de arm naar binnen (endorotatie). Met zijn brede pees vormt hij een levende wand vóór de kop: een buffer tegen een voorste luxatie.</p>`,
  `<p>In de uithaal van een worp wordt de subscapularis gerekt, daarna zet hij de worp in. Bij een geblokte worp moet hij de kop tegenhouden. Is de kracht te groot, dan schiet de kop er toch langs (stand 3).</p>`,
  `<p>De subscapularis is de grootste spier van de cuff: ongeveer de helft van het totale doorsnede-oppervlak van de vier cuffspieren (Keating e.a., 1993).</p>`,
  `<p class="think">Bij welke armstand wordt de subscapularis het meest gerekt: bij endorotatie of bij exorotatie? Wat betekent dat voor de stabiliteit aan de voorkant?</p>`]},
 {lv:0,state:1,name:'Deltaspier',lat:'M. deltoideus',at:()=>W.delt,view:[[-9.4,8,6.6],[-2.4,5.2,-.4]],focus:()=>DELT.map(m=>m.im).concat([HB]),pick:()=>DELT.map(m=>m.im),layer:'Deltaspier',tabs:[
  `<p>De deltaspier geeft je schouder zijn ronde vorm. Hij heeft drie delen: voor (van het sleutelbeen), midden (van het acromion) en achter (van de schouderbladkam). Alle delen komen samen halverwege de opperarm.</p><p>Bij een hangende arm trekt hij vooral omhoog langs de opperarm. Zonder cuff zou hij de kop tegen het acromion trekken.</p>`,
  `<p>Bij een handstand, een shoulder press of een smash werkt de deltaspier hard. Zet bij <b>Lagen</b> de deltaspier uit en weer aan: zo zie je dat de cuff eronder ligt, dicht op het gewricht.</p>`,
  `<p>De naam komt van de Griekse letter delta (Δ): de spier is driehoekig. Het middelste deel is veervormig, met veel korte, schuine bundels. Dat geeft veel kracht, maar weinig verkorting.</p><p>Bij een hangende arm heeft de deltaspier een kleine momentarm voor abductie. Hoe dat werkt, zie je in <a href="biomechanica.html">Biomechanica</a> bij momenten.</p>`,
  `<p class="think">De deltaspier trekt bij een hangende arm bijna recht omhoog. Waarom heeft hij in het begin van het heffen hulp nodig van de supraspinatus?</p>`]},
 {lv:0,name:'De handballer',lat:'Articulatio humeri in beweging',at:()=>W.fig,view:[[-3.7,4.3,6.4],[-6.0,2.3,.2]],focus:()=>[F.root,Dd.root,ball],pick:()=>[F.root],state:2,tabs:[
  `<p>De handballer beweegt synchroon met het model. In stand 2 heft hij de arm zijwaarts, in stand 3 zie je een sprongschot met een blok.</p><p>Kijk naar de meter in de HUD: de wijzer toont de totale heffing, de blauwe boog het deel uit het schouderblad, en het rode stuk de pijnlijke boog.</p>`,
  `<p>Bij een sprongschot staat de werparm in de uithaal in ongeveer 90° abductie en maximale exorotatie. In die stand is de kop aan de voorkant het minst beschermd. Bouw een werples daarom op van licht en kort naar hard en ver.</p>`,
  `<p>In een onderzoek bij Noorse elitehandballers had op elk moment van het seizoen gemiddeld 28% schouderklachten (Clarsen e.a., 2014).</p>`,
  `<p class="think">Een leerling gooit met een lage elleboog en vooral ‘uit de schouder’. Wat laat je oefenen, en waarom helpt dat de schouder?</p>`]},
 {lv:1,name:'Slijmbeurs',lat:'Bursa subacromialis',at:()=>W.bursa1,view:[[-6,6,13],[-1.5,1.5,0]],focus:()=>[BUR,W.acroMesh1,HG1],pick:()=>[BUR],layer:'Slijmbeurs',tabs:[
  `<p>Tussen het schouderdak en de supraspinatuspees ligt een platte zak met een beetje vocht: de slijmbeurs. Hij laat de pees soepel onder het dak glijden.</p><p>Kijk in stand 2: waar de knobbel onder het dak schuift, wordt de slijmbeurs platgedrukt en kleurt hij rood.</p>`,
  `<p>Een zwemmer die veel meters maakt, of een volleyballer met veel smashes, kan een geïrriteerde slijmbeurs krijgen (bursitis). Dan doet zijwaarts heffen tussen ongeveer 60° en 120° pijn.</p>`,
  `<p>Een gezonde slijmbeurs is maar 1 à 2 millimeter dik. Bij een bursitis is hij op een echo duidelijk dikker.</p>`,
  `<p class="think">Waarom doet heffen bij 170° vaak minder pijn dan bij 90°, terwijl de arm dan hoger staat?</p>`]},
 {lv:1,name:'Supraspinatuspees',lat:'Tendo musculi supraspinati',at:()=>W.tend1,view:[[.1,3.5,18.6],[2.6,.8,0]],focus:()=>[TEN,HG1],pick:()=>[TEN],tabs:[
  `<p>De pees bestaat uit dicht opeengepakte collageenvezels met een golfpatroon (<i>crimp</i>). Onder spanning strekt dat golfje zich.</p><p>Bovenop de grote knobbel hecht de pees. Vlak daarvoor ligt de kritieke zone met weinig bloedvaten: de vaatjes uit de spier en uit het bot bereiken die plek nauwelijks.</p>`,
  `<p>Overbelasting ontstaat door te veel herhalingen met te weinig herstel, bijvoorbeeld een volleybaltoernooi na een rustige periode. Bouw bovenhandse belasting daarom geleidelijk op.</p>`,
  `<p>Van de 50-plussers heeft ongeveer een op de vijf een scheur in de rotator cuff, vaak zonder klachten (Tempelhof e.a., 1999).</p>`,
  `<p class="think">Waarom geneest een pees langzamer dan een spier? Denk aan de bloedvaten die je in het model ziet.</p>`]},
 {lv:1,name:'Schouderdak',lat:'Acromion · lig. coracoacromiale · processus coracoideus',at:()=>W.acro1,view:[[4,7,16],[2,2.5,1.5]],focus:()=>[W.acroMesh1],pick:()=>[W.acroMesh1],tabs:[
  `<p>Het dak boven de pees bestaat uit het acromion, het ravenbekuitsteeksel (<i>processus coracoideus</i>) en de band ertussen (<i>lig. coracoacromiale</i>). Samen vormen ze een stevige boog.</p><p>De voorkant van het acromion is hier doorgesneden: je ziet het sponsachtige bot binnenin.</p><p>Artsen en fysiotherapeuten spreken bij pijn onder het dak tegenwoordig vaak van subacromiaal pijnsyndroom (SAPS). Inklemming is daarvan een vereenvoudigd model.</p>`,
  `<p>Bij bovenhandse sporten wordt de ruimte onder het dak telkens kleiner. Spieren die het schouderblad goed laten meedraaien (trapezius, serratus anterior) houden de ruimte groter. Neem ze mee in de warming-up.</p>`,
  `<p>Een normale afstand tussen kop en acromion op een röntgenfoto is ongeveer 7 tot 14 mm (Petersson en Redlund-Johnell, 1984). In dit model is het in rust ongeveer 10 mm.</p>`,
  `<p class="think">In stadium 3 groeit er een benige uitloper onder het acromion. Wat doet dat met de ruimte, en waarom wordt het dan een vicieuze cirkel?</p>`]},
 {lv:2,name:'Labrum',lat:'Labrum glenoidale',at:()=>W.lab2,view:[[6,14,22],[2,-.5,4]],focus:()=>[LABA,LABP,GLEN2],pick:()=>[LABA,LABP],tabs:[
  `<p>Het labrum is een ring van vezelkraakbeen rond de rand van de kom. In doorsnede is het driehoekig, als een wig.</p><p>Het maakt de kom ongeveer twee keer zo diep en sluit de kop af als een zuignap.</p>`,
  `<p>Bij werpers en turners kan het labrum bovenaan losraken, waar de lange bicepspees aanhecht. Bij een voorste luxatie scheurt het meestal vóór en onder (Bankart-letsel, stand 3).</p>`,
  `<p>Zonder labrum is de kom van voor naar achter maar ongeveer 2,5 mm diep, met labrum ongeveer 5 mm (Howell en Galinat, 1989).</p>`,
  `<p class="think">Waarom gaat een schouder met een losgescheurd labrum makkelijker opnieuw uit de kom?</p>`]},
 {lv:2,name:'Kapsel en banden',lat:'Capsula articularis · ligamenta glenohumeralia',at:()=>W.cap2,view:[[17,27,40],[-2,-2,4]],focus:()=>[CAP,LIGseg,LIGj,GLEN2,H2],pick:()=>[CAP,LIGseg,LIGj],layer:'Kapsel en banden',tabs:[
  `<p>Het kapsel is een ruime zak rond het gewricht. In de voorwand zitten verdikkingen: de glenohumerale banden. De onderste band (<b>IGHL</b>) is de belangrijkste.</p><p>In de middenstand zijn de banden slap (grijs). Ze spannen pas aan het eind van een beweging, vooral bij abductie met exorotatie. Dan ligt de onderste band als een hangmat onder en vóór de kop.</p>`,
  `<p>Dat is precies de uithaalstand bij werpen. Bij hulpverlenen aan rekstok of ringen trek je daarom nooit aan een arm die gestrekt, zijwaarts en naar buiten gedraaid staat. Zwaai je aan de ringen, dan loopt de kracht door je schouder. Bekijk het in het lab <a href="ringen.html">Ringen</a>.</p>`,
  `<p>O’Brien en collega’s beschreven in 1990 de onderste band als een hangmat met een voorste en een achterste bundel. In het model zie je de voorste bundel (IGHL), de achterste bundel, en hoger in de voorwand de middelste band (MGHL).</p>`,
  `<p class="think">Kijk in stand 3 hoe de band van wit naar rood kleurt. Welke armstand vermijd je dus bij een leerling die net een luxatie heeft gehad?</p>`]},
 {lv:2,name:'Lange bicepspees',lat:'Tendo capitis longi musculi bicipitis brachii',at:()=>W.bic2,view:[[-14,13,18],[-10,-1,6]],focus:()=>[BIC2,H2],pick:()=>[BIC2],tabs:[
  `<p>De lange kop van de biceps begint bovenaan de kom, aan het labrum. Hij loopt over de kop naar beneden door een groef tussen de twee knobbels.</p><p>In de doorsnede zie je hem als een witte cirkel in die groef. Zo loopt de biceps over twee gewrichten: de schouder en de elleboog.</p>`,
  `<p>Bij werpen en bij het afremmen na de worp trekt de biceps hard aan het bovenste labrum. Dat kan het labrum daar losmaken. Meer over de biceps in <a href="elleboog.html">halte 5, de elleboog</a>.</p>`,
  `<p>Een scheur in het bovenste labrum heet een SLAP-letsel: <i>Superior Labrum Anterior to Posterior</i>. De naam komt van Snyder en collega’s (1990).</p>`,
  `<p class="think">Waarom kan een biceps die bij de elleboog hard werkt, ook klachten geven in de schouder?</p>`]}];

function portShift(v,k){if(!PORT||!v)return v;const a=V(...v[0]),b=V(...v[1]);const f=b.clone().sub(a);const d=f.length()*1.9;f.normalize();const u=V(0,1,0).addScaledVector(f,-f.y).normalize();a.addScaledVector(u,-k*d);b.addScaledVector(u,-k*d);return [a.toArray(),b.toArray()];}
