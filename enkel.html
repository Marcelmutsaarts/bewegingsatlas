<script>

   Drie zoomniveaus: de enkel onder de basket (20 cm), de buitenbanden (3 cm) en het bandweefsel (0,5 mm).

const CFG={
 id:'enkel',halte:10,name:'Enkel',

 seed:10,
 shadow:{left:-12,right:12,top:12,bottom:-7},
 levels:[
  {name:'Enkel',scale:'20 cm',sc:'GEWRICHT',title:'De enkel',sub:'<i>Articulatio talocruralis</i> en <i>subtalaris</i> · onder de basket',
   get view(){return innerWidth<760?[[3.2,6.6,15.5],[-1.6,1.7,0]]:[[7.2,8.2,20.4],[-.5,2.7,-.3]];},zoomTo:[-3.25,1.95,.95],s1:'Rust',s2:'Sprong',s3:'Verzwikken',
   bg:['#3d352b','#201b16','#0d0b09'],fog:0x201b16,hemi:.62,shadows:true},
  {name:'Banden',scale:'3 cm',sc:'BANDEN',title:'De buitenbanden',sub:'<i>Lig. talofibulare anterius</i>, <i>calcaneofibulare</i> en <i>talofibulare posterius</i>',
   view:[[5.6,2.0,20.5],[.8,-.9,0]],zoomTo:[2.2,.25,.7],s1:'Rust',s2:'Rek',s3:'Scheur',
   bg:['#2f3c45','#172028','#0a0e11'],fog:0x172028,hemi:.5},
  {name:'Bandweefsel',scale:'0,5 mm',sc:'WEEFSEL',title:'Bandweefsel',sub:'<i>Fibrae collagenosae</i>, fibroblasten en mechanoreceptoren',
   view:[[2.4,2.8,14.2],[-.3,.1,0]],s1:'Rust',s2:'Rek',s3:'Scheur',
   bg:['#3f2b36','#21161c','#0d080b'],fog:0x21161c,hemi:.85,drone:true}],
 help:{title:'Zo werkt de zoomreis',
  html:`<p>Je begint bij een vergrote <b>rechterenkel</b> op een krachtplaat, onder een basket. Naast het model springt een basketballer om een schot te blokken; de tegenstander staat stil. In stand 2 en 3 beweegt het model mee met de rechterenkel van de speler. In stand 1 stuur je het model zelf met de schuiven; de camera volgt dan de enkel. Daarna zoom je twee keer in:</p>
  <ul><li><b>Enkel</b> (≈ 20 cm): botten, het bovenste en onderste spronggewricht met hun draaiassen, de banden, de kuitspier en de kuitbeenspieren.</li>
  <li><b>Banden</b> (≈ 3 cm): de drie buitenbanden ATFL, CFL en PTFL als bundels vezels.</li>
  <li><b>Bandweefsel</b> (≈ 0,5 mm): collageenvezels met hun golfpatroon (crimp), fibroblasten en mechanoreceptoren met een zenuwvezel die impulsen vuurt.</li></ul>
  <h3>Drie standen, op elk niveau</h3>
  <p><b>1 · Rust</b>: verkennen, met schuiven voor de voetstand of de rek. <b>2 · Sprong</b> of <b>Rek</b>: afzet en landing, of de band die gerekt wordt. <b>3 · Verzwikken</b> of <b>Scheur</b>: een inversietrauma, met graad 1–3.</p>
  <h3>Kleuren</h3>
  <p>Banden: <b>grijs</b> is slap, <b>wit</b> is gespannen, <b>oranje</b> is zwaar belast (strak) en <b>rood</b> is overrekt. Spiervezels gloeien op als ze aanspannen.</p>
  <p>De <b>oranje as</b> is de draaias van het bovenste spronggewricht, de <b>blauwe as</b> die van het onderste. De <b>oranje pijl</b> is de grondreactiekracht onder de rechtervoet (× LG = keer je lichaamsgewicht). Op twee voeten draagt elke voet ongeveer een half lichaamsgewicht. De <b>blauwe boog</b> in stand 3 is het moment om de as van het onderste spronggewricht: de draaiende werking die de voet naar binnen kantelt.</p>`,
  states:'Rust · sprong of rek · verzwikken of scheur',
  note:'Vereenvoudigd didactisch model: aantallen, kleuren en verhoudingen zijn aangepast om het zichtbaar te maken. De voorvoet en de tenen zijn schematisch. Dit is geen hulpmiddel om een blessure te beoordelen.'},
 film:{brand:'ENKEL',blurb:'Hoe een enkel verzwikt · ca. 4 minuten · met stem en ondertitels',file:'enkel-uitleg'},
 quizEnd:'<p>Bespreek de slotvraag met je groep. Probeer daarna in de gymzaal een balanscircuit op één been: eerst met de ogen open, dan dicht, dan op een balanskussen. Merk je het verschil?</p>',
 build(K){
const {THREE,V,R,clamp,lerp,smooth,D2R,TAU,mesh,std,glass,glow,add,inst,segMatrix,placeMatrix,ZERO,orient,BAND,UCYL,canvasTex,lathe,boneGeo,W,S}=K;
const G0=K.groups[0],G1=K.groups[1],G2=K.groups[2];
const _a=V(0,0,0),_b=V(0,0,0),_d=V(0,0,0),_e=V(0,0,0),_f=V(0,0,0),_g=V(0,0,0),_c=new THREE.Color(),_q=new THREE.Quaternion();
const AXX=V(1,0,0),AXZ=V(0,0,1);
let TEMPO=1;
const fmt=(v,d)=>(+v).toFixed(d===undefined?1:d).replace('.',',');
const ramp=(x,a,b)=>clamp((x-a)/(b-a),0,1);
function table(T,u){if(u<=T[0][0])return T[0][1];for(let i=1;i<T.length;i++){if(u<=T[i][0]){const t=(u-T[i-1][0])/(T[i][0]-T[i-1][0]);return lerp(T[i-1][1],T[i][1],t);}}return T[T.length-1][1];}
function nd(m){m.castShadow=false;return m;}

/* ---------- gedeelde bouwstenen ---------- */
// afgeronde, licht onregelmatige vorm (superellipsoïde) voor botten en cellen
function blobGeo(sx,sy,sz,p,nz,seg){seg=seg||30;const g=new THREE.SphereGeometry(1,seg,Math.round(seg*.7));const a=g.attributes.position,e=2/(p||2.5),ph=R()*20,n0=nz===undefined?.03:nz;
  const f=v=>Math.sign(v)*Math.pow(Math.abs(v),e);
  for(let i=0;i<a.count;i++){const x=a.getX(i),y=a.getY(i),z=a.getZ(i);const n=1+n0*2*Math.sin(x*4.7+ph)*Math.sin(y*3.9+ph*.6)*Math.sin(z*4.3+ph*1.4);a.setXYZ(i,f(x)*sx*n,f(y)*sy*n,f(z)*sz*n);}
  g.computeVertexNormals();return g;}
function blob(sx,sy,sz,mat,pos,parent,o){o=o||{};return mesh(blobGeo(sx,sy,sz,o.p,o.nz,o.seg),mat,pos,o.rot,0,parent);}
function longBone(a,b,r,mat,parent,k1,k2){_d.subVectors(b,a);const L=_d.length();const m=mesh(boneGeo(L,r,k1===undefined?.7:k1,k2===undefined?.55:k2,16),mat,0,0,0,parent);m.position.copy(a);m.quaternion.setFromUnitVectors(K.AY,_d.normalize());return m;}
// een buigzame streng (pees, bloedvat, zenuw) uit cilindersegmenten langs een kromme door bewegende punten
function rope(n,r,mat,parent,geo){const m=inst(geo||UCYL,mat,n);m.castShadow=false;parent.add(m);const cv=new THREE.CatmullRomCurve3([V(0,0,0),V(0,1,0)]);const P=[];for(let i=0;i<=n;i++)P.push(V(0,0,0));
  const o={m,cv,P,hide:null,set(ctrl){cv.points=ctrl;for(let i=0;i<=n;i++)cv.getPoint(i/n,P[i]);
    for(let i=0;i<n;i++){if(o.hide&&i>=o.hide[0]&&i<=o.hide[1]){m.setMatrixAt(i,ZERO);continue;}_e.subVectors(P[i+1],P[i]).multiplyScalar(.14);_a.copy(P[i]).sub(_e);_b.copy(P[i+1]).add(_e);m.setMatrixAt(i,segMatrix(_a,_b,r));}
    m.instanceMatrix.needsUpdate=true;}};return o;}
function spindle(len,r0,r1,rm,mat,parent,pos){const pts=[];for(let i=0;i<=18;i++){const t=i/18;pts.push([lerp(r0,r1,t)+rm*Math.sin(Math.PI*t),t*len]);}pts.push([.001,len]);return lathe(pts,mat,parent,22,pos);}
// strekking van de banden (in %) als functie van de voetstand: plantairflexie pf en inversie inv in graden
// Binnen de normale uitslag (tot ≈ 45° strekken en 30° inversie, zonder gewicht) blijft de rek onder ≈ 5%; pas voorbij ≈ 30–36° inversie loopt hij snel op.
function strains(pf,inv){const P=Math.max(pf,0),I=Math.max(inv,0);
  return {atfl:-1.5+.06*pf+.1*inv+.0006*P*I+.35*Math.max(0,inv-30),cfl:-1-.06*pf+.12*inv+.15*Math.max(0,inv-36),ptfl:-1-.14*pf+.05*inv,delt:-1.5-.2*inv+.03*pf};}
// loft: een organische vorm uit doorsneden langs een as. secs = [[t, c1, c2, r1, r2, p?], …]; bij as 'y' is (c1,c2,r1,r2) = (x,z,rx,rz), bij as 'x' = (y,z,ry,rz).
// p is de 'hoekigheid' van de doorsnede (2 = ellips, 3 = afgeronde rechthoek). De doorsneden worden vloeiend geïnterpoleerd (Catmull-Rom).
const WP=V(0,0,0);
function loftGeo(secs,o){o=o||{};const seg=o.seg||40,sub=o.sub||5,p0=o.p||2.4,nz=o.nz===undefined?.02:o.nz,ax=o.axis||'y',ph=R()*20,vr=o.vrep||.22;
  const n=secs.length,gs=i=>secs[Math.max(0,Math.min(n-1,i))],cr=(a,b,c,d,t)=>.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
  const rows=[];for(let i=0;i<n-1;i++)for(let k=0;k<(i===n-2?sub+1:sub);k++){const t=k/sub,a=gs(i-1),b=gs(i),c=gs(i+1),d=gs(i+2),r=[];for(let q=0;q<6;q++){const f=v=>v[q]===undefined?p0:v[q];r.push(cr(f(a),f(b),f(c),f(d),t));}r[3]=Math.max(.002,r[3]);r[4]=Math.max(.002,r[4]);r[5]=Math.max(1.6,r[5]);if(o.pmax)r[5]=Math.min(o.pmax,r[5]);rows.push(r);}
  const NR=rows.length,W1=seg+1,pos=[],uv=[],col=[],idx=[];const t0=rows[0][0];
  rows.forEach((r,ri)=>{const e=2/r[5];for(let j=0;j<=seg;j++){const th=j/seg*TAU,cu=Math.cos(th),sv=Math.sin(th);const u=Math.sign(cu)*Math.pow(Math.abs(cu),e),v=Math.sign(sv)*Math.pow(Math.abs(sv),e);
    const a1=r[1]+r[3]*u,a2=r[2]+r[4]*v;let x,y,z;if(ax==='y'){x=a1;y=r[0];z=a2;}else{x=r[0];y=a1;z=a2;}
    const nn=1+nz*(Math.sin(x*3.1+ph)*Math.sin(y*2.7+ph*.6)*Math.sin(z*3.3+ph*1.4)+.4*Math.sin(x*7.3+y*5.1+ph));
    if(ax==='y'){x=r[1]+(x-r[1])*nn;z=r[2]+(z-r[2])*nn;}else{y=r[1]+(y-r[1])*nn;z=r[2]+(z-r[2])*nn;}
    if(o.warp){WP.set(x,y,z);o.warp(WP,u,v,r);x=WP.x;y=WP.y;z=WP.z;}
    pos.push(x,y,z);uv.push(j/seg,(r[0]-t0)*vr);if(o.col){o.col(x,y,z,r,_c);col.push(_c.r,_c.g,_c.b);}}});
  for(let i=0;i<NR-1;i++)for(let j=0;j<seg;j++){const a=i*W1+j,b=a+W1;idx.push(a,b,a+1,b,b+1,a+1);}
  [0,NR-1].forEach((ri,k)=>{const r=rows[ri];const c=pos.length/3;if(ax==='y')pos.push(r[1],r[0]+(k?1:-1)*.002,r[2]);else pos.push(r[0]+(k?1:-1)*.002,r[1],r[2]);uv.push(.5,k);if(o.col){o.col(pos[c*3],pos[c*3+1],pos[c*3+2],r,_c);col.push(_c.r,_c.g,_c.b);}
    for(let j=0;j<seg;j++){const a=ri*W1+j;if(k)idx.push(a,a+1,c);else idx.push(a+1,a,c);}});
  // zorg dat de driehoeken naar buiten wijzen (teken van het volume)
  let vol=0;for(let i=0;i<idx.length;i+=3){const A=idx[i]*3,B=idx[i+1]*3,C=idx[i+2]*3;vol+=pos[A]*(pos[B+1]*pos[C+2]-pos[B+2]*pos[C+1])-pos[A+1]*(pos[B]*pos[C+2]-pos[B+2]*pos[C])+pos[A+2]*(pos[B]*pos[C+1]-pos[B+1]*pos[C]);}
  if(vol<0)for(let i=0;i<idx.length;i+=3){const t=idx[i];idx[i]=idx[i+1];idx[i+1]=t;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));if(o.col)g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setIndex(idx);g.computeVertexNormals();
  const N=g.attributes.normal;for(let i=0;i<NR;i++){const a=i*W1,b=a+seg;_d.set(N.getX(a)+N.getX(b),N.getY(a)+N.getY(b),N.getZ(a)+N.getZ(b)).normalize();N.setXYZ(a,_d.x,_d.y,_d.z);N.setXYZ(b,_d.x,_d.y,_d.z);}
  return g;}
function loft(secs,mat,parent,o){return mesh(loftGeo(secs,o),mat,0,0,0,parent);}
// een bundel gladde vezelstrengen in één geometrie: elke streng is een buis langs een kromme die elk frame wordt bijgewerkt
function Bundle(nS,Kseg,RS,mat,parent){const W1=RS+1,PR=(Kseg+1)*W1,nV=nS*PR;const pos=new Float32Array(nV*3),nor=new Float32Array(nV*3),col=new Float32Array(nV*3).fill(1),uv=new Float32Array(nV*2),idx=[];
  for(let s=0;s<nS;s++)for(let j=0;j<=Kseg;j++)for(let r=0;r<=RS;r++){const v=s*PR+j*W1+r;uv[v*2]=r/RS;uv[v*2+1]=j/Kseg;if(j<Kseg&&r<RS){const b=v+W1;idx.push(v,b,v+1,b,b+1,v+1);}}
  const g=new THREE.BufferGeometry();const aP=new THREE.BufferAttribute(pos,3),aN=new THREE.BufferAttribute(nor,3),aC=new THREE.BufferAttribute(col,3);[aP,aN,aC].forEach(a=>a.setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('position',aP);g.setAttribute('normal',aN);g.setAttribute('color',aC);g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(idx);
  const m=new THREE.Mesh(g,mat);m.frustumCulled=false;m.castShadow=false;m.receiveShadow=true;parent.add(m);
  const T=V(),Nn=V(),Bn=V();
  return {m,g,K:Kseg,RS,
   set(s,P,side,rad,colAt){for(let j=0;j<=Kseg;j++){T.subVectors(P[Math.min(Kseg,j+1)],P[Math.max(0,j-1)]);if(T.lengthSq()<1e-12)T.set(0,1,0);T.normalize();Nn.crossVectors(T,side);if(Nn.lengthSq()<1e-6)Nn.crossVectors(T,AXX);Nn.normalize();Bn.crossVectors(T,Nn).normalize();
     const r=rad(j),c=colAt(j);for(let q=0;q<=RS;q++){const th=q/RS*TAU,cs=Math.cos(th),sn=Math.sin(th);const v=(s*PR+j*W1+q)*3;const nx=Nn.x*cs+Bn.x*sn,ny=Nn.y*cs+Bn.y*sn,nz2=Nn.z*cs+Bn.z*sn;
      pos[v]=P[j].x+nx*r;pos[v+1]=P[j].y+ny*r;pos[v+2]=P[j].z+nz2*r;nor[v]=nx;nor[v+1]=ny;nor[v+2]=nz2;col[v]=c.r;col[v+1]=c.g;col[v+2]=c.b;}}},
   done(){aP.needsUpdate=aN.needsUpdate=aC.needsUpdate=true;}};}
const fibTex=canvasTex(128,32,(x,w,h)=>{x.fillStyle='#ffffff';x.fillRect(0,0,w,h);for(let i=0;i<w;i+=3){x.fillStyle=`rgba(120,105,85,${.08+R()*.2})`;x.fillRect(i,0,1,h);}for(let j=0;j<h;j+=4){x.fillStyle='rgba(255,255,255,.18)';x.fillRect(0,j,w,1);}});
// radiale kleuring voor bloeduitstorting: donkerrood in de kern, paarsblauw aan de rand (per vertex, naar de kijkrichting 'out')
function bruiseCol(g,out,seed){const P=g.attributes.position,N=g.attributes.normal,c=new Float32Array(P.count*3);const k1=new THREE.Color(0x160103),k2=new THREE.Color(0x2c0409),k3=new THREE.Color(0x1e1838);
  for(let i=0;i<P.count;i++){_d.set(N.getX(i),N.getY(i),N.getZ(i));const d=clamp(_d.dot(out),-1,1);const w=.5+.5*d+.12*Math.sin(P.getX(i)*9+seed)*Math.sin(P.getY(i)*7+seed);
    if(w>.6)_c.copy(k2).lerp(k1,clamp((w-.6)/.4,0,1));else _c.copy(k3).lerp(k2,clamp(w/.6,0,1));c[i*3]=_c.r;c[i*3+1]=_c.g;c[i*3+2]=_c.b;}
  g.setAttribute('color',new THREE.BufferAttribute(c,3));return g;}
const TEAR=6.5;
function ligCol(e,vr,torn,near){if(torn){if(near)_c.setRGB(.6,.12,.09);else _c.setRGB(.82,.5,.44);return _c;}
  let r,g,b;if(e<0){const t=clamp(-e/3,0,1);r=lerp(.84,.5,t);g=lerp(.83,.52,t);b=lerp(.78,.56,t);}
  else if(e<4){const t=e/4;r=lerp(.84,1,t);g=lerp(.83,1,t);b=lerp(.78,.96,t);}
  else if(e<TEAR){const t=(e-4)/(TEAR-4);r=1;g=lerp(1,.56,t);b=lerp(.96,.36,t);}
  else{const t=clamp((e-TEAR)/3,0,1);r=lerp(1,.92,t);g=lerp(.56,.17,t);b=lerp(.36,.12,t);}
  return _c.setRGB(r*vr,g*vr,b*vr);}
function eText(e,torn){return torn?'gescheurd':e<0?'slap':e<4?fmt(e)+'% gespannen':e<TEAR?fmt(e)+'% strak':fmt(e)+'% overrekt';}
function eCls(e,torn){return torn||e>=TEAR?'bad':e>=4?'ecc':e>=0?'ok':'';}
function eBg(e,torn){return torn?'#8f2a20':e<0?'#7c828a':e<4?'#e9e4d8':e<TEAR?'#f0a35d':'#e86a5a';}
function eFrac(e){return clamp((e+3)/14,0,1);}
function angText(pf){const a=Math.round(Math.abs(pf));return a<2?'neutraal':pf>0?a+'° plantair':a+'° dorsaal';}
function invText(i){const a=Math.round(Math.abs(i));return a<2?'neutraal':i>0?a+'° inversie':a+'° eversie';}
const SQ=v=>{K.SND.tone(2300+R()*600,.06,.035*(v||1),'sine',undefined,3400);K.SND.noise(.05,'bandpass',3800,6,.03*(v||1),.004);};
const THUD=v=>{K.SND.thump(85,.22,.34*(v||1));K.SND.noise(.08,'lowpass',500,.7,.1*(v||1),.003);};

/* ---------- texturen ---------- */
const boneTex=canvasTex(512,512,(x,w,h)=>{x.fillStyle='#ece0c4';x.fillRect(0,0,w,h);

  const hl=S2.heal;NEW.visible=hl>.01;if(hl>.01){newD.forEach((n,i)=>{const s=smooth(hl*1.5-n.v*.5);_a.copy(n.c).addScaledVector(n.d,-n.l*.5*s);_b.copy(n.c).addScaledVector(n.d,n.l*.5*s);NEW.setMatrixAt(i,s>.01?segMatrix(_a,_b,.045):ZERO);});NEW.instanceMatrix.needsUpdate=true;}
  fblM.emissiveIntensity=hl*(.5+.3*Math.sin(S.clock*3));
  gs.rotation.x=S.clock*.01;gs.position.x=Math.sin(S.clock*.15)*.2;
  // ankers
  const fb=FBL.reduce((b,c)=>(c.z>.7&&Math.abs(c.x-.4)<Math.abs(b.x-.4))||b.z<=.7&&c.z>b.z?c:b,FBL[0]);W.fbl=V(fb.x*(1+e*1.6),fb.y,fb.z+.15);W.col=V(1.0*(1+e*1.6),HP2[0][0]+.9,1.75);W.ruf=RUF.position.clone().add(V(0,.5,.25));W.pac=PAC.position.clone().add(V(0,.65,.3));W.cap=capCv.getPointAt(.38).add(V(0,.12,.3));W.nerve=AXN[0].nodes[Math.min(5,AXN[0].nodes.length-1)];
  // HUD
  K.bar(1,clamp(e/.11,0,1),fmt(e*100)+'% rek',e>.06?'bad':e>.03?'ecc':'ok',e>.06?'var(--bad)':e>.03?'#f0a35d':'var(--ok)');
  const cr=clamp(amp/.19,0,1);K.bar(2,cr,cr>.7?'golvend':cr>.15?'deels glad':'glad',cr<.15?'iso':'', '#e9e4d8');
  K.bar(3,clamp(S2.fR/90,0,1),Math.round(S2.fR)+' Hz'+(S2.rufDam?' · schade':''),S2.rufDam?'bad':'con','#ffd76a');
  if(st===1)K.capSoft(K.stateText(),S2.e<.005?'Collageenvezels liggen in een golfpatroon: de <b>crimp</b>. Tussen de vezels liggen fibroblasten (paars) en een <b>Ruffini-lichaampje</b>. Schuif de rek op.':S2.e<.03?'Bij een paar procent rek trekt de golf glad (de teenzone). De Ruffini-sensor vuurt sneller.':'De crimp is weg: nu rekt het collageen zelf. De band wordt stijf en de sensor vuurt snel.',1);
  else if(st===2)K.capSoft(K.stateText(),S2.e>.03?'De vezels staan strak. Het Ruffini-lichaampje wordt samengedrukt en vuurt veel impulsen: <b>proprioceptie</b>.':'De rek neemt toe en af. Kijk naar de golf, de sensor en de impulsen in de zenuwvezel.',1.8);
  else K.capSoft(K.stateText(),t<.5?'Een te grote rek komt eraan…':t<1.7?'Boven ongeveer 6 tot 8% rek knappen de eerste vezels. Het haarvat scheurt mee.':t<4.6?'Gescheurde vezels krullen terug. Het Ruffini-lichaampje is beschadigd: de zenuwvezel meldt <b>bijna niets</b> meer. De enkel meldt zijn stand minder goed. Daardoor kunnen de spieren later reageren.':'Herstel: fibroblasten worden actief en leggen nieuw collageen neer, eerst <b>ongeordend</b> en zwakker. Balanstraining helpt het gevoel terug te winnen.',1.4);}
const H2={step:step2,reset(n){reset2(n);S2.ph2=0;},hud(){return K.bars(['Rek','Crimp','Vuurfrequentie'])+'<canvas id="scope" width="330" height="46" role="img" aria-label="Impulsen van de zenuwvezels van het Ruffini- en het Pacini-lichaampje"></canvas>';},
 ctl(){const st=S.state;if(st===1)return `<label for="sRek">Rek</label><input type="range" id="sRek" min="0" max="6" step=".1" value="${S2.man}" aria-label="Rek van de band in procent"><output id="oRek">${fmt(S2.man)}%</output>`;if(st===2)return `<label for="sT2">Tempo</label><input type="range" id="sT2" min=".25" max="1.5" step=".05" value="${TEMPO}" aria-label="Tempo">`;return '';},
 bind(){scopeEl=K.$('#scope');const r=K.$('#sRek');if(r)r.addEventListener('input',()=>{S2.man=+r.value;const o=K.$('#oRek');if(o)o.textContent=fmt(S2.man)+'%';});const t=K.$('#sT2');if(t)t.addEventListener('input',()=>{TEMPO=+t.value;});},

const P=[
 {lv:0,name:'Scheenbeen en binnenenkel',lat:'Tibia · malleolus medialis',at:()=>W.tib,view:[[-.4,6.2,-9.6],[-3.3,4.1,.1]],focus:()=>[tib,medMal,tibCap],tabs:[
  `<p>Het <b>scheenbeen</b> (tibia) draagt bijna al je lichaamsgewicht naar de voet. Onderaan vormt het het dak van het enkelgewricht. Aan de binnenkant steekt de <b>binnenenkel</b> (malleolus medialis) uit: de knobbel die je aan de binnenkant van je enkel voelt.</p><p>Met de buitenenkel van het kuitbeen vormt het scheenbeen een vork, de <b>enkelvork</b>. Daarin zit het sprongbeen geklemd.</p>`,
  `<p>Bij een landing vangt het scheenbeen de klap op. Hoe verder je door enkels en knieën zakt, hoe langer die klap duurt en hoe kleiner de piekkracht. Op <a href="landing.html">landing.html</a> reken je dat uit met impuls. Ook de knie vangt een deel van de klap op: zie <a href="knie.html">halte 9, de knie</a>.</p>`,
  `<p>De binnenenkel eindigt ongeveer 1 cm hoger dan de buitenenkel, en ligt iets meer naar voren. Daarom loopt de draaias van het bovenste spronggewricht (oranje) niet recht van links naar rechts, maar iets schuin.</p>`,
  `<p class="think">Voel aan je eigen enkel: welke knobbel ligt lager, de binnen- of de buitenenkel? Wat betekent dat voor de kant waarnaar de voet het makkelijkst kantelt?</p>`]},
 {lv:0,name:'Kuitbeen en buitenenkel',lat:'Fibula · malleolus lateralis',at:()=>W.fib,view:[[-1.9,4.4,8.4],[-3.5,2.9,.4]],focus:()=>[fib,latMal,latMal2,fibCap],tabs:[
  `<p>Het <b>kuitbeen</b> (fibula) is dun en draagt maar een klein deel van je gewicht. Het onderste uiteinde is de <b>buitenenkel</b> (malleolus lateralis). Die reikt lager dan de binnenenkel en vormt de buitenwand van de enkelvork.</p><p>Op de buitenenkel beginnen de drie buitenbanden: de ATFL naar voren, de CFL naar beneden en de PTFL naar achteren.</p>`,
  `<p>Na een verzwikking zitten pijn en zwelling meestal vlak vóór en onder de buitenenkel, precies waar de ATFL en de CFL lopen. Jij stelt in de les geen diagnose: twijfel je, laat de sporter dan stoppen en verwijs door.</p>`,
  `<p>Ongeveer 85% van alle enkelverstuikingen is een <b>inversietrauma</b>: de voet klapt naar binnen en de banden aan de buitenkant raken beschadigd.</p>`,
  `<p class="think">Waarom kan de voet veel verder naar binnen kantelen (inversie) dan naar buiten (eversie)? Kijk naar de lengte van de twee enkelknobbels.</p>`]},
 {lv:0,name:'Sprongbeen en bovenste spronggewricht',lat:'Talus · articulatio talocruralis',at:()=>W.tal,view:[[-1.6,2.9,6.4],[-3.4,1.9,.5]],focus:()=>talus.concat([talCart,axTCm]),tabs:[
  `<p>Het <b>sprongbeen</b> (talus) zit met een rol, de trochlea, in de enkelvork. In dit <b>bovenste spronggewricht</b> beweegt de voet op en neer om de oranje as: <b>plantairflexie</b> (strekken, tenen omlaag) en <b>dorsaalflexie</b> (optrekken).</p><p>Op de talus hecht geen enkele spier. Hij wordt op zijn plek gehouden door botten en banden.</p>`,
  `<p>De rol is aan de voorkant breder dan aan de achterkant. Trek je de voet op, zoals aan het eind van een landing (hiel neer, knieën gebogen) of bij een squat, dan klemt het brede deel in de vork: stabiel. Strek je de voet, zoals bij de afzet, in de lucht en bij het eerste contact van de landing, dan zit het smalle deel in de vork: meer speling (blauw licht in stand 2).</p>`,
  `<p>Een gemiddelde enkel haalt ongeveer 20° dorsaalflexie en 40 à 50° plantairflexie.</p>`,
  `<p class="think">Waarom verzwikken mensen makkelijker op hoge hakken of als ze op hun tenen landen?</p>`]},
 {lv:0,name:'Hielbeen en onderste spronggewricht',lat:'Calcaneus · articulatio subtalaris',at:()=>W.calc,view:[[-6.4,2.6,6.6],[-4.6,1.3,.3]],focus:()=>calc.concat(fore,[axSTm]),tabs:[
  `<p>Het <b>hielbeen</b> (calcaneus) is het grootste bot van de voet. Tussen sprongbeen en hielbeen ligt het <b>onderste spronggewricht</b>. Zijn draaias (blauw) loopt schuin: van achter, buiten en onder naar voor, binnen en boven.</p><p>Om die as kantelt de voet naar binnen (<b>inversie</b>) en naar buiten (<b>eversie</b>). De voorvoet draait mee.</p>`,
  `<p>Op ongelijke grond, zoals een bal of de voet van een tegenstander, past dit gewricht de voet aan. Valt de grondreactiekracht naast die schuine as, dan ontstaat een moment dat de voet doet kantelen (stand 3). Op <a href="evenwicht.html">evenwicht.html</a> zie je hoe dat werkt bij een klein steunvlak.</p>`,
  `<p>De as van het onderste spronggewricht staat gemiddeld ongeveer 40° schuin omhoog en ongeveer 20° naar binnen ten opzichte van de lengteas van de voet (Inman, 1976).</p>`,
  `<p class="think">Kantel in stand 1 de voet naar binnen. Kijk naar de tenen: welke bewegingen maakt de voorvoet tegelijk mee? Hoe komt dat door de schuine as?</p>`]},
 {lv:0,name:'Deltaband',lat:'Lig. collaterale mediale (lig. deltoideum)',at:()=>W.delt,layer:'Banden',view:[[-2.2,2.8,-6.6],[-3.4,1.9,-.4]],focus:()=>[LG0.delt.m,medMal],tabs:[
  `<p>Aan de binnenkant waaiert de <b>deltaband</b> uit vanaf de binnenenkel naar het sprongbeen, het hielbeen en het os naviculare. Hij is dik en sterk en remt de <b>eversie</b>: het naar buiten kantelen van de voet.</p>`,
  `<p>Een letsel van de deltaband is veel zeldzamer dan een buitenbandletsel. Draai het model naar de binnenkant en zet in stand 1 de schuif <b>Inversie</b> op een negatieve waarde (eversie): de deltaband kleurt wit.</p>`,
  `<p>In een klassiek trekonderzoek bezweek de deltaband pas bij ongeveer 714 N, de ATFL al bij ongeveer 139 N (Attarian e.a., 1985).</p>`,
  `<p class="think">Een volleyballer landt op de buitenrand van haar voet. Welke banden worden gerekt, en welke worden juist slap?</p>`]},
 {lv:0,name:'Kuitspier en achillespees',lat:'M. triceps surae · tendo calcaneus',at:()=>W.ach,layer:'Spieren',view:[[-10.5,5.4,9],[-4.9,3.7,.2]],focus:()=>[calfM,achM,apon,calfCap],state:2,tabs:[
  `<p>De <b>kuitspier</b> (de twee koppen van de gastrocnemius en de soleus) trekt via de <b>achillespees</b> aan het hielbeen. Zo strekt hij de voet (plantairflexie). De pees werkt als een veer: bij de landing rekt hij een paar procent op en bij de afzet geeft hij die energie terug.</p>`,
  `<p>Bij de <b>afzet</b> wordt de spier korter terwijl hij kracht levert: <b>concentrisch</b>. Bij de <b>landing</b> zakt de hiel en wordt de spier langer terwijl hij remt: <b>excentrisch</b>. Kijk in stand 2 naar de kleur van de vezels en naar het rode streepje op het onderbeen van de speler.</p>`,
  `<p>Bij hardlopen trekt de kuitspier met ongeveer 9 kN aan de achillespees, ruim twaalf keer het lichaamsgewicht (Komi, 1990).</p>`,
  `<p class="think">Waarom spring je hoger met een korte, snelle tegenbeweging dan vanuit een diepe hurk waarin je eerst stilstaat?</p>`]},
 {lv:0,name:'Kuitbeenspieren',lat:'Mm. fibulares longus et brevis',at:()=>W.per,layer:'Spieren',view:[[-2.9,4.6,8.4],[-4,3.4,.6]],focus:()=>[perL,perB,rPL.m,rPB.m],tabs:[
  `<p>Aan de buitenkant van het onderbeen liggen de <b>lange en de korte kuitbeenspier</b>. Hun pezen lopen achter de buitenenkel langs, als over een katrol. De korte hecht aan de basis van het vijfde middenvoetsbeen; de lange loopt onder de voet door naar de binnenrand.</p><p>Ze kantelen de voet naar buiten (eversie): de actieve tegenhangers van een verzwikking.</p>`,
  `<p>Bij een plotselinge inversie spannen ze reflexmatig aan. Maar de voet kan al binnen ongeveer 50 ms doorgezwikt zijn, en de spieren vuren pas na ongeveer 60 à 80 ms. Daarna duurt het nog tientallen milliseconden voordat de spier echt kracht levert: de elektromechanische vertraging. Spieren die al vóór de landing aanspannen (voorspanning) beschermen beter. Meer over reflexen in <a href="zenuw.html">halte 1</a>.</p>`,
  `<p>In proeven met een kantelplatform, dat de voet plots naar binnen laat klappen, begint de elektrische activiteit (EMG) van de kuitbeenspieren na ongeveer 50 à 80 ms. Zo’n reactie is te traag om een snelle verzwikking nog te stoppen (bijvoorbeeld Konradsen e.a., 1997).</p>`,
  `<p class="think">Als de reflex toch te laat komt, waarom helpt balanstraining op één been dan wel tegen verzwikken?</p>`]},
 {lv:0,name:'De basketballer',lat:'Inversietrauma bij de landing',at:()=>W.sport,layer:'Sporters',view:[[7.4,2.5,8.6],[3.6,1.1,1.7]],focus:()=>[A.root,B.root,ball],state:3,tabs:[
  `<p>In stand 3 springt de speler om een schot te blokken en landt hij met zijn rechtervoet op de voet van de tegenstander. De voet is gestrekt en kantelt naar binnen. Het hele lichaamsgewicht komt op de buitenrand. Het model links doet precies hetzelfde.</p>`,
  `<p>Organisatie helpt: genoeg ruimte onder de basket en bij het net, geen losse ballen in het speelveld, en de afspraak dat je niet onder een springende speler doorloopt. Gebeurt het toch: laat de sporter stoppen, ontlast de enkel en schakel hulp in.</p>`,
  `<p>Bij volleybal ontstaat het grootste deel van de enkelverstuikingen bij het net, vaak bij een landing op de voet van een tegenstander of medespeler (Bahr en Bahr, 1997).</p>`,
  `<p class="think">Je geeft basketbal aan een klas van 28 leerlingen. Noem drie afspraken of organisatievormen die de kans op een landing op andermans voet kleiner maken.</p>`]},
 {lv:1,name:'Voorste talofibulaire band',lat:'Lig. talofibulare anterius (ATFL)',at:()=>W.atfl1,view:[[5,1.6,9],[2.2,.2,.2]],focus:()=>[L1.atfl.m,sh1.atfl],tabs:[
  `<p>De <b>ATFL</b> loopt van de voorkant van de buitenenkel naar de hals van het sprongbeen. Het is een platte verdikking van het gewrichtskapsel, ongeveer 2 cm lang en maar een paar millimeter dik, vaak in twee bundels.</p><p>Bij een gestrekte voet loopt hij bijna in de lengterichting van het been. Juist dan remt hij de inversie.</p>`,
  `<p>Bij ongeveer twee op de drie verstuikingen is alleen de ATFL beschadigd. Bekijk stand 3 en kies graad 1, 2 of 3: van enkele gescheurde vezelbundels tot een volledig doorgescheurde band.</p>`,
  `<p>In het trekonderzoek van Attarian e.a. (1985) bezweek de ATFL al bij ongeveer 139 N, de CFL bij ongeveer 346 N. De ATFL is de zwakste van de drie buitenbanden.</p>`,
  `<p class="think">Waarom is de ATFL juist bij een gestrekte voet zo kwetsbaar? Kijk in stand 2 naar de richting van de band.</p>`]},
 {lv:1,name:'Calcaneofibulaire band',lat:'Lig. calcaneofibulare (CFL)',at:()=>W.cfl1,view:[[1.2,-1.6,10],[-.8,-2.2,.6]],focus:()=>[L1.cfl.m,sh1.cfl],tabs:[
  `<p>De <b>CFL</b> is een ronde streng van de punt van de buitenenkel schuin naar achteren en beneden, naar het hielbeen. Hij overbrugt twee gewrichten: het bovenste én het onderste spronggewricht. Hij staat strak bij inversie, vooral als de voet neutraal of opgetrokken is.</p>`,
  `<p>De CFL scheurt meestal pas na de ATFL, bij meer kracht. Over de CFL heen lopen de pezen van de kuitbeenspieren. Zet de laag <b>Pezen</b> aan: je ziet ze over de band heen lopen, achter de buitenenkel langs.</p>`,
  `<p>Bij ongeveer één op de vijf verstuikingen scheurt naast de ATFL ook de CFL.</p>`,
  `<p class="think">Waarom maakt een scheur in de CFL twee gewrichten tegelijk instabieler?</p>`]},
 {lv:1,name:'Achterste talofibulaire band',lat:'Lig. talofibulare posterius (PTFL)',at:()=>W.ptfl1,view:[[-6.5,1.4,7],[-1.6,-.2,-1.6]],focus:()=>[L1.ptfl.m,sh1.ptfl],tabs:[
  `<p>De <b>PTFL</b> ligt diep, achter de buitenenkel. Hij loopt vrijwel horizontaal van een groeve aan de binnenkant van de buitenenkel naar het achterste uitsteeksel van het sprongbeen. Hij is dik en sterk en staat strak bij dorsaalflexie.</p>`,
  `<p>Een scheur in de PTFL is zeldzaam. Die zie je vrijwel alleen bij een zware verstuiking met ontwrichting of een botbreuk. In stand 3 met graad 3 rafelen een paar vezels.</p>`,
  `<p>In het onderzoek van Attarian e.a. (1985) bezweek de PTFL bij ongeveer 261 N: bijna twee keer zoveel als de ATFL, maar minder dan de CFL (ongeveer 346 N). Andere studies vinden de PTFL juist het sterkst.</p>`,
  `<p class="think">Waarom staat de PTFL strak als je na de landing diep doorzakt (voet opgetrokken), en is hij slap bij de afzet (voet gestrekt)?</p>`]},
 {lv:2,name:'Collageenvezels en crimp',lat:'Fibrae collagenosae · collagenum typus I',at:()=>W.col,view:[[6.5,2.4,8.5],[3.4,.4,.6]],focus:()=>[colM],tabs:[
  `<p>Bandweefsel bestaat vooral uit <b>collageen type I</b> in strakke, evenwijdige bundels. In rust liggen de vezels in een golfpatroon: de <b>crimp</b>.</p><p>Bij rek trekt eerst die golf glad (de teenzone, tot ongeveer 2 à 3% rek). Pas daarna rekt het collageen zelf, en wordt de band stijf.</p>`,
  `<p>De crimp is een buffer: kleine rekbewegingen kosten weinig kracht. Boven ongeveer 6 à 8% rek ontstaan microscheurtjes; rond 10% scheuren de vezels door. Probeer in stand 1 de schuif <b>Rek</b> en kijk naar stand 3.</p>`,
  `<p>Bandweefsel bestaat voor ongeveer twee derde uit water. Van de rest is het grootste deel collageen, ongeveer 70 à 80%.</p>`,
  `<p class="think">Waarom is het handig dat een band bij een snelle landing eerst een stukje ‘gratis’ kan rekken?</p>`]},
 {lv:2,name:'Fibroblasten',lat:'Fibroblasti · fibrocyti',at:()=>W.fbl,view:[[1.5,2.8,7],[.4,.5,1]],focus:()=>[FBLM,NUCM],tabs:[
  `<p>Tussen de vezels liggen langgerekte cellen in rijen: <b>fibroblasten</b>. Ze maken het collageen en de grondsubstantie eromheen, en ze vernieuwen de band heel langzaam.</p>`,
  `<p>Na een scheur leggen fibroblasten eerst ongeordend, dunner collageen neer: littekenweefsel. Door geleidelijk en gecontroleerd te belasten richten de nieuwe vezels zich naar de trekrichting. Wacht in stand 3 even af.</p>`,
  `<p>Na zes weken is een gescheurde band nog lang niet zo sterk als vroeger. Het weefsel blijft vaak maanden tot meer dan een jaar veranderen.</p>`,
  `<p class="think">Waarom is ‘het doet geen pijn meer’ geen goed teken dat de band weer sterk genoeg is om te sporten?</p>`]},
 {lv:2,name:'Mechanoreceptoren',lat:'Corpuscula Ruffini et corpuscula lamellosa (Pacini)',at:()=>W.ruf,view:[[.2,1.4,11],[-2.0,.1,1.4]],focus:()=>[RUF,PAC,MYM,PULM].concat(AXN.map(a=>a.tb)),state:2,tabs:[
  `<p>In de band zitten sensoren. Het <b>Ruffini-lichaampje</b> past zich traag aan: het meldt hoe ver de band gerekt is, dus hoe je enkel staat. Het <b>Pacini-lichaampje</b> (de ui van vliesjes) past zich snel aan: het meldt plotselinge veranderingen.</p><p>Hun zenuwvezels sturen impulsen naar het ruggenmerg en de hersenen. Zo weet je zonder te kijken hoe je enkel staat: <b>proprioceptie</b>.</p>`,
  `<p>Bij een scheur raken ook sensoren en zenuwuiteinden beschadigd (stand 3). De enkel ‘voelt’ minder, je spieren reageren later, en je verzwikt makkelijker opnieuw. Balanstraining traint dat systeem opnieuw. Meer in <a href="zenuw.html">halte 1</a> en op <a href="evenwicht.html">evenwicht.html</a>.</p>`,
  `<p>Een thuisprogramma van acht weken met balansoefeningen verlaagde de kans op een nieuwe verstuiking met ongeveer een derde (Hupperets e.a., 2009). De Nederlandse app ‘Versterk je enkel’ is op dat programma gebaseerd.</p>`,
  `<p class="think">Sta op één been, eerst met de ogen open en dan dicht. Waarom is het met de ogen dicht moeilijker? Welke informatie moet je enkel dan leveren?</p>`]}];
